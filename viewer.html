<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Live Camera Viewer</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 15px;
}

#status {
  margin: 15px;
  font-size: 17px;
}

#buttons {
  margin: 15px;
}

button {
  padding: 12px 20px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
}

button.active {
  outline: 3px solid #888;
}

video {
  width: 95%;
  max-width: 900px;
  background: #000;
  border-radius: 10px;
  margin: 10px auto;
  display: block;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">
Connecting...
</div>

<div id="buttons">
  <button id="frontBtn">
    📷 Front Camera
  </button>

  <button id="backBtn">
    📷 Back Camera
  </button>
</div>

<video
  id="remoteVideo"
  autoplay
  playsinline
  muted>
</video>

<script>
const status =
  document.getElementById("status");

const frontBtn =
  document.getElementById("frontBtn");

const backBtn =
  document.getElementById("backBtn");

const remoteVideo =
  document.getElementById("remoteVideo");

const ws = new WebSocket(
  (location.protocol === "https:" ? "wss:" : "ws:") +
  "//" +
  location.host +
  "/viewer"
);

const peers = new Map();
const streams = new Map();
const pendingCandidates = new Map();

let activeCameraId = null;

function send(message) {
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(message));
  }
}

function selectStream(type) {
  const stream =
    streams.get(type);

  if (!stream) {
    status.textContent =
      `🔴 ${type} camera not available`;

    return;
  }

  remoteVideo.srcObject =
    stream;

  remoteVideo.play().catch(() => {});

  frontBtn.classList.toggle(
    "active",
    type === "front"
  );

  backBtn.classList.toggle(
    "active",
    type === "back"
  );

  status.textContent =
    `🟢 ${type} camera LIVE`;
}

frontBtn.onclick = () => {
  selectStream("front");
};

backBtn.onclick = () => {
  selectStream("back");
};

function startPeer(cameraId) {
  if (peers.has(cameraId)) return;

  activeCameraId = cameraId;

  const pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  peers.set(cameraId, pc);

  pendingCandidates.set(
    cameraId,
    []
  );

  pc.onicecandidate = event => {
    if (event.candidate) {
      send({
        type: "candidate",
        candidate: event.candidate,
        cameraId
      });
    }
  };

  pc.ontrack = event => {
    const track =
      event.track;

    const stream =
      event.streams[0];

    if (!stream) return;

    const settings =
      track.getSettings();

    let type =
      settings.facingMode === "environment"
        ? "back"
        : "front";

    streams.set(
      type,
      stream
    );

    if (
      !remoteVideo.srcObject ||
      type === "front"
    ) {
      selectStream(type);
    }
  };

  send({
    type: "viewer-ready",
    cameraId
  });
}

ws.onmessage = async event => {
  let msg;

  try {
    msg = JSON.parse(event.data);
  } catch {
    return;
  }

  if (msg.type === "role") {
    status.textContent =
      "🟡 Viewer connected";

    if (Array.isArray(msg.cameras)) {
      msg.cameras.forEach(
        startPeer
      );
    }

    return;
  }

  if (msg.type === "camera-online") {
    startPeer(msg.cameraId);

    status.textContent =
      "🟡 Camera connected";

    return;
  }

  if (msg.type === "camera-live") {
    status.textContent =
      "🟢 Camera LIVE";

    return;
  }

  if (msg.type === "camera-offline") {
    status.textContent =
      "🔴 Camera offline";

    if (activeCameraId === msg.cameraId) {
      remoteVideo.srcObject = null;
      activeCameraId = null;
    }

    return;
  }

  if (msg.type === "offer") {
    const cameraId =
      msg.cameraId;

    if (!peers.has(cameraId)) {
      startPeer(cameraId);
    }

    const pc =
      peers.get(cameraId);

    await pc.setRemoteDescription(
      msg.offer
    );

    const queued =
      pendingCandidates.get(
        cameraId
      ) || [];

    for (const candidate of queued) {
      await pc
        .addIceCandidate(candidate)
        .catch(() => {});
    }

    pendingCandidates.set(
      cameraId,
      []
    );

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    send({
      type: "answer",
      answer: pc.localDescription,
      cameraId
    });

    return;
  }

  if (msg.type === "candidate") {
    const pc =
      peers.get(msg.cameraId);

    if (!pc) return;

    if (pc.remoteDescription) {
      await pc
        .addIceCandidate(msg.candidate)
        .catch(() => {});
    } else {
      pendingCandidates
        .get(msg.cameraId)
        .push(msg.candidate);
    }
  }
};

ws.onclose = () => {
  status.textContent =
    "🔴 Viewer connection closed";
};
</script>

</body>
</html>
