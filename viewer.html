<!doctype html>
<html>
<head>

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Live Camera Viewer</title>

<style>

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:15px;
}

h1{
  font-size:25px;
}

#status{
  font-size:17px;
  margin:15px;
}

#buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:18px 0;
}

button{
  border:0;
  border-radius:8px;
  padding:14px 20px;
  font-size:16px;
  background:#fff;
  color:#111;
}

button:disabled{
  opacity:.4;
}

button.active{
  outline:3px solid #888;
}

#cameraBox{
  width:95%;
  max-width:900px;
  margin:auto;
  background:#222;
  border-radius:10px;
  padding:10px;
  box-sizing:border-box;
}

#cameraLabel{
  font-size:18px;
  padding:10px;
}

video{
  width:100%;
  background:#000;
  border-radius:8px;
  display:block;
}

</style>

</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">
Connecting...
</div>

<div id="buttons">

<button
  id="frontBtn"
  disabled>
📷 Front Camera
</button>

<button
  id="backBtn"
  disabled>
📷 Back Camera
</button>

</div>

<div id="cameraBox">

<div id="cameraLabel">
Camera: Waiting...
</div>

<video
  id="remoteVideo"
  autoplay
  playsinline
  muted>
</video>

</div>

<script>

const status =
  document.getElementById(
    "status"
  );

const frontBtn =
  document.getElementById(
    "frontBtn"
  );

const backBtn =
  document.getElementById(
    "backBtn"
  );

const cameraLabel =
  document.getElementById(
    "cameraLabel"
  );

const remoteVideo =
  document.getElementById(
    "remoteVideo"
  );


const ws = new WebSocket(

  (location.protocol === "https:"
    ? "wss:"
    : "ws:") +

  "//" +

  location.host +

  "/viewer"

);


let viewerId = null;

let cameraId = null;

let pc = null;

let pendingCandidates = [];

let remoteStream = null;


// =====================================================
// SEND
// =====================================================

function send(data) {

  if (
    ws.readyState ===
    WebSocket.OPEN
  ) {

    ws.send(
      JSON.stringify(data)
    );
  }
}


// =====================================================
// BUTTONS
// =====================================================

function enableButtons() {

  frontBtn.disabled = false;
  backBtn.disabled = false;
}

function disableButtons() {

  frontBtn.disabled = true;
  backBtn.disabled = true;
}


// =====================================================
// CAMERA LABEL
// =====================================================

function setCameraLabel(
  facingMode
) {

  if (
    facingMode === "user"
  ) {

    cameraLabel.textContent =
      "Camera: Front Camera";

    frontBtn.classList.add(
      "active"
    );

    backBtn.classList.remove(
      "active"
    );

  } else {

    cameraLabel.textContent =
      "Camera: Back Camera";

    backBtn.classList.add(
      "active"
    );

    frontBtn.classList.remove(
      "active"
    );
  }
}


// =====================================================
// CONNECT
// =====================================================

function connectCamera(
  id
) {

  cameraId = id;

  if (pc) {
    pc.close();
  }

  pendingCandidates = [];

  remoteStream = null;

  pc =
    new RTCPeerConnection({

      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });


  // Receive camera video
  pc.ontrack =
    event => {

      if (
        event.track.kind !==
        "video"
      ) {
        return;
      }

      if (
        event.streams &&
        event.streams[0]
      ) {

        remoteStream =
          event.streams[0];

      } else {

        if (!remoteStream) {
          remoteStream =
            new MediaStream();
        }

        remoteStream.addTrack(
          event.track
        );
      }

      remoteVideo.srcObject =
        remoteStream;

      remoteVideo
        .play()
        .catch(() => {});
    };


  // ICE
  pc.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        send({
          type: "candidate",
          candidate:
            event.candidate,
          cameraId
        });
      }
    };


  pc.onconnectionstatechange =
    () => {

      console.log(
        "WebRTC:",
        pc.connectionState
      );

      if (
        pc.connectionState ===
        "connecting"
      ) {

        status.textContent =
          "🟡 Connecting to camera...";
      }

      if (
        pc.connectionState ===
        "connected"
      ) {

        status.textContent =
          "🟢 Camera LIVE";
      }

      if (
        pc.connectionState ===
          "disconnected" ||
        pc.connectionState ===
          "failed"
      ) {

        status.textContent =
          "🔴 Camera connection lost";
      }
    };


  send({
    type: "viewer-ready",
    cameraId
  });
}


// =====================================================
// SWITCH CAMERA
// =====================================================

function switchCamera(
  facingMode
) {

  if (!cameraId) {
    return;
  }

  status.textContent =
    "🟡 Switching camera...";

  send({
    type: "switch-camera",
    facingMode
  });
}


frontBtn.onclick =
  () => switchCamera("user");

backBtn.onclick =
  () => switchCamera("environment");


// =====================================================
// WEBSOCKET OPEN
// =====================================================

ws.onopen = () => {

  status.textContent =
    "🟡 Viewer connected";
};


// =====================================================
// WEBSOCKET MESSAGE
// =====================================================

ws.onmessage =
  async event => {

    let msg;

    try {

      msg =
        JSON.parse(
          event.data
        );

    } catch {

      return;
    }


    // -----------------------------------------
    // ROLE
    // -----------------------------------------

    if (
      msg.type === "role"
    ) {

      viewerId =
        msg.viewerId;

      if (
        msg.cameraId
      ) {

        enableButtons();

        connectCamera(
          msg.cameraId
        );
      }

      return;
    }


    // -----------------------------------------
    // CAMERA ONLINE
    // -----------------------------------------

    if (
      msg.type ===
      "camera-online"
    ) {

      cameraId =
        msg.cameraId;

      enableButtons();

      status.textContent =
        "🟡 Camera connected";

      connectCamera(
        msg.cameraId
      );

      return;
    }


    // -----------------------------------------
    // CAMERA LIVE
    // -----------------------------------------

    if (
      msg.type ===
      "camera-live"
    ) {

      cameraId =
        msg.cameraId;

      enableButtons();

      setCameraLabel(
        msg.facingMode
      );

      status.textContent =
        "🟢 Camera LIVE";

      return;
    }


    // -----------------------------------------
    // OFFER
    // -----------------------------------------

    if (
      msg.type === "offer"
    ) {

      if (
        !pc ||
        cameraId !==
        msg.cameraId
      ) {

        connectCamera(
          msg.cameraId
        );
      }

      try {

        await pc.setRemoteDescription(
          msg.offer
        );


        for (
          const candidate
          of pendingCandidates
        ) {

          try {

            await pc.addIceCandidate(
              candidate
            );

          } catch {}
        }

        pendingCandidates = [];


        const answer =
          await pc.createAnswer();

        await pc.setLocalDescription(
          answer
        );


        send({
          type: "answer",
          answer:
            pc.localDescription,
          cameraId
        });

      } catch (err) {

        console.error(
          "Offer error:",
          err
        );
      }

      return;
    }


    // -----------------------------------------
    // ICE
    // -----------------------------------------

    if (
      msg.type ===
      "candidate"
    ) {

      if (
        !pc ||
        !msg.candidate
      ) {
        return;
      }


      if (
        pc.remoteDescription
      ) {

        try {

          await pc.addIceCandidate(
            msg.candidate
          );

        } catch (err) {

          console.error(
            "ICE error:",
            err
          );
        }

      } else {

        pendingCandidates.push(
          msg.candidate
        );
      }

      return;
    }


    // -----------------------------------------
    // CAMERA OFFLINE
    // -----------------------------------------

    if (
      msg.type ===
      "camera-offline"
    ) {

      cameraId = null;

      disableButtons();

      if (pc) {
        pc.close();
        pc = null;
      }

      remoteVideo.srcObject =
        null;

      cameraLabel.textContent =
        "Camera: Offline";

      status.textContent =
        "🔴 Camera offline";
    }
  };


// =====================================================
// WEBSOCKET CLOSE
// =====================================================

ws.onclose = () => {

  status.textContent =
    "🔴 Viewer connection closed";

  disableButtons();
};


ws.onerror = error => {

  console.error(
    "WebSocket error:",
    error
  );

  status.textContent =
    "❌ WebSocket error";
};

</script>

</body>
  </html>
