<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Camera Viewer</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:15px;
}

#status{
  font-size:17px;
  margin:15px;
}

#buttons{
  margin:15px;
}

button{
  padding:12px 18px;
  margin:5px;
  border:0;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

button.active{
  outline:3px solid #fff;
}

#message{
  color:#aaa;
  margin:10px;
}

/* VIDEO PANEL */
#videoPanel{
  position:relative;
  width:95%;
  max-width:900px;
  margin:10px auto;
  background:#000;
  border-radius:10px;
  overflow:hidden;
}

#remoteVideo{
  width:100%;
  display:block;
  background:#000;
}

/* SMALL FULLSCREEN BUTTON */
#fullscreenBtn{
  position:absolute;
  right:10px;
  bottom:10px;

  width:42px;
  height:42px;

  padding:0;
  margin:0;

  border-radius:7px;

  background:rgba(0,0,0,.65);
  color:#fff;

  font-size:22px;
  line-height:42px;

  z-index:10;
}

#fullscreenBtn:hover{
  background:rgba(0,0,0,.85);
}

/* FULLSCREEN */
#videoPanel:fullscreen{
  width:100vw;
  height:100vh;
  max-width:none;
  margin:0;
  border-radius:0;
  background:#000;

  display:flex;
  align-items:center;
  justify-content:center;
}

#videoPanel:fullscreen #remoteVideo{
  width:100%;
  height:100%;
  object-fit:contain;
}

#videoPanel:fullscreen #fullscreenBtn{
  right:15px;
  bottom:15px;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">Connecting...</div>

<div id="buttons">
  <button id="frontBtn" disabled>
    📷 Front Camera
  </button>

  <button id="backBtn" disabled>
    📷 Back Camera
  </button>
</div>

<div id="message">
  Waiting for camera...
</div>

<!-- VIDEO PANEL -->
<div id="videoPanel">

  <video
    id="remoteVideo"
    autoplay
    playsinline
    muted>
  </video>

  <button id="fullscreenBtn" title="Full Screen">
    ⛶
  </button>

</div>

<script>
const status =
  document.getElementById("status");

const frontBtn =
  document.getElementById("frontBtn");

const backBtn =
  document.getElementById("backBtn");

const messageBox =
  document.getElementById("message");

const remoteVideo =
  document.getElementById("remoteVideo");

const videoPanel =
  document.getElementById("videoPanel");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");

const ws = new WebSocket(
  (location.protocol === "https:" ? "wss:" : "ws:") +
  "//" +
  location.host +
  "/viewer"
);

const peers = new Map();
const pendingCandidates = new Map();
const cameraStreams = new Map();

let activeCameraId = null;

function send(message){
  if(ws.readyState === WebSocket.OPEN){
    ws.send(JSON.stringify(message));
  }
}

function updateButtons(cameraId){
  const data =
    cameraStreams.get(cameraId);

  if(!data) return;

  frontBtn.disabled =
    !data.available.front;

  backBtn.disabled =
    !data.available.back;
}

function showCamera(type){
  const data =
    cameraStreams.get(activeCameraId);

  if(!data) return;

  const stream =
    data.streams[type];

  if(!stream){
    messageBox.textContent =
      type === "back"
        ? "Back camera is not available."
        : "Front camera is not available.";

    return;
  }

  remoteVideo.srcObject = stream;

  remoteVideo.play().catch(() => {});

  frontBtn.classList.toggle(
    "active",
    type === "front"
  );

  backBtn.classList.toggle(
    "active",
    type === "back"
  );

  messageBox.textContent =
    type === "front"
      ? "Showing Front Camera"
      : "Showing Back Camera";

  status.textContent =
    "🟢 Camera LIVE";
}

frontBtn.onclick = () => {
  showCamera("front");
};

backBtn.onclick = () => {
  showCamera("back");
};

/* FULL SCREEN BUTTON */
fullscreenBtn.onclick = async () => {
  try{

    if(!document.fullscreenElement){

      await videoPanel.requestFullscreen();

    }else{

      await document.exitFullscreen();

    }

  }catch(err){

    console.error(
      "Fullscreen error:",
      err
    );

    /* iPhone/iOS fallback */
    if(
      remoteVideo.webkitEnterFullscreen
    ){
      remoteVideo.webkitEnterFullscreen();
    }
  }
};

/* Update fullscreen icon */
document.addEventListener(
  "fullscreenchange",
  () => {

    if(document.fullscreenElement){

      fullscreenBtn.textContent = "×";
      fullscreenBtn.title =
        "Exit Full Screen";

    }else{

      fullscreenBtn.textContent = "⛶";
      fullscreenBtn.title =
        "Full Screen";

    }
  }
);

function startPeer(cameraId){

  if(peers.has(cameraId)){
    return;
  }

  activeCameraId =
    cameraId;

  cameraStreams.set(
    cameraId,
    {
      streams:{
        front:null,
        back:null
      },

      available:{
        front:false,
        back:false
      }
    }
  );

  const pc =
    new RTCPeerConnection({
      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  peers.set(
    cameraId,
    pc
  );

  pendingCandidates.set(
    cameraId,
    []
  );

  pc.onicecandidate =
    event => {

      if(event.candidate){

        send({
          type:"candidate",
          candidate:event.candidate,
          cameraId
        });

      }
    };

  let trackIndex = 0;

  pc.ontrack =
    event => {

      const type =
        trackIndex === 0
          ? "front"
          : "back";

      trackIndex++;

      const data =
        cameraStreams.get(
          cameraId
        );

      if(!data) return;

      data.streams[type] =
        event.streams[0];

      data.available[type] =
        true;

      updateButtons(
        cameraId
      );

      if(
        type === "front" &&
        !remoteVideo.srcObject
      ){

        showCamera("front");

      }
    };

  send({
    type:"viewer-ready",
    cameraId
  });
}

ws.onmessage =
  async event => {

    let msg;

    try{

      msg =
        JSON.parse(
          event.data
        );

    }catch{

      return;

    }

    if(msg.type === "role"){

      status.textContent =
        "🟡 Viewer connected";

      if(
        Array.isArray(
          msg.cameras
        )
      ){

        msg.cameras.forEach(
          startPeer
        );

      }

      return;
    }

    if(
      msg.type ===
      "camera-online"
    ){

      startPeer(
        msg.cameraId
      );

      status.textContent =
        "🟡 Camera connected";

      return;
    }

    if(
      msg.type ===
      "camera-live"
    ){

      status.textContent =
        "🟢 Camera LIVE";

      return;
    }

    if(
      msg.type ===
      "camera-offline"
    ){

      const pc =
        peers.get(
          msg.cameraId
        );

      if(pc){
        pc.close();
      }

      peers.delete(
        msg.cameraId
      );

      cameraStreams.delete(
        msg.cameraId
      );

      if(
        activeCameraId ===
        msg.cameraId
      ){

        activeCameraId =
          null;

        remoteVideo.srcObject =
          null;

        frontBtn.disabled =
          true;

        backBtn.disabled =
          true;

        status.textContent =
          "🔴 Camera offline";
      }

      return;
    }

    if(msg.type === "offer"){

      const cameraId =
        msg.cameraId;

      if(
        !peers.has(
          cameraId
        )
      ){

        startPeer(
          cameraId
        );

      }

      const pc =
        peers.get(
          cameraId
        );

      await pc.setRemoteDescription(
        msg.offer
      );

      const queued =
        pendingCandidates.get(
          cameraId
        ) || [];

      for(
        const candidate
        of queued
      ){

        await pc
          .addIceCandidate(
            candidate
          )
          .catch(() => {});

      }

      pendingCandidates.set(
        cameraId,
        []
      );

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      send({
        type:"answer",
        answer:
          pc.localDescription,
        cameraId
      });

      return;
    }

    if(msg.type === "candidate"){

      const pc =
        peers.get(
          msg.cameraId
        );

      if(
        !pc ||
        !msg.candidate
      ){

        return;

      }

      if(
        pc.remoteDescription
      ){

        await pc
          .addIceCandidate(
            msg.candidate
          )
          .catch(() => {});

      }else{

        const queue =
          pendingCandidates.get(
            msg.cameraId
          );

        if(queue){
          queue.push(
            msg.candidate
          );
        }
      }
    }
  };

ws.onclose = () => {

  status.textContent =
    "🔴 Viewer connection closed";

};
</script>

</body>
</html>
