<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Live Cameras</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

h2{
  text-align:center;
  padding:15px;
}

#grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));
  gap:12px;
  padding:12px;
}

.cameraBox{
  background:#000;
  border-radius:10px;
  overflow:hidden;
}

.cameraTitle{
  padding:10px;
  background:#222;
}

video{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  display:block;
  object-fit:contain;
}

.status{
  padding:10px;
  text-align:center;
  background:#222;
}

.controls{
  display:flex;
  gap:10px;
  padding:10px;
  background:#111;
}

button{
  padding:10px 15px;
  border:0;
  border-radius:6px;
  cursor:pointer;
  font-size:15px;
}

</style>

</head>

<body>

<h2>Live Cameras</h2>

<div id="grid"></div>


<script>

"use strict";


/* =====================================
   VARIABLES
===================================== */

const grid =
  document.getElementById("grid");

const viewerId =
  crypto.randomUUID();

const peers =
  new Map();

const videos =
  new Map();

let socket = null;


/* =====================================
   WEBRTC SERVERS
===================================== */

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    },

    {
      urls: [
        "turn:openrelay.metered.ca:80",
        "turn:openrelay.metered.ca:443",
        "turn:openrelay.metered.ca:443?transport=tcp"
      ],

      username:
        "openrelayproject",

      credential:
        "openrelayproject"
    }

  ]

};


/* =====================================
   CONNECT SOCKET
===================================== */

function connect(){

  if(
    socket &&
    (
      socket.readyState === WebSocket.OPEN ||
      socket.readyState === WebSocket.CONNECTING
    )
  ){
    return;
  }


  console.log(
    "Connecting viewer WebSocket..."
  );


  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  socket =
    new WebSocket(
      protocol +
      "//" +
      location.host
    );


  /* ===================================
     SOCKET OPEN
  =================================== */

  socket.onopen = () => {

    console.log(
      "Viewer WebSocket connected"
    );


    socket.send(
      JSON.stringify({

        type:
          "register-viewer",

        viewerId:
          viewerId

      })
    );

  };


  /* ===================================
     SOCKET MESSAGE
  =================================== */

  socket.onmessage =
    async event => {

      try{

        const msg =
          JSON.parse(
            event.data
          );


        console.log(
          "Received:",
          msg.type
        );


        /* CAMERA ONLINE */

        if(
          msg.type ===
          "camera-online"
        ){

          addCamera(
            msg.cameraId
          );

          return;
        }


        /* OFFER */

        if(
          msg.type ===
          "offer"
        ){

          await handleOffer(
            msg
          );

          return;
        }


        /* CAMERA ICE */

        if(
          msg.type ===
          "camera-ice"
        ){

          await handleCameraIce(
            msg
          );

          return;
        }


        /* CAMERA OFFLINE */

        if(
          msg.type ===
          "camera-offline"
        ){

          removeCamera(
            msg.cameraId
          );

          return;
        }

      }catch(error){

        console.error(
          "Message error:",
          error
        );

      }

    };


  /* ===================================
     SOCKET CLOSED
  =================================== */

  socket.onclose = () => {

    console.log(
      "WebSocket disconnected"
    );


    socket = null;


    setTimeout(
      connect,
      2000
    );

  };


  /* ===================================
     SOCKET ERROR
  =================================== */

  socket.onerror = error => {

    console.error(
      "WebSocket error:",
      error
    );

  };

}


/* =====================================
   ADD CAMERA
===================================== */

function addCamera(
  cameraId
){

  if(
    videos.has(
      cameraId
    )
  ){

    return;

  }


  const box =
    document.createElement(
      "div"
    );

  box.className =
    "cameraBox";

  box.id =
    "camera-" +
    cameraId;


  /* ===================================
     TITLE
  =================================== */

  const title =
    document.createElement(
      "div"
    );

  title.className =
    "cameraTitle";

  title.textContent =
    "Camera " +
    cameraId.substring(
      0,
      8
    );


  /* ===================================
     VIDEO
  =================================== */

  const video =
    document.createElement(
      "video"
    );

  video.autoplay =
    true;

  video.playsInline =
    true;

  /*
    IMPORTANT:
    Do NOT set muted=true.
    We want microphone audio.
  */

  video.muted =
    false;


  /* ===================================
     STATUS
  =================================== */

  const status =
    document.createElement(
      "div"
    );

  status.className =
    "status";

  status.textContent =
    "Connecting camera...";


  /* ===================================
     CONTROLS
  =================================== */

  const controls =
    document.createElement(
      "div"
    );

  controls.className =
    "controls";


  /* FULLSCREEN BUTTON */

  const fullscreen =
    document.createElement(
      "button"
    );

  fullscreen.textContent =
    "Fullscreen";


  fullscreen.onclick =
    async () => {

      try{

        if(
          video.requestFullscreen
        ){

          await video.requestFullscreen();

        }

      }catch(error){

        console.error(
          "Fullscreen error:",
          error
        );

      }

    };


  /* AUDIO BUTTON */

  const audioButton =
    document.createElement(
      "button"
    );

  audioButton.textContent =
    "🔊 Mute";


  audioButton.onclick =
    () => {

      video.muted =
        !video.muted;


      if(video.muted){

        audioButton.textContent =
          "🔇 Unmute";

      }else{

        audioButton.textContent =
          "🔊 Mute";

      }

    };


  controls.appendChild(
    fullscreen
  );

  controls.appendChild(
    audioButton
  );


  /* ===================================
     BUILD CAMERA BOX
  =================================== */

  box.appendChild(
    title
  );

  box.appendChild(
    video
  );

  box.appendChild(
    status
  );

  box.appendChild(
    controls
  );


  grid.appendChild(
    box
  );


  videos.set(
    cameraId,
    {
      video: video,
      status: status
    }
  );


  /* ===================================
     REQUEST CAMERA
  =================================== */

  if(
    socket &&
    socket.readyState ===
      WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify({

        type:
          "watch-camera",

        cameraId:
          cameraId

      })
    );

  }

}


/* =====================================
   HANDLE OFFER
===================================== */

async function handleOffer(
  msg
){

  console.log(
    "Handling offer:",
    msg.cameraId
  );


  const camera =
    videos.get(
      msg.cameraId
    );


  if(!camera){

    console.error(
      "Camera video not found:",
      msg.cameraId
    );

    return;

  }


  const video =
    camera.video;

  const status =
    camera.status;


  /* ===================================
     CLOSE OLD PEER
  =================================== */

  const oldPeer =
    peers.get(
      msg.cameraId
    );


  if(oldPeer){

    try{

      oldPeer.close();

    }catch(error){

      console.error(
        error
      );

    }

  }


  /* ===================================
     CREATE PEER
  =================================== */

  const peer =
    new RTCPeerConnection(
      rtcConfig
    );


  peers.set(
    msg.cameraId,
    peer
  );


  /* ===================================
     REMOTE TRACK
  =================================== */

  peer.ontrack =
    event => {

      console.log(
        "TRACK RECEIVED:",
        event.track.kind
      );


      /*
        Use the stream supplied by
        WebRTC when available.
      */

      if(
        event.streams &&
        event.streams.length > 0
      ){

        video.srcObject =
          event.streams[0];

      }else{

        /*
          Fallback for browsers where
          event.streams is empty.
        */

        if(
          !video.srcObject
        ){

          video.srcObject =
            new MediaStream();

        }


        video.srcObject.addTrack(
          event.track
        );

      }


      /*
        We need BOTH:
        video track
        audio track
      */

      if(
        event.track.kind ===
        "video"
      ){

        status.textContent =
          "Video received";

      }


      if(
        event.track.kind ===
        "audio"
      ){

        console.log(
          "MICROPHONE AUDIO RECEIVED"
        );

      }


      /*
        Start playback.
      */

      video.play()
        .then(() => {

          console.log(
            "VIDEO + AUDIO PLAYING"
          );

          status.textContent =
            "LIVE";

        })
        .catch(error => {

          console.error(
            "Playback failed:",
            error
          );

          status.textContent =
            "Tap Unmute to hear audio";

        });

    };


  /* ===================================
     ICE CANDIDATE
  =================================== */

  peer.onicecandidate =
    event => {

      if(
        !event.candidate
      ){

        return;

      }


      if(
        socket &&
        socket.readyState ===
          WebSocket.OPEN
      ){

        socket.send(
          JSON.stringify({

            type:
              "viewer-ice",

            cameraId:
              msg.cameraId,

            viewerId:
              viewerId,

            candidate:
              event.candidate

          })
        );

      }

    };


  /* ===================================
     CONNECTION STATE
  =================================== */

  peer.onconnectionstatechange =
    () => {

      console.log(
        "Connection state:",
        peer.connectionState
      );


      if(
        peer.connectionState ===
        "connecting"
      ){

        status.textContent =
          "Connecting camera...";

      }


      if(
        peer.connectionState ===
        "connected"
      ){

        status.textContent =
          "Connected";

      }


      if(
        peer.connectionState ===
        "failed"
      ){

        status.textContent =
          "WebRTC connection failed";

      }


      if(
        peer.connectionState ===
        "disconnected"
      ){

        status.textContent =
          "Camera disconnected";

      }

    };


  /* ===================================
     ICE CONNECTION STATE
  =================================== */

  peer.oniceconnectionstatechange =
    () => {

      console.log(
        "ICE state:",
        peer.iceConnectionState
      );

    };


  /* ===================================
     REMOTE OFFER
  =================================== */

  await peer.setRemoteDescription({

    type:
      "offer",

    sdp:
      msg.sdp

  });


  /* ===================================
     CREATE ANSWER
  =================================== */

  const answer =
    await peer.createAnswer();


  await peer.setLocalDescription(
    answer
  );


  /* ===================================
     SEND ANSWER
  =================================== */

  if(
    socket &&
    socket.readyState ===
      WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify({

        type:
          "answer",

        cameraId:
          msg.cameraId,

        viewerId:
          viewerId,

        sdp:
          peer.localDescription.sdp

      })
    );


    console.log(
      "Answer sent"
    );

  }

}


/* =====================================
   CAMERA ICE
===================================== */

async function handleCameraIce(
  msg
){

  const peer =
    peers.get(
      msg.cameraId
    );


  if(!peer){

    console.log(
      "Peer not ready for ICE"
    );

    return;

  }


  try{

    await peer.addIceCandidate(
      new RTCIceCandidate(
        msg.candidate
      )
    );


    console.log(
      "Camera ICE added"
    );

  }catch(error){

    console.error(
      "ICE candidate error:",
      error
    );

  }

}


/* =====================================
   REMOVE CAMERA
===================================== */

function removeCamera(
  cameraId
){

  const peer =
    peers.get(
      cameraId
    );


  if(peer){

    try{

      peer.close();

    }catch{}

    peers.delete(
      cameraId
    );

  }


  const camera =
    videos.get(
      cameraId
    );


  if(camera){

    camera.video.srcObject =
      null;

  }


  const box =
    document.getElementById(
      "camera-" +
      cameraId
    );


  if(box){

    box.remove();

  }


  videos.delete(
    cameraId
  );

}


/* =====================================
   INTERNET RETURNS
===================================== */

window.addEventListener(
  "online",
  () => {

    console.log(
      "Internet connection restored"
    );

    connect();

  }
);


/* =====================================
   START
===================================== */

connect();

</script>

</body>
</html>
