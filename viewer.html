<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Live Camera Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 15px;
    }

    h1 {
      margin: 8px 0;
    }

    #status {
      margin: 12px auto;
      padding: 12px;
      background: #222;
      border-radius: 8px;
      max-width: 700px;
    }

    .online {
      color: #00ff66;
    }

    .warning {
      color: #ffd000;
    }

    .offline {
      color: #ff5555;
    }

    .cameras {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 1100px;
      margin: 20px auto;
    }

    .cameraBox {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      min-height: 240px;
    }

    video {
      display: block;
      width: 100%;
      min-height: 240px;
      background: #000;
      object-fit: contain;
    }

    .label {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      background: rgba(0,0,0,.75);
      padding: 7px 10px;
      border-radius: 7px;
      font-weight: bold;
    }

    .fullscreen {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 5;
      background: rgba(0,0,0,.75);
      color: white;
      border: 0;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 15px;
    }

    @media (max-width: 700px) {
      .cameras {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>Live Camera Viewer</h1>

  <div id="status" class="warning">
    Connecting...
  </div>

  <div class="cameras">

    <div class="cameraBox">

      <div class="label">
        📷 Front Camera
      </div>

      <video
        id="frontVideo"
        autoplay
        playsinline>
      </video>

      <button
        class="fullscreen"
        onclick="fullscreenVideo('frontVideo')">
        ⛶ Full Screen
      </button>

    </div>

    <div class="cameraBox">

      <div class="label">
        📷 Back Camera
      </div>

      <video
        id="backVideo"
        autoplay
        playsinline>
      </video>

      <button
        class="fullscreen"
        onclick="fullscreenVideo('backVideo')">
        ⛶ Full Screen
      </button>

    </div>

  </div>

<script>
const statusBox = document.getElementById("status");

const frontVideo =
  document.getElementById("frontVideo");

const backVideo =
  document.getElementById("backVideo");

let frontPC = null;
let backPC = null;

const wsProtocol =
  location.protocol === "https:" ? "wss:" : "ws:";

const ws = new WebSocket(
  wsProtocol + "//" + location.host
);

function setStatus(text, className) {
  statusBox.textContent = text;
  statusBox.className = className;
}

ws.onopen = () => {

  ws.send(JSON.stringify({
    type: "register",
    role: "viewer"
  }));

  setStatus(
    "Viewer connected. Waiting for Camera A...",
    "warning"
  );
};

ws.onclose = () => {
  setStatus(
    "Viewer connection lost.",
    "offline"
  );
};

ws.onmessage = async event => {

  let msg;

  try {
    msg = JSON.parse(event.data);
  } catch {
    return;
  }

  if (msg.type === "camera-online") {

    setStatus(
      "Camera A is online.",
      "online"
    );

    return;
  }

  if (msg.type === "camera-offline") {

    closeConnections();

    frontVideo.srcObject = null;
    backVideo.srcObject = null;

    setStatus(
      "Camera A is offline.",
      "offline"
    );

    return;
  }

  if (msg.type === "offer") {

    if (msg.camera === "front") {
      await handleOffer(
        "front",
        msg.offer
      );
    }

    if (msg.camera === "back") {
      await handleOffer(
        "back",
        msg.offer
      );
    }

    return;
  }

  if (msg.type === "candidate") {

    try {

      if (
        msg.camera === "front" &&
        frontPC
      ) {
        await frontPC.addIceCandidate(
          msg.candidate
        );
      }

      if (
        msg.camera === "back" &&
        backPC
      ) {
        await backPC.addIceCandidate(
          msg.candidate
        );
      }

    } catch (error) {
      console.log("ICE error:", error);
    }
  }
};

async function handleOffer(cameraName, offer) {

  let pc;

  if (cameraName === "front") {

    if (frontPC) {
      frontPC.close();
    }

    pc = new RTCPeerConnection({
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        }
      ]
    });

    frontPC = pc;

  } else {

    if (backPC) {
      backPC.close();
    }

    pc = new RTCPeerConnection({
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        }
      ]
    });

    backPC = pc;
  }

  pc.ontrack = event => {

    if (cameraName === "front") {
      frontVideo.srcObject =
        event.streams[0];
    }

    if (cameraName === "back") {
      backVideo.srcObject =
        event.streams[0];
    }

    setStatus(
      "Live camera stream connected.",
      "online"
    );
  };

  pc.onicecandidate = event => {

    if (event.candidate) {

      ws.send(JSON.stringify({
        type: "candidate",
        camera: cameraName,
        candidate: event.candidate
      }));

    }
  };

  await pc.setRemoteDescription(
    new RTCSessionDescription(offer)
  );

  const answer =
    await pc.createAnswer();

  await pc.setLocalDescription(answer);

  ws.send(JSON.stringify({
    type: "answer",
    camera: cameraName,
    answer: answer
  }));
}

function closeConnections() {

  if (frontPC) {
    frontPC.close();
    frontPC = null;
  }

  if (backPC) {
    backPC.close();
    backPC = null;
  }
}

async function fullscreenVideo(id) {

  const video =
    document.getElementById(id);

  try {

    if (video.requestFullscreen) {
      await video.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }

  } catch (error) {
    console.log(error);
  }
}
</script>

</body>
</html>
