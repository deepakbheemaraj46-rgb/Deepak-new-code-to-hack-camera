<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Live Camera Viewer</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  padding: 16px;
}

.viewer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 10px 0 18px;
  border-bottom: 1px solid #292929;
  margin-bottom: 16px;
}

.viewer-header h1 {
  margin: 0;
  font-size: 22px;
}

.viewer-header span {
  color: #aaa;
  font-size: 14px;
}

.camera-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(320px, 1fr));
  gap: 16px;
}

.camera-card {
  background: #151515;
  border: 1px solid #292929;
  border-radius: 12px;
  overflow: hidden;
}

.camera-header {
  min-height: 48px;
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.camera-status {
  font-size: 12px;
  color: #aaa;
}

.camera-status.live {
  color: #42e36b;
}

.camera-card video {
  width: 100%;
  display: block;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: #000;
}

.controls {
  padding: 10px;
  display: flex;
  justify-content: flex-end;
}

.controls button {
  border: 0;
  border-radius: 8px;
  padding: 11px 15px;
  font-weight: bold;
  cursor: pointer;
  background: #fff;
  color: #000;
}

.empty {
  padding: 60px 20px;
  text-align: center;
  color: #777;
}

@media (max-width: 600px) {

  body {
    padding: 8px;
  }

  .camera-grid {
    grid-template-columns: 1fr;
  }

  .camera-card {
    border-radius: 8px;
  }

  .viewer-header {
    align-items: flex-start;
    flex-direction: column;
  }
}

</style>

</head>

<body>

<header class="viewer-header">

<div>

<h1>Live Camera Viewer</h1>

<span id="connection">
Connecting...
</span>

</div>

</header>

<main>

<div
  id="grid"
  class="camera-grid">
</div>

<div
  id="empty"
  class="empty">
Waiting for cameras...
</div>

</main>

<script>

const grid =
document.getElementById("grid");

const empty =
document.getElementById("empty");

const connection =
document.getElementById("connection");

const cameras =
new Map();

let socket = null;

const viewerId =
crypto.randomUUID();

function connect() {

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  socket =
    new WebSocket(
      `${protocol}//${location.host}`
    );

  socket.onopen = () => {

    connection.textContent =
      "Connected";

    socket.send(
      JSON.stringify({
        type:
          "register-viewer"
      })
    );
  };

  socket.onclose = () => {

    connection.textContent =
      "Disconnected — reconnecting...";

    setTimeout(
      connect,
      2000
    );
  };

  socket.onmessage =
  async event => {

    const msg =
      JSON.parse(event.data);

    if (
      msg.type ===
      "viewer-registered"
    ) {

      updateList(
        msg.cameras
      );
    }

    if (
      msg.type ===
      "camera-list"
    ) {

      updateList(
        msg.cameras
      );
    }

    if (
      msg.type === "offer"
    ) {

      await handleOffer(
        msg
      );
    }

    if (
      msg.type === "candidate"
    ) {

      const camera =
        cameras.get(
          msg.cameraId
        );

      if (
        camera &&
        camera.pc &&
        msg.candidate
      ) {

        try {

          await camera.pc
            .addIceCandidate(
              msg.candidate
            );

        } catch {}
      }
    }

    if (
      msg.type ===
      "camera-offline"
    ) {

      removeCamera(
        msg.cameraId
      );
    }
  };
}

function updateList(list) {

  const active =
    new Set(list);

  for (
    const id
    of cameras.keys()
  ) {

    if (!active.has(id)) {
      removeCamera(id);
    }
  }

  for (
    const id
    of list
  ) {

    if (!cameras.has(id)) {
      addCamera(id);
    }
  }

  empty.style.display =
    list.length
      ? "none"
      : "block";
}

function addCamera(id) {

  const card =
    document.createElement(
      "article"
    );

  card.className =
    "camera-card";

  const header =
    document.createElement(
      "div"
    );

  header.className =
    "camera-header";

  const name =
    document.createElement(
      "strong"
    );

  name.textContent =
    id;

  const live =
    document.createElement(
      "span"
    );

  live.className =
    "camera-status";

  live.textContent =
    "CONNECTING";

  header.append(
    name,
    live
  );

  const video =
    document.createElement(
      "video"
    );

  video.autoplay = true;
  video.playsInline = true;

  const controls =
    document.createElement(
      "div"
    );

  controls.className =
    "controls";

  const fullscreen =
    document.createElement(
      "button"
    );

  fullscreen.textContent =
    "Full Screen";

  fullscreen.addEventListener(
    "click",
    () => {

      if (
        video.requestFullscreen
      ) {
        video.requestFullscreen();
      }
    }
  );

  controls.append(
    fullscreen
  );

  card.append(
    header,
    video,
    controls
  );

  grid.appendChild(card);

  const camera = {

    id,
    card,
    video,
    live,
    pc: null

  };

  cameras.set(
    id,
    camera
  );

  socket.send(
    JSON.stringify({

      type:
        "watch",

      cameraId:
        id
    })
  );
}

async function handleOffer(msg) {

  const camera =
    cameras.get(
      msg.cameraId
    );

  if (!camera) return;

  camera.viewerId =
    msg.viewerId;

  const pc =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        }

      ],

      iceCandidatePoolSize: 10
    });

  camera.pc =
    pc;

  pc.ontrack =
  event => {

    if (
      event.streams &&
      event.streams[0]
    ) {

      camera.video.srcObject =
        event.streams[0];

      camera.live.textContent =
        "LIVE";

      camera.live.className =
        "camera-status live";
    }
  };

  pc.onicecandidate =
  event => {

    if (!event.candidate) return;

    socket.send(
      JSON.stringify({

        type:
          "candidate",

        cameraId:
          camera.id,

        viewerId:
          msg.viewerId,

        candidate:
          event.candidate
      })
    );
  };

  pc.onconnectionstatechange =
  () => {

    if (
      pc.connectionState ===
      "connected"
    ) {

      camera.live.textContent =
        "LIVE";

      camera.live.className =
        "camera-status live";
    }

    if (
      pc.connectionState ===
        "disconnected" ||
      pc.connectionState ===
        "failed"
    ) {

      camera.live.textContent =
        "RECONNECTING";

      camera.live.className =
        "camera-status";
    }
  };

  await pc.setRemoteDescription(
    msg.offer
  );

  const answer =
    await pc.createAnswer();

  await pc.setLocalDescription(
    answer
  );

  socket.send(
    JSON.stringify({

      type:
        "answer",

      cameraId:
        camera.id,

      viewerId:
        msg.viewerId,

      answer:
        pc.localDescription
    })
  );
}

function removeCamera(id) {

  const camera =
    cameras.get(id);

  if (!camera) return;

  try {

    if (camera.pc) {
      camera.pc.close();
    }

  } catch {}

  camera.card.remove();

  cameras.delete(id);

  empty.style.display =
    cameras.size
      ? "none"
      : "block";
}

connect();

</script>

</body>

</html>
