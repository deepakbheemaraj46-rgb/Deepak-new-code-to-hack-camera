<!DOCTYPE html><html><body><h2>Live Cameras</h2><div id="grid"></div><script>const viewerId=crypto.randomUUID(),peers=new Map(),videos=new Map();const ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:'register-viewer',viewerId}));ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='camera-online'){const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.style.width='400px';document.body.appendChild(v);videos.set(m.cameraId,v);ws.send(JSON.stringify({type:'watch-camera',cameraId:m.cameraId}));} if(m.type==='offer'){const p=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443'],username:'openrelayproject',credential:'openrelayproject'}]});peers.set(m.cameraId,p);p.ontrack=e=>videos.get(m.cameraId).srcObject=e.streams[0];p.onicecandidate=x=>x.candidate&&ws.send(JSON.stringify({type:'viewer-ice',cameraId:m.cameraId,viewerId,candidate:x.candidate}));await p.setRemoteDescription({type:'offer',sdp:m.sdp});const a=await p.createAnswer();await p.setLocalDescription(a);ws.send(JSON.stringify({type:'answer',cameraId:m.cameraId,viewerId,sdp:p.localDescription.sdp});} if(m.type==='camera-ice'){const p=peers.get(m.cameraId);if(p) await p.addIceCandidate(m.candidate);}};</script></body></html>
