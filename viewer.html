<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Live Viewer</title>

    <style>

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            margin: 20px;
        }

        #status {
            margin: 15px;
            color: #ccc;
        }

        video {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background: black;
            display: block;
            margin: auto;
        }

    </style>

</head>

<body>

    <h2>Live Camera Viewer</h2>

    <div id="status">
        Connecting...
    </div>

    <video
        id="remoteVideo"
        autoplay
        playsinline
        controls>
    </video>


<script>

const video =
    document.getElementById(
        "remoteVideo"
    );

const status =
    document.getElementById(
        "status"
    );


let ws = null;

let viewerId = null;

let peer = null;

let pendingCandidates = [];


/*
    WebSocket
*/

const protocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";

const wsUrl =
    protocol +
    "//" +
    location.host +
    "/viewer";


function send(data) {

    if (
        ws &&
        ws.readyState === WebSocket.OPEN
    ) {

        ws.send(
            JSON.stringify(data)
        );
    }
}


/*
    Connect
*/

function connect() {

    ws =
        new WebSocket(wsUrl);


    ws.onopen = () => {

        status.textContent =
            "Connected. Waiting for camera...";
    };


    ws.onmessage = async event => {

        const msg =
            JSON.parse(event.data);


        /*
            Server gives viewer ID
        */

        if (msg.type === "role") {

            viewerId =
                msg.viewerId;
        }


        /*
            Camera is online
        */

        if (msg.type === "camera-online") {

            status.textContent =
                "Camera is online. Connecting...";
        }


        /*
            Camera offer
        */

        if (msg.type === "offer") {

            await handleOffer(
                msg.offer
            );
        }


        /*
            ICE candidate
        */

        if (msg.type === "candidate") {

            if (peer &&
                peer.remoteDescription) {

                try {

                    await peer.addIceCandidate(
                        msg.candidate
                    );

                } catch (error) {

                    console.error(
                        error
                    );
                }

            } else {

                pendingCandidates.push(
                    msg.candidate
                );
            }
        }


        /*
            Camera disconnected
        */

        if (msg.type === "camera-offline") {

            status.textContent =
                "Camera is offline.";

            if (peer) {

                peer.close();

                peer = null;
            }

            video.srcObject = null;
        }
    };


    ws.onclose = () => {

        status.textContent =
            "Connection lost. Reconnecting...";

        setTimeout(
            connect,
            3000
        );
    };


    ws.onerror = error => {

        console.error(
            error
        );
    };
}


/*
    Handle camera offer
*/

async function handleOffer(offer) {

    if (peer) {

        peer.close();
    }


    /*
        WebRTC configuration
    */

    peer =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                /*
                    Add TURN server here
                    for reliable connections
                    across different networks.
                */

                /*
                {
                    urls: "turn:YOUR_TURN_SERVER:3478",
                    username: "YOUR_USERNAME",
                    credential: "YOUR_PASSWORD"
                }
                */

            ],

            bundlePolicy: "max-bundle",

            rtcpMuxPolicy: "require"
        });


    /*
        Receive video
    */

    peer.ontrack = event => {

        if (
            event.streams &&
            event.streams[0]
        ) {

            video.srcObject =
                event.streams[0];

            status.textContent =
                "Live camera connected.";

            video.play().catch(
                () => {}
            );
        }
    };


    /*
        ICE candidates
    */

    peer.onicecandidate = event => {

        if (event.candidate) {

            send({

                type: "candidate",

                candidate:
                    event.candidate
            });
        }
    };


    peer.onconnectionstatechange = () => {

        console.log(
            "Connection:",
            peer.connectionState
        );


        if (
            peer.connectionState ===
            "connected"
        ) {

            status.textContent =
                "Live camera connected.";
        }


        if (
            peer.connectionState ===
            "failed"
        ) {

            status.textContent =
                "Connection failed. A TURN server may be required.";
        }


        if (
            peer.connectionState ===
            "disconnected"
        ) {

            status.textContent =
                "Connection interrupted.";
        }
    };


    /*
        Set camera offer
    */

    await peer.setRemoteDescription(
        offer
    );


    /*
        Add queued ICE candidates
    */

    for (
        const candidate of
        pendingCandidates
    ) {

        try {

            await peer.addIceCandidate(
                candidate
            );

        } catch (error) {

            console.error(
                error
            );
        }
    }


    pendingCandidates = [];


    /*
        Create answer
    */

    const answer =
        await peer.createAnswer();


    await peer.setLocalDescription(
        answer
    );


    send({

        type: "answer",

        answer:
            peer.localDescription
    });
}


connect();

</script>

</body>

  </html>
