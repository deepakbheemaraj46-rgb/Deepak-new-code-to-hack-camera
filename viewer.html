<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Live Camera Viewer</title>

<style>

body{
  margin:0;
  padding:15px;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:10px 0 20px;
}

#status{
  margin:15px;
  font-size:18px;
}

#grid{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(280px,1fr)
    );
  gap:15px;
  max-width:1100px;
  margin:auto;
}

.cameraBox{
  background:#222;
  border-radius:12px;
  overflow:hidden;
}

.cameraTitle{
  padding:12px;
  font-size:17px;
  font-weight:bold;
}

.videoWrap{
  position:relative;
  background:#000;
}

video{
  display:block;
  width:100%;
  min-height:220px;
  background:#000;
  object-fit:contain;
}

.fullscreen{
  position:absolute;
  right:10px;
  bottom:10px;

  width:45px;
  height:45px;

  border:0;
  border-radius:8px;

  background:
    rgba(0,0,0,.7);

  color:#fff;

  font-size:23px;

  cursor:pointer;
}

.videoWrap:fullscreen{
  width:100vw;
  height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;
}

.videoWrap:fullscreen video{
  width:100%;
  height:100%;
  object-fit:contain;
}

</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">
  🟡 Connecting...
</div>

<div id="grid"></div>


<script>

const status =
  document.getElementById("status");

const grid =
  document.getElementById("grid");


const ws =
  new WebSocket(

    (
      location.protocol ===
      "https:"
        ? "wss:"
        : "ws:"
    ) +

    "//" +

    location.host +

    "/viewer"

  );


const peers =
  new Map();


const pendingCandidates =
  new Map();


const cameraData =
  new Map();


function send(message){

  if(
    ws.readyState ===
    WebSocket.OPEN
  ){

    ws.send(
      JSON.stringify(message)
    );

  }

}


/*
  CREATE UI
*/

function addCamera(
  cameraId
){

  if(
    cameraData.has(
      cameraId
    )
  ){

    return;

  }


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "cameraBox";


  /*
    FRONT
  */

  const frontTitle =
    document.createElement(
      "div"
    );


  frontTitle.className =
    "cameraTitle";


  frontTitle.textContent =
    "📷 Front Camera";


  const frontWrap =
    document.createElement(
      "div"
    );


  frontWrap.className =
    "videoWrap";


  const frontVideo =
    document.createElement(
      "video"
    );


  frontVideo.autoplay =
    true;


  frontVideo.playsInline =
    true;


  frontVideo.muted =
    true;


  const frontFullscreen =
    document.createElement(
      "button"
    );


  frontFullscreen.className =
    "fullscreen";


  frontFullscreen.textContent =
    "⛶";


  frontFullscreen.onclick =
    () => {

      frontWrap
        .requestFullscreen()
        .catch(() => {});

    };


  frontWrap.appendChild(
    frontVideo
  );


  frontWrap.appendChild(
    frontFullscreen
  );


  /*
    BACK
  */

  const backTitle =
    document.createElement(
      "div"
    );


  backTitle.className =
    "cameraTitle";


  backTitle.textContent =
    "📷 Back Camera";


  const backWrap =
    document.createElement(
      "div"
    );


  backWrap.className =
    "videoWrap";


  const backVideo =
    document.createElement(
      "video"
    );


  backVideo.autoplay =
    true;


  backVideo.playsInline =
    true;


  backVideo.muted =
    true;


  const backFullscreen =
    document.createElement(
      "button"
    );


  backFullscreen.className =
    "fullscreen";


  backFullscreen.textContent =
    "⛶";


  backFullscreen.onclick =
    () => {

      backWrap
        .requestFullscreen()
        .catch(() => {});

    };


  backWrap.appendChild(
    backVideo
  );


  backWrap.appendChild(
    backFullscreen
  );


  box.appendChild(
    frontTitle
  );


  box.appendChild(
    frontWrap
  );


  box.appendChild(
    backTitle
  );


  box.appendChild(
    backWrap
  );


  grid.appendChild(
    box
  );


  cameraData.set(
    cameraId,
    {

      box,

      frontVideo,

      backVideo,

      streams:{

        front:null,

        back:null

      }

    }
  );

}


function removeCamera(
  cameraId
){

  const pc =
    peers.get(
      cameraId
    );


  if(pc){

    try{
      pc.close();
    }catch{}

  }


  peers.delete(
    cameraId
  );


  pendingCandidates.delete(
    cameraId
  );


  const data =
    cameraData.get(
      cameraId
    );


  if(data){

    data.box.remove();

  }


  cameraData.delete(
    cameraId
  );

}


function startPeer(
  cameraId
){

  if(
    peers.has(
      cameraId
    )
  ){

    return;

  }


  addCamera(
    cameraId
  );


  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]

    });


  peers.set(
    cameraId,
    pc
  );


  pendingCandidates.set(
    cameraId,
    []
  );


  /*
    ICE
  */

  pc.onicecandidate =
    event => {

      if(
        event.candidate
      ){

        send({

          type:"candidate",

          candidate:
            event.candidate,

          cameraId

        });

      }

    };


  /*
    RECEIVE TRACKS

    The stream IDs sent from
    camera.html identify front/back.
  */

  pc.ontrack =
    event => {

      const data =
        cameraData.get(
          cameraId
        );


      if(!data){

        return;

      }


      const stream =
        event.streams[0];


      if(!stream){

        return;

      }


      /*
        Determine which camera.

        We use the stream metadata
        received in the offer mapping.
      */

      const mapping =
        trackMappings
          .get(cameraId) || [];


      const info =
        mapping.find(
          item =>

            item.streamId ===
            stream.id
        );


      let type =
        info
          ? info.type
          : null;


      /*
        Fallback:
        first video = front
        second = back
      */

      if(!type){

        if(
          !data.streams.front
        ){

          type =
            "front";

        }

        else{

          type =
            "back";

        }

      }


      data.streams[type] =
        stream;


      const video =
        type === "front"
          ? data.frontVideo
          : data.backVideo;


      video.srcObject =
        stream;


      video.play()
        .catch(() => {});


      status.textContent =
        "🟢 Camera LIVE";

    };


  pc.onconnectionstatechange =
    () => {

      console.log(
        cameraId,
        pc.connectionState
      );

    };


  /*
    ASK CAMERA FOR STREAM
  */

  send({

    type:"viewer-ready",

    cameraId

  });

}


/*
  TRACK MAPPING
*/

const trackMappings =
  new Map();


async function handleOffer(
  msg
){

  const cameraId =
    msg.cameraId;


  if(
    !peers.has(
      cameraId
    )
  ){

    startPeer(
      cameraId
    );

  }


  /*
    Save front/back stream IDs
  */

  if(
    Array.isArray(
      msg.tracks
    )
  ){

    trackMappings.set(
      cameraId,
      msg.tracks
    );

  }


  const pc =
    peers.get(
      cameraId
    );


  if(!pc){

    return;

  }


  try{

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        msg.offer
      )
    );


    const queued =
      pendingCandidates.get(
        cameraId
      ) || [];


    for(
      const candidate
      of queued
    ){

      await pc
        .addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        )
        .catch(() => {});

    }


    pendingCandidates.set(
      cameraId,
      []
    );


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    send({

      type:"answer",

      answer:
        pc.localDescription,

      cameraId

    });

  }

  catch(err){

    console.error(
      "Offer error:",
      err
    );


    status.textContent =
      "🔴 Connection error";

  }

}


async function handleCandidate(
  msg
){

  const pc =
    peers.get(
      msg.cameraId
    );


  if(
    !pc ||
    !msg.candidate
  ){

    return;

  }


  if(
    pc.remoteDescription
  ){

    await pc
      .addIceCandidate(
        new RTCIceCandidate(
          msg.candidate
        )
      )
      .catch(() => {});

  }

  else{

    const queue =
      pendingCandidates.get(
        msg.cameraId
      );


    if(queue){

      queue.push(
        msg.candidate
      );

    }

  }

}


/*
  WEBSOCKET
*/

ws.onopen =
  () => {

    status.textContent =
      "🟡 Waiting for cameras...";

  };


ws.onmessage =
  async event => {

    let msg;


    try{

      msg =
        JSON.parse(
          event.data
        );

    }

    catch{

      return;

    }


    console.log(
      "Server:",
      msg
    );


    if(
      msg.type ===
      "role"
    ){

      status.textContent =
        "🟡 Viewer connected";


      if(
        Array.isArray(
          msg.cameras
        )
      ){

        msg.cameras.forEach(
          cameraId => {

            startPeer(
              cameraId
            );

          }
        );

      }


      return;

    }


    if(
      msg.type ===
      "camera-online"
    ){

      startPeer(
        msg.cameraId
      );


      return;

    }


    if(
      msg.type ===
      "camera-live"
    ){

      addCamera(
        msg.cameraId
      );


      status.textContent =
        "🟢 Camera LIVE";


      return;

    }


    if(
      msg.type ===
      "camera-offline"
    ){

      removeCamera(
        msg.cameraId
      );


      status.textContent =
        "🔴 Camera offline";


      return;

    }


    if(
      msg.type ===
      "offer"
    ){

      await handleOffer(
        msg
      );

      return;

    }


    if(
      msg.type ===
      "candidate"
    ){

      await handleCandidate(
        msg
      );

    }

  };


ws.onerror =
  () => {

    status.textContent =
      "🔴 Viewer server error";

  };


ws.onclose =
  () => {

    status.textContent =
      "🔴 Viewer disconnected";

  };


window.addEventListener(
  "beforeunload",
  () => {

    peers.forEach(
      pc => {

        try{
          pc.close();
        }catch{}

      }
    );


    ws.close();

  }
);

</script>

</body>
  </html>
