<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Live Cameras</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

h2{
  text-align:center;
  padding:15px;
}

#grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));
  gap:12px;
  padding:12px;
}

.cameraBox{
  background:#000;
  border-radius:10px;
  overflow:hidden;
}

.cameraTitle{
  padding:10px;
  background:#222;
}

video{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  display:block;
  object-fit:contain;
}

.status{
  padding:10px;
  text-align:center;
  background:#222;
}

.controls{
  display:flex;
  gap:10px;
  padding:10px;
  background:#111;
}

button{
  padding:10px 15px;
  border:0;
  border-radius:6px;
  font-size:15px;
}

</style>

</head>

<body>

<h2>Live Cameras</h2>

<div id="grid"></div>

<script>

"use strict";

const grid =
  document.getElementById("grid");

const viewerId =
  crypto.randomUUID();

let socket = null;

const peers = new Map();

const videos = new Map();

const pendingIce = new Map();


/* ================================
   RTC CONFIG
================================ */

const rtcConfig = {

  iceServers:[

    {
      urls:
        "stun:stun.l.google.com:19302"
    },

    {
      urls:[
        "turn:openrelay.metered.ca:80",
        "turn:openrelay.metered.ca:443",
        "turn:openrelay.metered.ca:443?transport=tcp"
      ],

      username:
        "openrelayproject",

      credential:
        "openrelayproject"

    }

  ]

};


/* ================================
   CONNECT
================================ */

function connect(){

  if(
    socket &&
    (
      socket.readyState === WebSocket.OPEN ||
      socket.readyState === WebSocket.CONNECTING
    )
  ){
    return;
  }


  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  socket =
    new WebSocket(
      protocol + "//" + location.host
    );


  socket.onopen = () => {

    console.log(
      "VIEWER CONNECTED"
    );

    socket.send(
      JSON.stringify({

        type:"register-viewer",

        viewerId:viewerId

      })
    );

  };


  socket.onmessage =
    async event => {

      try{

        const msg =
          JSON.parse(event.data);


        if(
          msg.type === "camera-online"
        ){

          addCamera(
            msg.cameraId
          );

          return;

        }


        if(
          msg.type === "offer"
        ){

          await handleOffer(
            msg
          );

          return;

        }


        if(
          msg.type === "camera-ice"
        ){

          await handleCameraIce(
            msg
          );

          return;

        }


        if(
          msg.type === "camera-offline"
        ){

          removeCamera(
            msg.cameraId
          );

        }

      }catch(error){

        console.error(
          "MESSAGE ERROR:",
          error
        );

      }

    };


  socket.onclose = () => {

    socket = null;

    console.log(
      "VIEWER DISCONNECTED"
    );

    setTimeout(
      connect,
      1000
    );

  };

}


/* ================================
   ADD CAMERA
================================ */

function addCamera(cameraId){

  if(videos.has(cameraId)){
    return;
  }


  const box =
    document.createElement("div");

  box.className =
    "cameraBox";

  box.id =
    "camera-" + cameraId;


  const title =
    document.createElement("div");

  title.className =
    "cameraTitle";

  title.textContent =
    "Camera " +
    cameraId.substring(0,8);


  const video =
    document.createElement("video");

  video.autoplay = true;

  video.playsInline = true;

  video.muted = false;


  const status =
    document.createElement("div");

  status.className =
    "status";

  status.textContent =
    "Connecting...";


  const controls =
    document.createElement("div");

  controls.className =
    "controls";


  const fullBtn =
    document.createElement("button");

  fullBtn.textContent =
    "Fullscreen";


  fullBtn.onclick =
    async () => {

      try{

        await video.requestFullscreen();

      }catch(error){

        console.error(error);

      }

    };


  const muteBtn =
    document.createElement("button");

  muteBtn.textContent =
    "🔊 Mute";


  muteBtn.onclick =
    async () => {

      video.muted =
        !video.muted;


      if(video.muted){

        muteBtn.textContent =
          "🔇 Unmute";

      }else{

        muteBtn.textContent =
          "🔊 Mute";

        try{
          await video.play();
        }catch{}

      }

    };


  controls.appendChild(
    fullBtn
  );

  controls.appendChild(
    muteBtn
  );


  box.appendChild(title);

  box.appendChild(video);

  box.appendChild(status);

  box.appendChild(controls);

  grid.appendChild(box);


  videos.set(
    cameraId,
    {
      video:video,
      status:status
    }
  );


  if(
    socket &&
    socket.readyState === WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify({

        type:"watch-camera",

        cameraId:cameraId

      })
    );

  }

}


/* ================================
   HANDLE OFFER
================================ */

async function handleOffer(msg){

  const camera =
    videos.get(msg.cameraId);

  if(!camera){
    return;
  }


  const video =
    camera.video;

  const status =
    camera.status;


  const oldPeer =
    peers.get(msg.cameraId);

  if(oldPeer){

    try{
      oldPeer.close();
    }catch{}

  }


  const peer =
    new RTCPeerConnection(
      rtcConfig
    );


  peers.set(
    msg.cameraId,
    peer
  );


  /* ICE BUFFER */

  pendingIce.set(
    msg.cameraId,
    []
  );


  peer.ontrack =
    event => {

      console.log(
        "TRACK:",
        event.track.kind
      );


      if(
        event.streams &&
        event.streams[0]
      ){

        video.srcObject =
          event.streams[0];

      }else{

        if(!video.srcObject){

          video.srcObject =
            new MediaStream();

        }

        video.srcObject.addTrack(
          event.track
        );

      }


      video.play()
        .then(() => {

          status.textContent =
            "LIVE";

        })
        .catch(() => {

          status.textContent =
            "LIVE - Tap Unmute for audio";

        });

    };


  /* FAST ICE */

  peer.onicecandidate =
    event => {

      if(!event.candidate){
        return;
      }


      if(
        socket &&
        socket.readyState === WebSocket.OPEN
      ){

        socket.send(
          JSON.stringify({

            type:"viewer-ice",

            cameraId:
              msg.cameraId,

            viewerId:
              viewerId,

            candidate:
              event.candidate

          })
        );

      }

    };


  peer.onconnectionstatechange =
    () => {

      console.log(
        "STATE:",
        peer.connectionState
      );


      if(
        peer.connectionState === "connecting"
      ){

        status.textContent =
          "Connecting...";

      }


      if(
        peer.connectionState === "connected"
      ){

        status.textContent =
          "LIVE";

      }


      if(
        peer.connectionState === "failed"
      ){

        status.textContent =
          "Connection failed";

      }

    };


  await peer.setRemoteDescription({

    type:"offer",

    sdp:msg.sdp

  });


  /* Add ICE received before remote description */

  const queued =
    pendingIce.get(
      msg.cameraId
    ) || [];


  for(
    const candidate of queued
  ){

    try{

      await peer.addIceCandidate(
        new RTCIceCandidate(candidate)
      );

    }catch(error){

      console.error(
        error
      );

    }

  }


  pendingIce.set(
    msg.cameraId,
    []
  );


  const answer =
    await peer.createAnswer();


  await peer.setLocalDescription(
    answer
  );


  /* SEND ANSWER IMMEDIATELY */

  if(
    socket &&
    socket.readyState === WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify({

        type:"answer",

        cameraId:
          msg.cameraId,

        viewerId:
          viewerId,

        sdp:
          peer.localDescription.sdp

      })
    );

  }

}


/* ================================
   CAMERA ICE
================================ */

async function handleCameraIce(msg){

  const peer =
    peers.get(msg.cameraId);


  if(!peer){

    if(
      !pendingIce.has(msg.cameraId)
    ){

      pendingIce.set(
        msg.cameraId,
        []
      );

    }

    pendingIce
      .get(msg.cameraId)
      .push(msg.candidate);

    return;

  }


  try{

    await peer.addIceCandidate(
      new RTCIceCandidate(
        msg.candidate
      )
    );

  }catch(error){

    console.error(
      "ICE ERROR:",
      error
    );

  }

}


/* ================================
   REMOVE CAMERA
================================ */

function removeCamera(cameraId){

  const peer =
    peers.get(cameraId);

  if(peer){

    try{
      peer.close();
    }catch{}

    peers.delete(cameraId);

  }


  pendingIce.delete(
    cameraId
  );


  const box =
    document.getElementById(
      "camera-" + cameraId
    );

  if(box){
    box.remove();
  }


  videos.delete(
    cameraId
  );

}


window.addEventListener(
  "online",
  () => {
    connect();
  }
);


connect();

</script>

</body>
  </html>
