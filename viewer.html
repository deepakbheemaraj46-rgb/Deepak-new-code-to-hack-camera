<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Live Cameras</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

h2{
  text-align:center;
  padding:15px;
}

#grid{
  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));

  gap:12px;

  padding:12px;
}

.cameraBox{
  background:#000;
  border-radius:10px;
  overflow:hidden;
}

.cameraTitle{
  padding:10px;
  background:#222;
}

video{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  display:block;
  object-fit:contain;
}

.status{
  padding:10px;
  text-align:center;
  background:#222;
}

.controls{
  display:flex;
  gap:10px;
  padding:10px;
  background:#111;
}

button{
  padding:10px 15px;
  border:0;
  border-radius:6px;
  font-size:15px;
}

</style>

</head>

<body>

<h2>Live Cameras</h2>

<div id="grid"></div>


<script>

"use strict";


/* =========================================
   ELEMENTS
========================================= */

const grid =
  document.getElementById("grid");


/* =========================================
   VIEWER ID
========================================= */

const viewerId =
  crypto.randomUUID();


/* =========================================
   STATE
========================================= */

let socket = null;

const peers = new Map();

const videos = new Map();

const pendingIce = new Map();

const healthTimers = new Map();

const reconnectTimers = new Map();


/* =========================================
   WEBRTC
========================================= */

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    },

    {
      urls: [

        "turn:openrelay.metered.ca:80",

        "turn:openrelay.metered.ca:443",

        "turn:openrelay.metered.ca:443?transport=tcp"

      ],

      username:
        "openrelayproject",

      credential:
        "openrelayproject"

    }

  ]

};


/* =========================================
   CONNECT
========================================= */

function connect(){

  if(
    socket &&
    (
      socket.readyState === WebSocket.OPEN ||
      socket.readyState === WebSocket.CONNECTING
    )
  ){
    return;
  }


  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  console.log(
    "Connecting viewer..."
  );


  socket =
    new WebSocket(
      protocol +
      "//" +
      location.host
    );


  socket.onopen = () => {

    console.log(
      "VIEWER CONNECTED"
    );


    socket.send(
      JSON.stringify({

        type:
          "register-viewer",

        viewerId:
          viewerId

      })
    );

  };


  socket.onmessage =
    async event => {

      try{

        const msg =
          JSON.parse(
            event.data
          );


        /* CAMERA ONLINE */

        if(
          msg.type ===
          "camera-online"
        ){

          addCamera(
            msg.cameraId
          );

          return;

        }


        /* OFFER */

        if(
          msg.type ===
          "offer"
        ){

          await handleOffer(
            msg
          );

          return;

        }


        /* CAMERA ICE */

        if(
          msg.type ===
          "camera-ice"
        ){

          await handleCameraIce(
            msg
          );

          return;

        }


        /* CAMERA OFFLINE */

        if(
          msg.type ===
          "camera-offline"
        ){

          removeCamera(
            msg.cameraId
          );

          return;

        }

      }
      catch(error){

        console.error(
          "MESSAGE ERROR:",
          error
        );

      }

    };


  socket.onclose = () => {

    console.log(
      "VIEWER SOCKET CLOSED"
    );


    socket = null;


    setTimeout(
      connect,
      1000
    );

  };


  socket.onerror =
    error => {

      console.error(
        "SOCKET ERROR:",
        error
      );

    };

}


/* =========================================
   ADD CAMERA
========================================= */

function addCamera(cameraId){

  if(
    videos.has(cameraId)
  ){
    return;
  }


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "cameraBox";


  box.id =
    "camera-" +
    cameraId;


  const title =
    document.createElement(
      "div"
    );


  title.className =
    "cameraTitle";


  title.textContent =
    "Camera " +
    cameraId.substring(
      0,
      8
    );


  const video =
    document.createElement(
      "video"
    );


  video.autoplay =
    true;


  video.playsInline =
    true;


  video.muted =
    false;


  const status =
    document.createElement(
      "div"
    );


  status.className =
    "status";


  status.textContent =
    "Connecting...";


  const controls =
    document.createElement(
      "div"
    );


  controls.className =
    "controls";


  /* FULLSCREEN */

  const fullscreen =
    document.createElement(
      "button"
    );


  fullscreen.textContent =
    "Fullscreen";


  fullscreen.onclick =
    async () => {

      try{

        if(
          video.requestFullscreen
        ){

          await video.requestFullscreen();

        }

      }
      catch(error){

        console.error(
          "FULLSCREEN ERROR:",
          error
        );

      }

    };


  /* AUDIO */

  const muteButton =
    document.createElement(
      "button"
    );


  muteButton.textContent =
    "🔊 Mute";


  muteButton.onclick =
    async () => {

      video.muted =
        !video.muted;


      if(video.muted){

        muteButton.textContent =
          "🔇 Unmute";

      }
      else{

        muteButton.textContent =
          "🔊 Mute";


        try{

          await video.play();

        }
        catch{}

      }

    };


  controls.appendChild(
    fullscreen
  );


  controls.appendChild(
    muteButton
  );


  box.appendChild(
    title
  );


  box.appendChild(
    video
  );


  box.appendChild(
    status
  );


  box.appendChild(
    controls
  );


  grid.appendChild(
    box
  );


  videos.set(
    cameraId,
    {
      video:video,
      status:status
    }
  );


  startHealthCheck(
    cameraId
  );


  /* REQUEST CAMERA */

  requestCamera(
    cameraId
  );

}


/* =========================================
   REQUEST CAMERA
========================================= */

function requestCamera(cameraId){

  if(
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify({

        type:
          "watch-camera",

        cameraId:
          cameraId

      })
    );

  }

}


/* =========================================
   HANDLE OFFER
========================================= */

async function handleOffer(msg){

  const camera =
    videos.get(
      msg.cameraId
    );


  if(!camera){

    return;

  }


  const video =
    camera.video;


  const status =
    camera.status;


  /* Close old peer */

  const oldPeer =
    peers.get(
      msg.cameraId
    );


  if(oldPeer){

    try{
      oldPeer.close();
    }
    catch{}

  }


  const peer =
    new RTCPeerConnection(
      rtcConfig
    );


  peers.set(
    msg.cameraId,
    peer
  );


  pendingIce.set(
    msg.cameraId,
    []
  );


  /* =====================================
     RECEIVE VIDEO + AUDIO
  ===================================== */

  peer.ontrack =
    event => {

      console.log(
        "TRACK RECEIVED:",
        event.track.kind
      );


      if(
        event.streams &&
        event.streams.length > 0
      ){

        video.srcObject =
          event.streams[0];

      }
      else{

        if(
          !video.srcObject
        ){

          video.srcObject =
            new MediaStream();

        }


        video.srcObject.addTrack(
          event.track
        );

      }


      video.play()
        .then(() => {

          status.textContent =
            "LIVE";

        })
        .catch(error => {

          console.log(
            "Autoplay/audio blocked:",
            error
          );


          status.textContent =
            "LIVE - Tap Unmute for audio";

        });

    };


  /* =====================================
     SEND VIEWER ICE
  ===================================== */

  peer.onicecandidate =
    event => {

      if(
        !event.candidate
      ){
        return;
      }


      if(
        socket &&
        socket.readyState ===
        WebSocket.OPEN
      ){

        socket.send(
          JSON.stringify({

            type:
              "viewer-ice",

            cameraId:
              msg.cameraId,

            viewerId:
              viewerId,

            candidate:
              event.candidate

          })
        );

      }

    };


  /* =====================================
     CONNECTION STATE
  ===================================== */

  peer.onconnectionstatechange =
    () => {

      console.log(
        "CAMERA:",
        msg.cameraId,
        "STATE:",
        peer.connectionState
      );


      if(
        peer.connectionState ===
        "connecting"
      ){

        status.textContent =
          "Connecting...";

      }


      if(
        peer.connectionState ===
        "connected"
      ){

        status.textContent =
          "LIVE";

      }


      if(
        peer.connectionState ===
        "disconnected"
      ){

        status.textContent =
          "Reconnecting...";


        scheduleViewerRecovery(
          msg.cameraId
        );

      }


      if(
        peer.connectionState ===
        "failed"
      ){

        status.textContent =
          "Recovering...";


        scheduleViewerRecovery(
          msg.cameraId
        );

      }

    };


  peer.oniceconnectionstatechange =
    () => {

      console.log(
        "ICE:",
        peer.iceConnectionState
      );


      if(
        peer.iceConnectionState ===
        "failed"
      ){

        try{

          peer.restartIce();

        }
        catch{}

      }

    };


  /* =====================================
     SET OFFER
  ===================================== */

  try{

    await peer.setRemoteDescription({

      type:
        "offer",

      sdp:
        msg.sdp

    });


    /* ===================================
       ADD BUFFERED CAMERA ICE
    =================================== */

    const queued =
      pendingIce.get(
        msg.cameraId
      ) || [];


    for(
      const candidate of queued
    ){

      try{

        await peer.addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

      }
      catch(error){

        console.error(
          "BUFFERED CAMERA ICE ERROR:",
          error
        );

      }

    }


    pendingIce.set(
      msg.cameraId,
      []
    );


    /* ===================================
       CREATE ANSWER
    =================================== */

    const answer =
      await peer.createAnswer();


    await peer.setLocalDescription(
      answer
    );


    /* ===================================
       SEND ANSWER IMMEDIATELY
    =================================== */

    if(
      socket &&
      socket.readyState ===
      WebSocket.OPEN
    ){

      socket.send(
        JSON.stringify({

          type:
            "answer",

          cameraId:
            msg.cameraId,

          viewerId:
            viewerId,

          sdp:
            peer.localDescription.sdp

        })
      );


      console.log(
        "ANSWER SENT"
      );

    }

  }
  catch(error){

    console.error(
      "OFFER HANDLING ERROR:",
      error
    );


    scheduleViewerRecovery(
      msg.cameraId
    );

  }

}


/* =========================================
   CAMERA ICE
========================================= */

async function handleCameraIce(msg){

  const cameraId =
    msg.cameraId;


  const peer =
    peers.get(
      cameraId
    );


  /*
    Offer may not have arrived yet.
  */

  if(
    !peer ||
    !peer.remoteDescription
  ){

    if(
      !pendingIce.has(
        cameraId
      )
    ){

      pendingIce.set(
        cameraId,
        []
      );

    }


    pendingIce
      .get(cameraId)
      .push(
        msg.candidate
      );


    return;

  }


  try{

    await peer.addIceCandidate(
      new RTCIceCandidate(
        msg.candidate
      )
    );

  }
  catch(error){

    console.error(
      "CAMERA ICE ERROR:",
      error
    );

  }

}


/* =========================================
   VIDEO HEALTH CHECK
========================================= */

function startHealthCheck(cameraId){

  if(
    healthTimers.has(cameraId)
  ){

    clearInterval(
      healthTimers.get(cameraId)
    );

  }


  let lastTime = -1;

  let stuckCount = 0;


  const timer =
    setInterval(() => {

      const camera =
        videos.get(
          cameraId
        );


      if(!camera){
        return;
      }


      const video =
        camera.video;


      const peer =
        peers.get(
          cameraId
        );


      /*
        Only check once a peer exists.
      */

      if(!peer){
        return;
      }


      /*
        Connected but video not advancing.
      */

      if(
        peer.connectionState ===
        "connected"
      ){

        if(
          video.readyState >= 2 &&
          video.currentTime ===
          lastTime
        ){

          stuckCount++;

        }
        else{

          stuckCount = 0;

        }


        lastTime =
          video.currentTime;


        /*
          6 seconds without movement.
        */

        if(
          stuckCount >= 6
        ){

          console.log(
            "VIDEO FROZEN:",
            cameraId
          );


          stuckCount = 0;


          recoverViewerCamera(
            cameraId
          );

        }

      }
      else{

        stuckCount = 0;

      }

    },1000);


  healthTimers.set(
    cameraId,
    timer
  );

}


/* =========================================
   RECOVER VIEWER CAMERA
========================================= */

function recoverViewerCamera(cameraId){

  console.log(
    "RECOVERING:",
    cameraId
  );


  const camera =
    videos.get(
      cameraId
    );


  if(camera){

    camera.status.textContent =
      "Reconnecting...";

  }


  const peer =
    peers.get(
      cameraId
    );


  if(peer){

    try{
      peer.close();
    }
    catch{}

    peers.delete(
      cameraId
    );

  }


  pendingIce.delete(
    cameraId
  );


  /*
    Ask camera for a fresh WebRTC connection.
  */

  setTimeout(() => {

    requestCamera(
      cameraId
    );

  },500);

}


/* =========================================
   RECOVERY TIMER
========================================= */

function scheduleViewerRecovery(cameraId){

  if(
    reconnectTimers.has(
      cameraId
    )
  ){

    return;

  }


  const timer =
    setTimeout(() => {

      reconnectTimers.delete(
        cameraId
      );


      recoverViewerCamera(
        cameraId
      );

    },2000);


  reconnectTimers.set(
    cameraId,
    timer
  );

}


/* =========================================
   REMOVE CAMERA
========================================= */

function removeCamera(cameraId){

  const peer =
    peers.get(
      cameraId
    );


  if(peer){

    try{
      peer.close();
    }
    catch{}

    peers.delete(
      cameraId
    );

  }


  pendingIce.delete(
    cameraId
  );


  const healthTimer =
    healthTimers.get(
      cameraId
    );


  if(healthTimer){

    clearInterval(
      healthTimer
    );

    healthTimers.delete(
      cameraId
    );

  }


  const reconnectTimer =
    reconnectTimers.get(
      cameraId
    );


  if(reconnectTimer){

    clearTimeout(
      reconnectTimer
    );

    reconnectTimers.delete(
      cameraId
    );

  }


  const box =
    document.getElementById(
      "camera-" +
      cameraId
    );


  if(box){

    box.remove();

  }


  videos.delete(
    cameraId
  );

}


/* =========================================
   INTERNET
========================================= */

window.addEventListener(
  "online",
  () => {

    console.log(
      "INTERNET RESTORED"
    );


    connect();

  }
);


/* =========================================
   START
========================================= */

connect();

</script>

</body>
</html>
