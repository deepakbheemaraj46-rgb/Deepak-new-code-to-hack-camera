<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Camera Viewer</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:15px;
}

#status{
  font-size:18px;
  margin:15px;
}

#grid{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(280px,1fr)
    );
  gap:12px;
  padding:12px;
}

.card{
  background:#222;
  border-radius:10px;
  padding:8px;
}

.label{
  font-size:14px;
  color:#ddd;
  padding:6px;
}

video{
  width:100%;
  min-height:220px;
  display:block;
  background:#000;
  border-radius:8px;
  object-fit:contain;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">
  🟡 Connecting...
</div>

<div id="grid"></div>

<script>

const status =
  document.getElementById(
    "status"
  );

const grid =
  document.getElementById(
    "grid"
  );


const ws =
  new WebSocket(

    (location.protocol === "https:"
      ? "wss:"
      : "ws:") +

    "//" +
    location.host +
    "/viewer"

  );


const peers =
  new Map();

const pendingCandidates =
  new Map();

const cards =
  new Map();


function send(message){

  if(
    ws.readyState ===
    WebSocket.OPEN
  ){

    ws.send(
      JSON.stringify(message)
    );

  }

}


function addCamera(cameraId){

  if(
    cards.has(cameraId)
  ){

    return cards.get(
      cameraId
    );

  }


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "card";


  const label =
    document.createElement(
      "div"
    );


  label.className =
    "label";


  label.textContent =
    "Camera " +
    cameraId;


  const video =
    document.createElement(
      "video"
    );


  video.autoplay =
    true;


  video.playsInline =
    true;


  video.muted =
    true;


  card.append(
    label,
    video
  );


  grid.appendChild(
    card
  );


  const item = {

    card,

    label,

    video,

    stream:null

  };


  cards.set(
    cameraId,
    item
  );


  return item;

}


function removeCamera(cameraId){

  const pc =
    peers.get(
      cameraId
    );


  if(pc){

    try{

      pc.close();

    }

    catch(error){}

  }


  peers.delete(
    cameraId
  );


  pendingCandidates.delete(
    cameraId
  );


  const item =
    cards.get(
      cameraId
    );


  if(item){

    item.video.srcObject =
      null;

    item.card.remove();

  }


  cards.delete(
    cameraId
  );

}


function startPeer(cameraId){

  if(
    peers.has(cameraId)
  ){

    return peers.get(
      cameraId
    );

  }


  addCamera(
    cameraId
  );


  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]

    });


  peers.set(
    cameraId,
    pc
  );


  pendingCandidates.set(
    cameraId,
    []
  );


  pc.onicecandidate =
    event => {

      if(event.candidate){

        send({

          type:"candidate",

          candidate:
            event.candidate,

          cameraId

        });

      }

    };


  /*
    Receive all available video tracks.
  */

  pc.ontrack =
    event => {

      if(
        event.track.kind !==
        "video"
      ){

        return;

      }


      const item =
        cards.get(
          cameraId
        );


      if(!item){

        return;

      }


      if(!item.stream){

        item.stream =
          new MediaStream();


        item.video.srcObject =
          item.stream;

      }


      const alreadyAdded =
        item.stream
          .getTracks()
          .some(
            track =>
              track.id ===
              event.track.id
          );


      if(!alreadyAdded){

        item.stream.addTrack(
          event.track
        );

      }


      item.video
        .play()
        .catch(
          () => {}
        );


      status.textContent =
        "🟢 Camera is LIVE";

    };


  pc.onconnectionstatechange =
    () => {

      if(
        pc.connectionState ===
        "connected"
      ){

        status.textContent =
          "🟢 Camera is LIVE";

      }

      if(
        pc.connectionState ===
        "failed"
      ){

        status.textContent =
          "🔴 Connection failed";

      }

    };


  send({

    type:"viewer-ready",

    cameraId

  });


  return pc;

}


async function handleOffer(msg){

  const pc =
    startPeer(
      msg.cameraId
    );


  try{

    await pc.setRemoteDescription(
      msg.offer
    );


    const queue =
      pendingCandidates.get(
        msg.cameraId
      ) || [];


    for(
      const candidate of
      queue
    ){

      await pc
        .addIceCandidate(
          candidate
        )
        .catch(
          () => {}
        );

    }


    pendingCandidates.set(
      msg.cameraId,
      []
    );


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    send({

      type:"answer",

      answer:
        pc.localDescription,

      cameraId:
        msg.cameraId

    });

  }

  catch(error){

    console.error(
      "Offer error:",
      error
    );


    status.textContent =
      "🔴 WebRTC error";

  }

}


async function handleCandidate(msg){

  const pc =
    peers.get(
      msg.cameraId
    );


  if(
    !pc ||
    !msg.candidate
  ){

    return;

  }


  if(
    pc.remoteDescription
  ){

    await pc
      .addIceCandidate(
        msg.candidate
      )
      .catch(
        () => {}
      );

  }

  else{

    const queue =
      pendingCandidates.get(
        msg.cameraId
      );


    if(queue){

      queue.push(
        msg.candidate
      );

    }

  }

}


ws.onopen =
  () => {

    status.textContent =
      "🟡 Waiting for camera...";

  };


ws.onmessage =
  async event => {

    let msg;


    try{

      msg =
        JSON.parse(
          event.data
        );

    }

    catch(error){

      return;

    }


    if(
      msg.type ===
      "role"
    ){

      status.textContent =
        "🟡 Viewer connected";


      if(
        Array.isArray(
          msg.cameras
        )
      ){

        msg.cameras.forEach(
          startPeer
        );

      }


      return;

    }


    if(
      msg.type ===
      "camera-online"
    ){

      startPeer(
        msg.cameraId
      );


      status.textContent =
        "🟡 Camera connected";


      return;

    }


    if(
      msg.type ===
      "camera-live"
    ){

      startPeer(
        msg.cameraId
      );


      status.textContent =
        "🟢 Camera is LIVE";


      return;

    }


    if(
      msg.type ===
      "camera-offline"
    ){

      removeCamera(
        msg.cameraId
      );


      status.textContent =
        peers.size
          ? "🟡 Waiting..."
          : "🔴 No camera connected";


      return;

    }


    if(
      msg.type ===
      "offer"
    ){

      await handleOffer(
        msg
      );


      return;

    }


    if(
      msg.type ===
      "candidate"
    ){

      await handleCandidate(
        msg
      );

    }

  };


ws.onclose =
  () => {

    status.textContent =
      "🔴 Viewer connection closed";

  };

</script>

</body>
</html>
