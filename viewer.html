<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Viewer</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial;
  text-align:center;
  padding:15px;
}

h1{
  font-size:25px;
}

#status{
  font-size:17px;
  margin:15px;
}

#buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:15px 0;
}

button{
  border:0;
  border-radius:8px;
  padding:14px 22px;
  font-size:16px;
  cursor:pointer;
}

#frontBtn{
  background:#fff;
  color:#111;
}

#backBtn{
  background:#fff;
  color:#111;
}

button:disabled{
  opacity:.4;
}

#cameraBox{
  max-width:900px;
  margin:auto;
  background:#222;
  border-radius:10px;
  padding:10px;
}

#cameraLabel{
  font-size:18px;
  padding:10px;
}

video{
  width:100%;
  background:#000;
  border-radius:8px;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">
  Connecting...
</div>

<div id="buttons">

  <button
    id="frontBtn"
    onclick="switchCamera('user')"
    disabled>
    📷 Front Camera
  </button>

  <button
    id="backBtn"
    onclick="switchCamera('environment')"
    disabled>
    📷 Back Camera
  </button>

</div>

<div id="cameraBox">

  <div id="cameraLabel">
    Camera: Waiting...
  </div>

  <video
    id="remoteVideo"
    autoplay
    playsinline
    muted>
  </video>

</div>

<script>
const status =
  document.getElementById("status");

const frontBtn =
  document.getElementById("frontBtn");

const backBtn =
  document.getElementById("backBtn");

const cameraLabel =
  document.getElementById("cameraLabel");

const remoteVideo =
  document.getElementById("remoteVideo");

const ws = new WebSocket(
  (location.protocol === "https:" ? "wss:" : "ws:") +
  "//" +
  location.host +
  "/viewer"
);

let viewerId = null;
let cameraId = null;
let pc = null;

const pendingCandidates = [];

function send(message) {
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(message));
  }
}

/*
 * Connect to camera.
 */
function startPeer(id) {
  if (pc) {
    pc.close();
    pc = null;
  }

  cameraId = id;

  pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  /*
   * Receive active camera.
   */
  pc.ontrack = event => {
    if (event.track.kind === "video") {
      const stream =
        event.streams[0] ||
        new MediaStream([
          event.track
        ]);

      remoteVideo.srcObject =
        stream;

      remoteVideo.play().catch(
        () => {}
      );
    }
  };

  /*
   * ICE.
   */
  pc.onicecandidate = event => {
    if (event.candidate) {
      send({
        type: "candidate",
        candidate: event.candidate,
        cameraId
      });
    }
  };

  pc.onconnectionstatechange = () => {
    if (
      pc.connectionState ===
      "connected"
    ) {
      status.textContent =
        "🟢 Camera LIVE";
    }

    if (
      pc.connectionState ===
        "disconnected" ||
      pc.connectionState ===
        "failed"
    ) {
      status.textContent =
        "🔴 Camera connection lost";
    }
  };

  /*
   * Tell camera this viewer is ready.
   */
  send({
    type: "viewer-ready",
    cameraId
  });
}

/*
 * Viewer requests front/back camera.
 */
function switchCamera(facingMode) {
  if (!cameraId) {
    return;
  }

  status.textContent =
    "🟡 Switching camera...";

  send({
    type: "switch-camera",
    facingMode
  });

  if (facingMode === "user") {
    cameraLabel.textContent =
      "Camera: Switching to Front Camera...";
  } else {
    cameraLabel.textContent =
      "Camera: Switching to Back Camera...";
  }
}

ws.onopen = () => {
  status.textContent =
    "🟡 Viewer connected";
};

ws.onmessage = async event => {
  let msg;

  try {
    msg = JSON.parse(event.data);
  } catch {
    return;
  }

  /*
   * Viewer role.
   */
  if (msg.type === "role") {
    viewerId =
      msg.viewerId;

    if (
      Array.isArray(msg.cameras) &&
      msg.cameras.length > 0
    ) {
      startPeer(
        msg.cameras[0]
      );
    }
  }

  /*
   * Camera online.
   */
  if (msg.type === "camera-online") {
    cameraId =
      msg.cameraId;

    frontBtn.disabled = false;
    backBtn.disabled = false;

    startPeer(
      msg.cameraId
    );

    status.textContent =
      "🟡 Camera connected";
  }

  /*
   * Camera live.
   */
  if (msg.type === "camera-live") {
    cameraId =
      msg.cameraId;

    frontBtn.disabled = false;
    backBtn.disabled = false;

    if (msg.facingMode === "user") {
      cameraLabel.textContent =
        "Camera: Front Camera";
    }

    if (
      msg.facingMode ===
      "environment"
    ) {
      cameraLabel.textContent =
        "Camera: Back Camera";
    }

    status.textContent =
      "🟢 Camera LIVE";
  }

  /*
   * Offer from camera.
   */
  if (msg.type === "offer") {
    if (!pc || cameraId !== msg.cameraId) {
      startPeer(msg.cameraId);
    }

    if (!pc) {
      return;
    }

    try {
      await pc.setRemoteDescription(
        msg.offer
      );

      /*
       * Add queued ICE candidates.
       */
      while (
        pendingCandidates.length
      ) {
        const candidate =
          pendingCandidates.shift();

        await pc.addIceCandidate(
          candidate
        ).catch(() => {});
      }

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      send({
        type: "answer",
        answer: pc.localDescription,
        cameraId
      });

    } catch (err) {
      console.error(
        "Offer handling error:",
        err
      );
    }
  }

  /*
   * ICE from camera.
   */
  if (msg.type === "candidate") {
    if (!pc) {
      return;
    }

    if (pc.remoteDescription) {
      await pc.addIceCandidate(
        msg.candidate
      ).catch(() => {});
    } else {
      pendingCandidates.push(
        msg.candidate
      );
    }
  }

  /*
   * Camera disconnected.
   */
  if (msg.type === "camera-offline") {
    cameraId = null;

    frontBtn.disabled = true;
    backBtn.disabled = true;

    if (pc) {
      pc.close();
      pc = null;
    }

    remoteVideo.srcObject =
      null;

    cameraLabel.textContent =
      "Camera: Offline";

    status.textContent =
      "🔴 Camera offline";
  }
};

ws.onclose = () => {
  status.textContent =
    "🔴 Viewer connection closed";

  frontBtn.disabled = true;
  backBtn.disabled = true;
};

ws.onerror = () => {
  status.textContent =
    "❌ Viewer connection error";
};
</script>

</body>
  </html>
