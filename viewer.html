<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Live Cameras</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

h2{
  text-align:center;
  padding:15px;
}

#grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));
  gap:12px;
  padding:12px;
}

.cameraBox{
  background:#000;
  border-radius:10px;
  overflow:hidden;
}

.cameraTitle{
  padding:10px;
  background:#222;
}

video{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  display:block;
  object-fit:contain;
}

.status{
  padding:10px;
  text-align:center;
  background:#222;
}

.controls{
  padding:10px;
  background:#111;
}

button{
  padding:10px 15px;
  border:0;
  border-radius:6px;
  cursor:pointer;
}

</style>

</head>

<body>

<h2>Live Cameras</h2>

<div id="grid"></div>


<script>

"use strict";


/* =====================================
   VARIABLES
===================================== */

const grid =
  document.getElementById("grid");

const viewerId =
  crypto.randomUUID();

const peers =
  new Map();

const videos =
  new Map();

let socket = null;


/* =====================================
   WEBRTC SERVERS
===================================== */

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    },

    {
      urls: [
        "turn:openrelay.metered.ca:80",
        "turn:openrelay.metered.ca:443",
        "turn:openrelay.metered.ca:443?transport=tcp"
      ],

      username:
        "openrelayproject",

      credential:
        "openrelayproject"
    }

  ]

};


/* =====================================
   CONNECT SOCKET
===================================== */

function connect(){

  if(
    socket &&
    (
      socket.readyState ===
        WebSocket.OPEN ||
      socket.readyState ===
        WebSocket.CONNECTING
    )
  ){
    return;
  }


  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  socket =
    new WebSocket(
      protocol +
      "//" +
      location.host
    );


  socket.onopen = () => {

    console.log(
      "Viewer WebSocket connected"
    );


    socket.send(
      JSON.stringify({

        type:
          "register-viewer",

        viewerId:
          viewerId

      })
    );

  };


  socket.onmessage =
    async event => {

      try{

        const msg =
          JSON.parse(
            event.data
          );


        console.log(
          "Received:",
          msg.type
        );


        /* CAMERA ONLINE */

        if(
          msg.type ===
          "camera-online"
        ){

          addCamera(
            msg.cameraId
          );

          return;
        }


        /* OFFER */

        if(
          msg.type ===
          "offer"
        ){

          await handleOffer(
            msg
          );

          return;
        }


        /* CAMERA ICE */

        if(
          msg.type ===
          "camera-ice"
        ){

          await handleCameraIce(
            msg
          );

          return;
        }


        /* CAMERA OFFLINE */

        if(
          msg.type ===
          "camera-offline"
        ){

          removeCamera(
            msg.cameraId
          );

          return;
        }

      }catch(error){

        console.error(
          "Message error:",
          error
        );

      }

    };


  socket.onclose = () => {

    console.log(
      "WebSocket disconnected"
    );

    setTimeout(
      connect,
      2000
    );

  };


  socket.onerror = error => {

    console.error(
      "WebSocket error:",
      error
    );

  };

}


/* =====================================
   ADD CAMERA
===================================== */

function addCamera(
  cameraId
){

  if(
    videos.has(
      cameraId
    )
  ){
    return;
  }


  const box =
    document.createElement(
      "div"
    );

  box.className =
    "cameraBox";

  box.id =
    "camera-" +
    cameraId;


  const title =
    document.createElement(
      "div"
    );

  title.className =
    "cameraTitle";

  title.textContent =
    "Camera " +
    cameraId.substring(
      0,
      8
    );


  const video =
    document.createElement(
      "video"
    );

  video.autoplay =
    true;

  video.playsInline =
    true;

  video.muted =
    true;


  const status =
    document.createElement(
      "div"
    );

  status.className =
    "status";

  status.textContent =
    "Connecting camera...";


  const controls =
    document.createElement(
      "div"
    );

  controls.className =
    "controls";


  const fullscreen =
    document.createElement(
      "button"
    );

  fullscreen.textContent =
    "Fullscreen";


  fullscreen.onclick =
    async () => {

      try{

        await video.requestFullscreen();

      }catch(error){

        console.error(
          error
        );

      }

    };


  controls.appendChild(
    fullscreen
  );


  box.appendChild(
    title
  );

  box.appendChild(
    video
  );

  box.appendChild(
    status
  );

  box.appendChild(
    controls
  );


  grid.appendChild(
    box
  );


  videos.set(
    cameraId,
    {
      video,
      status
    }
  );


  /* REQUEST CAMERA */

  socket.send(
    JSON.stringify({

      type:
        "watch-camera",

      cameraId:
        cameraId

    })
  );

}


/* =====================================
   HANDLE OFFER
===================================== */

async function handleOffer(
  msg
){

  console.log(
    "Handling offer:",
    msg.cameraId
  );


  const camera =
    videos.get(
      msg.cameraId
    );


  if(!camera){

    console.error(
      "Camera video not found"
    );

    return;

  }


  const video =
    camera.video;

  const status =
    camera.status;


  /* CLOSE OLD PEER */

  const oldPeer =
    peers.get(
      msg.cameraId
    );


  if(oldPeer){

    try{
      oldPeer.close();
    }catch{}

  }


  /* CREATE PEER */

  const peer =
    new RTCPeerConnection(
      rtcConfig
    );


  peers.set(
    msg.cameraId,
    peer
  );


  /* =================================
     IMPORTANT: RECEIVE TRACK
  ================================= */

  peer.ontrack =
    event => {

      console.log(
        "TRACK RECEIVED",
        event.track.kind
      );


      let stream;


      if(
        event.streams &&
        event.streams.length
      ){

        stream =
          event.streams[0];

      }else{

        stream =
          new MediaStream();

        stream.addTrack(
          event.track
        );

      }


      video.srcObject =
        stream;


      status.textContent =
        "Camera stream received";


      video.play()
        .then(() => {

          console.log(
            "VIDEO PLAYING"
          );

          status.textContent =
            "LIVE";

        })
        .catch(error => {

          console.error(
            "Video play failed:",
            error
          );

          status.textContent =
            "Video play blocked";

        });

    };


  /* =================================
     ICE
  ================================= */

  peer.onicecandidate =
    event => {

      if(
        !event.candidate
      ){
        return;
      }


      if(
        socket &&
        socket.readyState ===
          WebSocket.OPEN
      ){

        socket.send(
          JSON.stringify({

            type:
              "viewer-ice",

            cameraId:
              msg.cameraId,

            viewerId:
              viewerId,

            candidate:
              event.candidate

          })
        );

      }

    };


  /* =================================
     CONNECTION STATE
  ================================= */

  peer.onconnectionstatechange =
    () => {

      console.log(
        "Connection state:",
        peer.connectionState
      );


      if(
        peer.connectionState ===
        "connecting"
      ){

        status.textContent =
          "Connecting camera...";

      }


      if(
        peer.connectionState ===
        "connected"
      ){

        status.textContent =
          "Connected - waiting for video...";

      }


      if(
        peer.connectionState ===
        "failed"
      ){

        status.textContent =
          "WebRTC connection failed";

      }


      if(
        peer.connectionState ===
        "disconnected"
      ){

        status.textContent =
          "Camera disconnected";

      }

    };


  /* =================================
     ICE CONNECTION STATE
  ================================= */

  peer.oniceconnectionstatechange =
    () => {

      console.log(
        "ICE state:",
        peer.iceConnectionState
      );

    };


  /* =================================
     REMOTE OFFER
  ================================= */

  await peer.setRemoteDescription({

    type:
      "offer",

    sdp:
      msg.sdp

  });


  /* =================================
     ANSWER
  ================================= */

  const answer =
    await peer.createAnswer();


  await peer.setLocalDescription(
    answer
  );


  socket.send(
    JSON.stringify({

      type:
        "answer",

      cameraId:
        msg.cameraId,

      viewerId:
        viewerId,

      sdp:
        peer.localDescription.sdp

    })
  );


  console.log(
    "Answer sent"
  );

}


/* =====================================
   CAMERA ICE
===================================== */

async function handleCameraIce(
  msg
){

  const peer =
    peers.get(
      msg.cameraId
    );


  if(!peer){

    console.log(
      "Peer not ready for ICE"
    );

    return;

  }


  try{

    await peer.addIceCandidate(
      new RTCIceCandidate(
        msg.candidate
      )
    );


    console.log(
      "Camera ICE added"
    );

  }catch(error){

    console.error(
      "ICE candidate error:",
      error
    );

  }

}


/* =====================================
   REMOVE CAMERA
===================================== */

function removeCamera(
  cameraId
){

  const peer =
    peers.get(
      cameraId
    );


  if(peer){

    try{
      peer.close();
    }catch{}

    peers.delete(
      cameraId
    );

  }


  const box =
    document.getElementById(
      "camera-" +
      cameraId
    );


  if(box){

    box.remove();

  }


  videos.delete(
    cameraId
  );

}


/* =====================================
   INTERNET
===================================== */

window.addEventListener(
  "online",
  () => {

    connect();

  }
);


/* =====================================
   START
===================================== */

connect();

</script>

</body>
</html>
