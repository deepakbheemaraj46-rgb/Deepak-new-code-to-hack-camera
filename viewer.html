<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👁️ Multi-Camera Viewer</title>
  <style>
    body { margin: 0; background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; }
    h1 { margin-bottom: 20px; }
    .camera-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .camera-card { position: relative; background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
    .camera-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #0f172a; }
    .status-badge { color: #22c55e; font-weight: bold; font-size: 14px; }
    .video-wrapper { position: relative; width: 100%; height: 240px; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
    .fs-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); border: 1px solid #fff; color: white; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

  <h1>👁️ Multi-Camera Viewer</h1>

  <div class="camera-grid" id="cameraGrid">
    <!-- Camera Slot 1 -->
    <div class="camera-card" id="card-1">
      <div class="camera-header">
        <span>Camera ID: <strong>#1</strong></span>
        <span class="status-badge">🟢 Live status</span>
      </div>
      <div class="video-wrapper">
        <video id="remoteVideo-1" autoplay playsinline ondblclick="toggleFullScreen(this)"></video>
        <button class="fs-btn" onclick="toggleFullScreen(document.getElementById('remoteVideo-1'))">⛶ Full-screen</button>
      </div>
    </div>

    <!-- Camera Slot 2 -->
    <div class="camera-card" id="card-2">
      <div class="camera-header">
        <span>Camera ID: <strong>#2</strong></span>
        <span class="status-badge">🟢 Live status</span>
      </div>
      <div class="video-wrapper">
        <video id="remoteVideo-2" autoplay playsinline ondblclick="toggleFullScreen(this)"></video>
        <button class="fs-btn" onclick="toggleFullScreen(document.getElementById('remoteVideo-2'))">⛶ Full-screen</button>
      </div>
    </div>
  </div>

  <script>
    function toggleFullScreen(element) {
      if (!document.fullscreenElement) {
        if (element.requestFullscreen) {
          element.requestFullscreen();
        } else if (element.webkitRequestFullscreen) {
          element.webkitRequestFullscreen();
        } else if (element.msRequestFullscreen) {
          element.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
