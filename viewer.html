<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>Camera Viewer</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: #111;

    color: white;

    font-family: Arial;
}

body {

    display: flex;

    flex-direction: column;

    align-items: center;

}

h1 {

    margin: 20px;

}

#status {

    padding: 10px 15px;

    background: #333;

    border-radius: 20px;

}

video {

    width: 95%;

    max-width: 800px;

    margin-top: 20px;

    background: black;

    border-radius: 12px;

}

.controls {

    display: flex;

    gap: 10px;

    margin-top: 15px;

}

button {

    padding: 12px 18px;

    border: 0;

    border-radius: 10px;

    font-weight: bold;

}

button:active {

    transform: scale(.96);

}

</style>

</head>

<body>

<h1>Camera Viewer</h1>

<div id="status">
    Connecting...
</div>

<video
    id="liveVideo"
    autoplay
    playsinline>
</video>

<div class="controls">

    <button
        id="frontButton">
        📱 Front Camera
    </button>

    <button
        id="backButton">
        📷 Back Camera
    </button>

</div>


<script>

"use strict";


const video =
    document.getElementById(
        "liveVideo"
    );

const status =
    document.getElementById(
        "status"
    );

const frontButton =
    document.getElementById(
        "frontButton"
    );

const backButton =
    document.getElementById(
        "backButton"
    );


let socket = null;

let viewerId = null;

let cameraId = null;

let peer = null;


/* =====================================
   WEBSOCKET
===================================== */

const protocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";

const WS_URL =
    protocol +
    "//" +
    location.host +
    "/viewer";


function connect() {

    socket =
        new WebSocket(
            WS_URL
        );


    socket.onopen = () => {

        status.textContent =
            "Connected - waiting for camera";

    };


    socket.onclose = () => {

        status.textContent =
            "Disconnected";
    };


    socket.onmessage =
        async event => {

            let msg;

            try {

                msg =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }


            /* ========================
               VIEWER ID
            ======================== */

            if (
                msg.type === "role"
            ) {

                viewerId =
                    msg.viewerId;

                return;
            }


            /* ========================
               CAMERA AVAILABLE
            ======================== */

            if (
                msg.type ===
                    "camera-online" ||

                msg.type ===
                    "camera-live"
            ) {

                cameraId =
                    msg.cameraId;


                status.textContent =
                    "🟢 Camera available";


                requestCamera();

                return;
            }


            /* ========================
               CAMERA OFFLINE
            ======================== */

            if (
                msg.type ===
                    "camera-offline"
            ) {

                status.textContent =
                    "🔴 Camera offline";

                return;
            }


            /* ========================
               OFFER
            ======================== */

            if (
                msg.type === "offer"
            ) {

                await handleOffer(
                    msg
                );

                return;
            }


            /* ========================
               ICE
            ======================== */

            if (
                msg.type ===
                    "candidate"
            ) {

                if (!peer) return;


                try {

                    await peer
                        .addIceCandidate(
                            msg.candidate
                        );

                } catch (error) {

                    console.warn(
                        error
                    );
                }

                return;
            }

        };
}


/* =====================================
   REQUEST CAMERA
===================================== */

function requestCamera() {

    if (
        !cameraId ||
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {

        return;
    }


    socket.send(
        JSON.stringify({

            type:
                "viewer-ready",

            cameraId

        })
    );


    status.textContent =
        "Connecting to camera...";
}


/* =====================================
   OFFER
===================================== */

async function handleOffer(
    msg
) {

    if (peer) {

        peer.close();
    }


    peer =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        });


    peer.ontrack =
        event => {

            if (
                event.streams &&
                event.streams[0]
            ) {

                video.srcObject =
                    event.streams[0];


                video.play()
                    .catch(
                        console.warn
                    );


                status.textContent =
                    "🟢 LIVE";
            }
        };


    peer.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {

                return;
            }


            socket.send(
                JSON.stringify({

                    type:
                        "candidate",

                    cameraId,

                    candidate:
                        event.candidate

                })
            );

        };


    peer.onconnectionstatechange =
        () => {

            if (!peer) {
                return;
            }


            console.log(
                "WebRTC:",
                peer.connectionState
            );


            if (
                peer.connectionState ===
                    "connected"
            ) {

                status.textContent =
                    "🟢 LIVE";
            }


            if (
                peer.connectionState ===
                    "disconnected"
            ) {

                status.textContent =
                    "🟡 Connection interrupted";
            }


            if (
                peer.connectionState ===
                    "failed"
            ) {

                status.textContent =
                    "🔴 Connection failed";
            }

        };


    await peer.setRemoteDescription(
        msg.offer
    );


    const answer =
        await peer.createAnswer();


    await peer.setLocalDescription(
        answer
    );


    socket.send(
        JSON.stringify({

            type:
                "answer",

            cameraId,

            answer

        })
    );

}


/* =====================================
   CAMERA SWITCH REQUEST
===================================== */

function requestCameraSwitch(
    mode
) {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN ||
        !cameraId
    ) {

        status.textContent =
            "Camera is not connected";

        return;
    }


    status.textContent =
        mode === "environment"
            ? "Requesting back camera..."
            : "Requesting front camera...";


    socket.send(
        JSON.stringify({

            type:
                "camera-switch",

            cameraId,

            mode

        })
    );

}


/* =====================================
   BUTTONS
===================================== */

frontButton.addEventListener(
    "click",
    () => {

        requestCameraSwitch(
            "user"
        );

    }
);


backButton.addEventListener(
    "click",
    () => {

        requestCameraSwitch(
            "environment"
        );

    }
);


/* =====================================
   CLOSE
===================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if (peer) {

            peer.close();
        }


        if (socket) {

            socket.close();
        }


        video.srcObject =
            null;
    }
);


/* =====================================
   START
===================================== */

connect();

</script>

</body>

</html>
