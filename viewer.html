<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Authorized Camera Viewer</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    h2 {
      text-align: center;
    }

    #grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(300px, 1fr));
      gap: 10px;
      padding: 10px;
    }

    .camera {
      background: #000;
      position: relative;
    }

    video {
      width: 100%;
      display: block;
      background: black;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>Authorized Camera Viewer</h2>

<div id="grid"></div>

<script>
"use strict";

const grid =
  document.getElementById("grid");

const protocol =
  location.protocol === "https:"
    ? "wss:"
    : "ws:";

const socket =
  new WebSocket(
    protocol + "//" + location.host
  );

const cameras = new Map();

socket.onopen = () => {
  socket.send(JSON.stringify({
    type: "register-viewer"
  }));
};

socket.onmessage = async event => {
  const message =
    JSON.parse(event.data);

  if (message.type === "camera-online") {
    addCamera(message.cameraId);
  }

  if (message.type === "camera-offline") {
    removeCamera(message.cameraId);
  }
};

function addCamera(id) {
  if (cameras.has(id)) return;

  const container =
    document.createElement("div");

  container.className = "camera";
  container.id = "camera-" + id;

  const video =
    document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;

  const fullscreen =
    document.createElement("button");

  fullscreen.textContent =
    "Full Screen";

  fullscreen.onclick = () => {
    if (video.requestFullscreen) {
      video.requestFullscreen();
    }
  };

  container.appendChild(video);
  container.appendChild(fullscreen);

  grid.appendChild(container);

  cameras.set(id, {
    container,
    video
  });

  /*
    Create the WebRTC peer connection
    here and perform the signaling exchange
    with the authorized camera.
  */
}

function removeCamera(id) {
  const camera = cameras.get(id);

  if (!camera) return;

  camera.container.remove();
  cameras.delete(id);
}
</script>

</body>
</html>
