<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Camera Viewer</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:15px;
}

#status{
  font-size:17px;
  margin:15px;
}

#buttons{
  margin:15px;
}

button{
  padding:12px 18px;
  margin:5px;
  border:0;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

button.active{
  outline:3px solid #fff;
}

#message{
  color:#aaa;
  margin:10px;
}

#videoPanel{
  position:relative;
  width:95%;
  max-width:900px;
  margin:10px auto;
  background:#000;
  border-radius:10px;
  overflow:hidden;
}

#remoteVideo{
  width:100%;
  min-height:220px;
  display:block;
  background:#000;
  object-fit:contain;
}

#fullscreenBtn{
  position:absolute;
  right:10px;
  bottom:10px;
  width:42px;
  height:42px;
  border:0;
  border-radius:7px;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:22px;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">Connecting...</div>

<div id="buttons">

  <button id="frontBtn" disabled>
    📷 Front Camera
  </button>

  <button id="backBtn" disabled>
    📷 Back Camera
  </button>

</div>

<div id="message">
  Waiting for camera...
</div>

<div id="videoPanel">

  <video
    id="remoteVideo"
    autoplay
    muted
    playsinline>
  </video>

  <button
    id="fullscreenBtn"
    type="button">
    ⛶
  </button>

</div>

<script>

const status =
  document.getElementById("status");

const messageBox =
  document.getElementById("message");

const frontBtn =
  document.getElementById("frontBtn");

const backBtn =
  document.getElementById("backBtn");

const remoteVideo =
  document.getElementById("remoteVideo");

const videoPanel =
  document.getElementById("videoPanel");


const ws = new WebSocket(

  (location.protocol === "https:"
    ? "wss:"
    : "ws:") +

  "//" +
  location.host +
  "/viewer"

);


const peers =
  new Map();

const pendingCandidates =
  new Map();


let activeCameraId =
  null;

let currentCamera =
  "front";


function send(message){

  if(
    ws.readyState ===
    WebSocket.OPEN
  ){

    ws.send(
      JSON.stringify(message)
    );

  }

}


function updateButtons(){

  frontBtn.classList.toggle(
    "active",
    currentCamera === "front"
  );

  backBtn.classList.toggle(
    "active",
    currentCamera === "back"
  );

}


function switchCamera(camera){

  if(!activeCameraId){
    return;
  }


  frontBtn.disabled =
    true;

  backBtn.disabled =
    true;


  status.textContent =
    "🟡 Switching camera...";


  messageBox.textContent =
    camera === "front"
      ? "Opening front camera..."
      : "Opening back camera...";


  send({

    type: "switch-camera",

    cameraId:
      activeCameraId,

    camera:
      camera

  });

}


frontBtn.onclick = () => {

  switchCamera("front");

};


backBtn.onclick = () => {

  switchCamera("back");

};


fullscreenBtn.onclick =
async () => {

  try{

    if(
      !document.fullscreenElement
    ){

      await videoPanel.requestFullscreen();

    }

    else{

      await document.exitFullscreen();

    }

  }

  catch(error){

    if(
      remoteVideo.webkitEnterFullscreen
    ){

      remoteVideo.webkitEnterFullscreen();

    }

  }

};


function startPeer(cameraId){

  if(
    peers.has(cameraId)
  ){

    return peers.get(cameraId);

  }


  activeCameraId =
    cameraId;


  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]

    });


  peers.set(
    cameraId,
    pc
  );


  pendingCandidates.set(
    cameraId,
    []
  );


  pc.onicecandidate =
    event => {

      if(event.candidate){

        send({

          type: "candidate",

          candidate:
            event.candidate,

          cameraId:
            cameraId

        });

      }

    };


  pc.ontrack =
    event => {

      const stream =
        event.streams[0] ||
        new MediaStream([
          event.track
        ]);


      remoteVideo.srcObject =
        stream;


      remoteVideo.play()
        .catch(() => {});


      frontBtn.disabled =
        false;

      backBtn.disabled =
        false;


      status.textContent =
        "🟢 Camera LIVE";


      updateButtons();

    };


  return pc;

}


async function handleOffer(msg){

  const pc =
    startPeer(
      msg.cameraId
    );


  await pc.setRemoteDescription(
    new RTCSessionDescription(
      msg.offer
    )
  );


  const queued =
    pendingCandidates.get(
      msg.cameraId
    ) || [];


  for(
    const candidate
    of queued
  ){

    await pc.addIceCandidate(
      new RTCIceCandidate(
        candidate
      )
    ).catch(() => {});

  }


  pendingCandidates.set(
    msg.cameraId,
    []
  );


  const answer =
    await pc.createAnswer();


  await pc.setLocalDescription(
    answer
  );


  send({

    type: "answer",

    answer:
      pc.localDescription,

    cameraId:
      msg.cameraId

  });

}


ws.onmessage =
async event => {

  const msg =
    JSON.parse(event.data);


  if(
    msg.type === "role"
  ){

    status.textContent =
      "🟡 Viewer connected";


    msg.cameras.forEach(
      cameraId => {

        activeCameraId =
          cameraId;

        startPeer(
          cameraId
        );


        send({

          type: "viewer-ready",

          cameraId:
            cameraId

        });

      }
    );


    return;

  }


  if(
    msg.type ===
    "camera-online"
  ){

    activeCameraId =
      msg.cameraId;


    startPeer(
      msg.cameraId
    );


    status.textContent =
      "🟡 Camera connected";


    return;

  }


  if(
    msg.type ===
    "camera-live"
  ){

    activeCameraId =
      msg.cameraId;


    currentCamera =
      msg.currentCamera ||
      "front";


    messageBox.textContent =
      "Connecting to camera...";


    send({

      type: "viewer-ready",

      cameraId:
        msg.cameraId

    });


    return;

  }


  if(
    msg.type ===
    "camera-switched"
  ){

    currentCamera =
      msg.currentCamera;


    frontBtn.disabled =
      false;

    backBtn.disabled =
      false;


    updateButtons();


    messageBox.textContent =
      currentCamera === "front"
        ? "Showing Front Camera"
        : "Showing Back Camera";


    status.textContent =
      "🟢 Camera LIVE";


    return;

  }


  if(
    msg.type === "offer"
  ){

    await handleOffer(msg);

    return;

  }


  if(
    msg.type ===
    "candidate"
  ){

    const pc =
      peers.get(
        msg.cameraId
      );


    if(!pc){

      return;

    }


    if(
      pc.remoteDescription
    ){

      await pc.addIceCandidate(
        new RTCIceCandidate(
          msg.candidate
        )
      ).catch(() => {});

    }

    else{

      pendingCandidates
        .get(msg.cameraId)
        .push(
          msg.candidate
        );

    }

    return;

  }


  if(
    msg.type ===
    "camera-offline"
  ){

    status.textContent =
      "🔴 Camera offline";

    remoteVideo.srcObject =
      null;

    frontBtn.disabled =
      true;

    backBtn.disabled =
      true;

  }

};


ws.onerror = () => {

  status.textContent =
    "🔴 Viewer error";

};


ws.onclose = () => {

  status.textContent =
    "🔴 Viewer disconnected";

};

</script>

</body>
  </html>
