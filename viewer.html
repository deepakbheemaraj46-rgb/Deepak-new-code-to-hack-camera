<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Camera Viewer</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:12px}
video{width:100%;background:#000;border-radius:10px}
</style>
</head>
<body>
<h1>👁️ Live Camera Viewer</h1>
<p id="status">Connecting...</p>
<div id="grid"></div>

<script>
const grid=document.getElementById("grid");
const status=document.getElementById("status");
let ws;
const peers=new Map();
const cards=new Map();

function send(m){if(ws.readyState===1)ws.send(JSON.stringify(m));}

function connect(){
 ws=new WebSocket((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host+"/viewer");

 ws.onopen=()=>status.textContent="Waiting for camera...";

 ws.onmessage=async e=>{
  const m=JSON.parse(e.data);

  if(m.type==="camera-online"||m.type==="camera-live"){
   if(!cards.has(m.cameraId)){
    const v=document.createElement("video");
    v.autoplay=true;
    v.playsInline=true;
    grid.appendChild(v);
    cards.set(m.cameraId,v);
   }
   send({type:"viewer-ready",cameraId:m.cameraId});
  }

  if(m.type==="offer"){
   const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
   peers.set(m.cameraId,pc);

   pc.ontrack=x=>{
    cards.get(m.cameraId).srcObject=x.streams[0];
    status.textContent="Camera LIVE";
   };

   pc.onicecandidate=x=>x.candidate&&send({type:"candidate",cameraId:m.cameraId,candidate:x.candidate});

   await pc.setRemoteDescription(m.offer);
   const answer=await pc.createAnswer();
   await pc.setLocalDescription(answer);
   send({type:"answer",cameraId:m.cameraId,answer:pc.localDescription});
  }

  if(m.type==="candidate"){
   const pc=peers.get(m.cameraId);
   if(pc) await pc.addIceCandidate(m.candidate);
  }
 };

 ws.onclose=()=>setTimeout(connect,1000);
}

connect();
</script>
</body>
</html>
