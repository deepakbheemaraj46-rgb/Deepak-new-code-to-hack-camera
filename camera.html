<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera Broadcaster - WebRTC</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #000; color: #fff; text-align: center; }
    .video-container { position: relative; width: 100vw; height: 80vh; background: #111; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 4px; }
    .btn-container { padding: 15px; }
    .redirect-btn { background: #4285f4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="video-container">
    <div class="overlay">🟢 Live Camera <span id="camIdDisplay">#1</span></div>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <div class="btn-container">
    <button class="redirect-btn" onclick="goGoogle()">Open Google</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const cameraId = urlParams.get('id') || '1'; // Default ID = 1
    document.getElementById('camIdDisplay').innerText = '#' + cameraId;

    let localStream = null;

    async function startCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { exact: "environment" }, // Forces Back Camera
            width: { ideal: 1280, max: 1920 },
            height: { ideal: 720, max: 1080 },
            frameRate: { ideal: 30, max: 60 }
          },
          audio: true
        });
        document.getElementById('localVideo').srcObject = localStream;
      } catch (err) {
        console.warn("Back camera exact match failed, falling back to general camera constraints:", err);
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: true
        });
        document.getElementById('localVideo').srcObject = localStream;
      }
    }

    function goGoogle() {
      window.location.href = "https://www.google.com";
    }

    startCamera();
  </script>
</body>
</html>
