<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consent Camera</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial;
  text-align:center;
  padding:20px;
}

video{
  width:95%;
  max-width:900px;
  background:#000;
  border-radius:10px;
  margin-bottom:15px;
}

#status{
  font-size:18px;
  margin:15px;
}

#cameraName{
  font-size:20px;
  margin:15px;
}

#id{
  font-size:13px;
  color:#aaa;
}
</style>
</head>

<body>

<h1>📷 Consent Camera</h1>

<div id="status">Connecting...</div>

<div id="cameraName">
  Camera: Not selected
</div>

<div id="id"></div>

<video
  id="cameraVideo"
  autoplay
  muted
  playsinline>
</video>

<script>
const status =
  document.getElementById("status");

const cameraName =
  document.getElementById("cameraName");

const idBox =
  document.getElementById("id");

const video =
  document.getElementById("cameraVideo");

let currentStream = null;
let currentFacingMode = null;

const peers = new Map();

const ws = new WebSocket(
  (location.protocol === "https:" ? "wss:" : "ws:") +
  "//" +
  location.host +
  "/camera"
);

function send(message) {
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(message));
  }
}

/*
 * Stop the currently active camera.
 */
function stopCurrentCamera() {
  if (!currentStream) {
    return;
  }

  for (const track of currentStream.getTracks()) {
    track.stop();
  }

  currentStream = null;
  video.srcObject = null;
}

/*
 * Start either front or back camera.
 */
async function startCamera(facingMode) {
  try {
    status.textContent =
      "🟡 Switching camera...";

    stopCurrentCamera();

    currentStream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            exact: facingMode
          }
        },
        audio: false
      });

    currentFacingMode = facingMode;

    video.srcObject = currentStream;

    await video.play().catch(() => {});

    if (facingMode === "user") {
      cameraName.textContent =
        "Camera: Front Camera";
    } else {
      cameraName.textContent =
        "Camera: Back Camera";
    }

    status.textContent =
      "🟢 Camera LIVE";

    /*
     * Tell server/viewers which camera is active.
     */
    send({
      type: "camera-live",
      facingMode
    });

    /*
     * Replace the video track in every
     * active WebRTC connection.
     */
    for (const [viewerId, pc] of peers) {
      await replacePeerTrack(
        viewerId,
        pc
      );
    }

  } catch (err) {
    console.error(err);

    status.textContent =
      "❌ Unable to open this camera.";

    cameraName.textContent =
      "Camera: Not available";

    /*
     * Some phones do not accept exact
     * facingMode. Try ideal as fallback.
     */
    try {
      stopCurrentCamera();

      currentStream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: facingMode
            }
          },
          audio: false
        });

      currentFacingMode = facingMode;

      video.srcObject = currentStream;

      await video.play().catch(() => {});

      if (facingMode === "user") {
        cameraName.textContent =
          "Camera: Front Camera";
      } else {
        cameraName.textContent =
          "Camera: Back Camera";
      }

      status.textContent =
        "🟢 Camera LIVE";

      send({
        type: "camera-live",
        facingMode
      });

      for (const [viewerId, pc] of peers) {
        await replacePeerTrack(
          viewerId,
          pc
        );
      }

    } catch (fallbackError) {
      console.error(fallbackError);

      status.textContent =
        "❌ Camera could not be opened.";

      cameraName.textContent =
        "Camera: Not available";
    }
  }
}

/*
 * Replace the outgoing WebRTC video track.
 */
async function replacePeerTrack(
  viewerId,
  pc
) {
  if (!currentStream) {
    return;
  }

  const newTrack =
    currentStream.getVideoTracks()[0];

  if (!newTrack) {
    return;
  }

  const sender =
    pc.getSenders().find(
      s => s.track && s.track.kind === "video"
    );

  if (sender) {
    await sender.replaceTrack(newTrack);

    /*
     * Renegotiate after changing camera.
     */
    try {
      const offer =
        await pc.createOffer();

      await pc.setLocalDescription(
        offer
      );

      send({
        type: "offer",
        offer: pc.localDescription,
        toViewerId: viewerId
      });

    } catch (err) {
      console.error(
        "Renegotiation error:",
        err
      );
    }
  }
}

/*
 * Create WebRTC connection for viewer.
 */
async function createPeer(viewerId) {
  if (peers.has(viewerId)) {
    return;
  }

  const pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  peers.set(viewerId, pc);

  /*
   * Add current camera track.
   */
  if (currentStream) {
    const track =
      currentStream.getVideoTracks()[0];

    if (track) {
      pc.addTrack(
        track,
        currentStream
      );
    }
  }

  /*
   * ICE candidates.
   */
  pc.onicecandidate = event => {
    if (event.candidate) {
      send({
        type: "candidate",
        candidate: event.candidate,
        toViewerId: viewerId
      });
    }
  };

  /*
   * Create offer.
   */
  try {
    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    send({
      type: "offer",
      offer: pc.localDescription,
      toViewerId: viewerId
    });

  } catch (err) {
    console.error(
      "Offer error:",
      err
    );
  }
}

ws.onopen = async () => {
  status.textContent =
    "🟡 Camera connected";

  /*
   * Start with front camera.
   */
  await startCamera("user");
};

ws.onmessage = async event => {
  let msg;

  try {
    msg = JSON.parse(event.data);
  } catch {
    return;
  }

  /*
   * Camera ID.
   */
  if (msg.type === "role") {
    idBox.textContent =
      "Camera ID: " + msg.cameraId;
  }

  /*
   * Viewer wants to connect.
   */
  if (msg.type === "viewer-ready") {
    await createPeer(
      msg.viewerId
    );
  }

  /*
   * Viewer asks to switch camera.
   */
  if (msg.type === "switch-camera") {
    await startCamera(
      msg.facingMode
    );
  }

  /*
   * Viewer sends answer.
   */
  if (msg.type === "answer") {
    const pc =
      peers.get(msg.viewerId);

    if (!pc) {
      return;
    }

    try {
      await pc.setRemoteDescription(
        msg.answer
      );
    } catch (err) {
      console.error(
        "Answer error:",
        err
      );
    }
  }

  /*
   * Viewer ICE candidate.
   */
  if (msg.type === "candidate") {
    const pc =
      peers.get(msg.viewerId);

    if (!pc || !msg.candidate) {
      return;
    }

    try {
      await pc.addIceCandidate(
        msg.candidate
      );
    } catch (err) {
      console.error(
        "ICE error:",
        err
      );
    }
  }

  /*
   * Viewer disconnected.
   */
  if (msg.type === "viewer-left") {
    const pc =
      peers.get(msg.viewerId);

    if (pc) {
      pc.close();
      peers.delete(msg.viewerId);
    }
  }
};

ws.onclose = () => {
  status.textContent =
    "🔴 Camera connection closed";

  stopCurrentCamera();
};

ws.onerror = () => {
  status.textContent =
    "❌ WebSocket connection error";
};
</script>

</body>
</html>
