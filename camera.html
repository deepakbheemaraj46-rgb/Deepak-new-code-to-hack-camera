<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Camera Sharing</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

.camera-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
}

.camera-panel {
  width: min(620px, 100%);
  background: #151515;
  border: 1px solid #292929;
  border-radius: 14px;
  padding: 20px;
}

.camera-panel h1 {
  margin-top: 0;
}

.notice {
  color: #bbb;
  line-height: 1.5;
}

.camera-panel video {
  display: block;
  width: 100%;
  background: #000;
  border-radius: 10px;
  margin: 15px 0;
}

.status {
  background: #222;
  padding: 11px;
  border-radius: 8px;
  color: #bbb;
}

.status.live {
  color: #42e36b;
}

.camera-id {
  background: #0d0d0d;
  padding: 12px;
  border-radius: 8px;
  margin: 12px 0;
}

button {
  width: 100%;
  border: 0;
  border-radius: 8px;
  padding: 13px 15px;
  margin-top: 8px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#start {
  background: #fff;
  color: #000;
}

.danger {
  background: #c83232;
  color: #fff;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#message {
  color: #ffadad;
  line-height: 1.4;
}

@media (max-width: 600px) {
  .camera-page {
    padding: 10px;
  }

  .camera-panel {
    padding: 16px;
  }
}
</style>

</head>

<body>

<main class="camera-page">

<section class="camera-panel">

<h1>Camera Sharing</h1>

<p class="notice">
Your camera will be shared live with the authorized
viewer while this page is open.
</p>

<video
  id="preview"
  autoplay
  muted
  playsinline>
</video>

<div id="status" class="status">
Connecting...
</div>

<div class="camera-id">
Camera ID:
<strong id="cameraId">---</strong>
</div>

<button id="start">
Allow Camera & Start Sharing
</button>

<button
  id="stop"
  class="danger"
  disabled>
Stop Sharing
</button>

<p id="message"></p>

</section>

</main>

<script>

const preview =
document.getElementById("preview");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const start =
document.getElementById("start");

const stop =
document.getElementById("stop");

const cameraIdElement =
document.getElementById("cameraId");

let socket = null;
let stream = null;

const peers = new Map();

let reconnectTimer = null;

let cameraId =
localStorage.getItem("cameraId");

if (!cameraId) {

  cameraId =
    "CAM-" +
    crypto.randomUUID()
      .slice(0, 8)
      .toUpperCase();

  localStorage.setItem(
    "cameraId",
    cameraId
  );
}

cameraIdElement.textContent =
cameraId;

function setStatus(text, live = false) {

  status.textContent = text;

  status.className =
    live
      ? "status live"
      : "status";
}

function connect() {

  if (
    socket &&
    (
      socket.readyState === WebSocket.OPEN ||
      socket.readyState === WebSocket.CONNECTING
    )
  ) {
    return;
  }

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  socket =
    new WebSocket(
      `${protocol}//${location.host}`
    );

  socket.onopen = () => {

    setStatus(
      stream
        ? "Connected"
        : "Connected — ready"
    );

    socket.send(
      JSON.stringify({
        type: "register-camera",
        cameraId
      })
    );
  };

  socket.onclose = () => {

    setStatus(
      "Connection lost — reconnecting..."
    );

    clearTimeout(
      reconnectTimer
    );

    reconnectTimer =
      setTimeout(
        connect,
        2000
      );
  };

  socket.onerror = () => {

    setStatus(
      "Connection error"
    );
  };

  socket.onmessage =
  async event => {

    const msg =
      JSON.parse(event.data);

    if (
      msg.type ===
      "camera-registered"
    ) {

      cameraId =
        msg.cameraId;

      cameraIdElement.textContent =
        cameraId;

      localStorage.setItem(
        "cameraId",
        cameraId
      );
    }

    if (
      msg.type ===
      "viewer-joined"
    ) {

      await createPeer(
        msg.viewerId
      );
    }

    if (
      msg.type === "answer"
    ) {

      const peer =
        peers.get(
          msg.viewerId
        );

      if (peer) {

        await peer.setRemoteDescription(
          msg.answer
        );
      }
    }

    if (
      msg.type === "candidate"
    ) {

      const peer =
        peers.get(
          msg.viewerId
        );

      if (
        peer &&
        msg.candidate
      ) {

        try {

          await peer.addIceCandidate(
            msg.candidate
          );

        } catch {}
      }
    }

    if (
      msg.type ===
      "live-confirmed"
    ) {

      setStatus(
        "LIVE — camera is being shared",
        true
      );
    }
  };
}

async function startCamera() {

  try {

    message.textContent = "";

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30,
              max: 30
            }
          },

          audio: false
        });

    preview.srcObject =
      stream;

    start.disabled = true;
    stop.disabled = false;

    setStatus(
      "Camera active — waiting for viewer",
      true
    );

    connect();

  } catch (error) {

    message.textContent =
      "Camera permission is required to start sharing.";

    setStatus(
      "Camera permission was denied or unavailable."
    );
  }
}

async function createPeer(viewerId) {

  if (!stream) return;

  const pc =
    new RTCPeerConnection({

      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ],

      iceCandidatePoolSize: 10
    });

  peers.set(
    viewerId,
    pc
  );

  stream
    .getTracks()
    .forEach(track => {

      pc.addTrack(
        track,
        stream
      );
    });

  pc.onicecandidate =
  event => {

    if (
      !event.candidate ||
      !socket ||
      socket.readyState !==
      WebSocket.OPEN
    ) {
      return;
    }

    socket.send(
      JSON.stringify({

        type:
          "candidate",

        cameraId,

        viewerId,

        candidate:
          event.candidate
      })
    );
  };

  pc.onconnectionstatechange =
  () => {

    if (
      pc.connectionState ===
      "connected"
    ) {

      if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
      ) {

        socket.send(
          JSON.stringify({
            type:
              "stream-live"
          })
        );
      }
    }

    if (
      pc.connectionState ===
        "failed" ||
      pc.connectionState ===
        "disconnected"
    ) {

      setTimeout(() => {

        if (
          peers.get(viewerId) === pc
        ) {

          peers.delete(
            viewerId
          );

          try {
            pc.close();
          } catch {}

        }

      }, 3000);
    }
  };

  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  socket.send(
    JSON.stringify({

      type: "offer",

      cameraId,

      viewerId,

      offer:
        pc.localDescription
    })
  );
}

function stopCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

    stream = null;
  }

  preview.srcObject =
    null;

  for (
    const peer
    of peers.values()
  ) {

    try {
      peer.close();
    } catch {}
  }

  peers.clear();

  start.disabled = false;
  stop.disabled = true;

  setStatus(
    "Camera sharing stopped."
  );
}

start.addEventListener(
  "click",
  startCamera
);

stop.addEventListener(
  "click",
  stopCamera
);

connect();

</script>

</body>
</html>
