<!doctype html>
<html>
<head>

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Consent Camera</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}

h1{
  font-size:25px;
}

video{
  width:95%;
  max-width:900px;
  background:#000;
  border-radius:10px;
  margin-top:15px;
}

#status{
  font-size:18px;
  margin:15px;
}

#cameraName{
  font-size:20px;
  margin:10px;
}

#id{
  font-size:13px;
  color:#aaa;
  margin:10px;
}

#error{
  color:#ff7777;
  font-size:14px;
  margin:10px;
}
</style>

</head>

<body>

<h1>📷 Consent Camera</h1>

<div id="status">
Connecting...
</div>

<div id="cameraName">
Camera: Starting...
</div>

<div id="id"></div>

<div id="error"></div>

<video
  id="localVideo"
  autoplay
  muted
  playsinline>
</video>

<script>

const status =
  document.getElementById("status");

const cameraName =
  document.getElementById("cameraName");

const idBox =
  document.getElementById("id");

const errorBox =
  document.getElementById("error");

const localVideo =
  document.getElementById("localVideo");

let currentStream = null;

let currentFacingMode = "user";

let recovering = false;

const peers = new Map();


// =====================================================
// WEBSOCKET
// =====================================================

const ws = new WebSocket(
  (location.protocol === "https:"
    ? "wss:"
    : "ws:") +
  "//" +
  location.host +
  "/camera"
);

function send(data) {
  if (
    ws.readyState ===
    WebSocket.OPEN
  ) {
    ws.send(JSON.stringify(data));
  }
}


// =====================================================
// STOP CAMERA
// =====================================================

function stopCurrentCamera() {

  if (!currentStream) return;

  for (
    const track
    of currentStream.getTracks()
  ) {
    track.stop();
  }

  currentStream = null;

  localVideo.srcObject = null;
}


// =====================================================
// CAMERA HEALTH
// =====================================================

function cameraIsHealthy() {

  if (!currentStream) {
    return false;
  }

  const tracks =
    currentStream.getVideoTracks();

  if (!tracks.length) {
    return false;
  }

  const track = tracks[0];

  return (
    track.readyState === "live" &&
    track.enabled
  );
}


// =====================================================
// MONITOR CAMERA TRACK
// =====================================================

function monitorCameraTrack(stream) {

  const track =
    stream.getVideoTracks()[0];

  if (!track) return;

  track.onended = () => {

    console.log(
      "Camera track ended"
    );

    restartCamera();
  };

  track.onmute = () => {

    console.log(
      "Camera track muted"
    );
  };

  track.onunmute = () => {

    console.log(
      "Camera track resumed"
    );
  };
}


// =====================================================
// AUTOMATIC CAMERA RESTART
// =====================================================

async function restartCamera() {

  if (recovering) return;

  recovering = true;

  console.log(
    "Attempting automatic camera recovery..."
  );

  status.textContent =
    "🟡 Camera issue detected — restarting...";

  try {

    stopCurrentCamera();

    await new Promise(
      resolve =>
        setTimeout(resolve, 1000)
    );

    await openCamera(
      currentFacingMode
    );

  } catch (err) {

    console.error(
      "Recovery failed:",
      err
    );

    status.textContent =
      "🟠 Camera recovery failed — retrying...";

  }

  recovering = false;
}


// =====================================================
// OPEN CAMERA
// =====================================================

async function openCamera(
  facingMode
) {

  errorBox.textContent = "";

  status.textContent =
    "🟡 Opening camera...";

  try {

    stopCurrentCamera();

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: facingMode
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false
      });

    currentStream = stream;

    currentFacingMode =
      facingMode;

    monitorCameraTrack(
      currentStream
    );

    localVideo.srcObject =
      currentStream;

    await localVideo
      .play()
      .catch(() => {});


    if (
      facingMode === "user"
    ) {

      cameraName.textContent =
        "Camera: Front Camera";

    } else {

      cameraName.textContent =
        "Camera: Back Camera";

    }


    status.textContent =
      "🟢 Camera LIVE";


    send({
      type: "camera-live",
      facingMode
    });


    // Replace the existing track
    // for connected viewers.
    const newTrack =
      currentStream
        .getVideoTracks()[0];

    for (
      const [viewerId, pc]
      of peers
    ) {

      const sender =
        pc.getSenders().find(
          s =>
            s.track &&
            s.track.kind === "video"
        );

      if (
        sender &&
        newTrack
      ) {

        try {

          await sender
            .replaceTrack(
              newTrack
            );

        } catch (err) {

          console.error(
            "replaceTrack failed:",
            err
          );

        }
      }
    }

  } catch (err) {

    console.error(
      "Camera error:",
      err
    );

    status.textContent =
      "❌ Camera could not be opened";

    cameraName.textContent =
      "Camera: Unavailable";

    errorBox.textContent =
      err.name +
      ": " +
      err.message;
  }
}


// =====================================================
// CREATE WEBRTC PEER
// =====================================================

async function createPeer(
  viewerId
) {

  if (
    peers.has(viewerId)
  ) {
    return;
  }

  const pc =
    new RTCPeerConnection({

      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });


  peers.set(
    viewerId,
    pc
  );


  // Add current camera
  if (currentStream) {

    const track =
      currentStream
        .getVideoTracks()[0];

    if (track) {

      pc.addTrack(
        track,
        currentStream
      );
    }
  }


  // ICE candidates
  pc.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        send({
          type: "candidate",
          candidate:
            event.candidate,
          toViewerId:
            viewerId
        });
      }
    };


  pc.onconnectionstatechange =
    () => {

      console.log(
        "Peer:",
        viewerId,
        pc.connectionState
      );

    };


  try {

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    send({
      type: "offer",
      offer:
        pc.localDescription,
      toViewerId:
        viewerId
    });

  } catch (err) {

    console.error(
      "Offer error:",
      err
    );
  }
}


// =====================================================
// WEBSOCKET OPEN
// =====================================================

ws.onopen = async () => {

  status.textContent =
    "🟡 Camera connected";

  await openCamera("user");
};


// =====================================================
// WEBSOCKET MESSAGE
// =====================================================

ws.onmessage =
  async event => {

    let msg;

    try {

      msg =
        JSON.parse(
          event.data
        );

    } catch {

      return;
    }


    // Camera ID
    if (
      msg.type === "role"
    ) {

      idBox.textContent =
        "Camera ID: " +
        msg.cameraId;

      return;
    }


    // Viewer ready
    if (
      msg.type ===
      "viewer-ready"
    ) {

      await createPeer(
        msg.viewerId
      );

      return;
    }


    // Viewer requested
    // front/back
    if (
      msg.type ===
      "switch-camera"
    ) {

      await openCamera(
        msg.facingMode
      );

      return;
    }


    // Answer
    if (
      msg.type === "answer"
    ) {

      const pc =
        peers.get(
          msg.viewerId
        );

      if (!pc) return;

      try {

        await pc.setRemoteDescription(
          msg.answer
        );

      } catch (err) {

        console.error(
          "Answer error:",
          err
        );
      }

      return;
    }


    // ICE
    if (
      msg.type === "candidate"
    ) {

      const pc =
        peers.get(
          msg.viewerId
        );

      if (
        !pc ||
        !msg.candidate
      ) {
        return;
      }

      try {

        await pc.addIceCandidate(
          msg.candidate
        );

      } catch (err) {

        console.error(
          "ICE error:",
          err
        );
      }

      return;
    }


    // Viewer left
    if (
      msg.type ===
      "viewer-left"
    ) {

      const pc =
        peers.get(
          msg.viewerId
        );

      if (pc) {

        pc.close();

        peers.delete(
          msg.viewerId
        );
      }
    }
  };


// =====================================================
// PERIODIC HEALTH CHECK
// =====================================================

setInterval(
  async () => {

    if (
      currentStream &&
      !cameraIsHealthy()
    ) {

      await restartCamera();
    }

  },
  5000
);


// =====================================================
// WEBSOCKET EVENTS
// =====================================================

ws.onclose = () => {

  status.textContent =
    "🔴 Camera connection closed";

  stopCurrentCamera();
};

ws.onerror = err => {

  console.error(
    "WebSocket error:",
    err
  );

  status.textContent =
    "❌ WebSocket error";
};

</script>

</body>
</html>
