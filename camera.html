<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
}

h2{
  margin:20px;
}

#video{
  width:100%;
  max-width:1000px;
  display:block;
  margin:auto;
  background:#000;
}

button{
  padding:12px 25px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin:10px;
}

#status{
  margin:15px;
}
</style>
</head>

<body>

<h2>Camera</h2>

<button id="allow">
Allow Camera
</button>

<div id="status">
Camera not started
</div>

<video
  id="video"
  autoplay
  playsinline
  muted>
</video>

<script>

const video =
  document.getElementById("video");

const statusBox =
  document.getElementById("status");

const allowBtn =
  document.getElementById("allow");

const cameraId =
  crypto.randomUUID();

let stream = null;
let ws = null;

const peers =
  new Map();

allowBtn.onclick =
async () => {

  try {

    if (!stream) {

      stream =
      await navigator.mediaDevices
      .getUserMedia({

        video: true,

        audio: false

      });

      video.srcObject =
        stream;

      await video.play();

    }

    connect();

  } catch(error) {

    console.error(error);

    statusBox.textContent =
      "Camera permission denied";

  }

};

function connect() {

  if (
    ws &&
    (
      ws.readyState === WebSocket.OPEN ||
      ws.readyState === WebSocket.CONNECTING
    )
  ) {
    return;
  }

  statusBox.textContent =
    "Connecting...";

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  ws =
    new WebSocket(
      protocol +
      "//" +
      location.host
    );

  ws.onopen = () => {

    statusBox.textContent =
      "Connected";

    ws.send(JSON.stringify({

      type:
        "register-camera",

      cameraId

    }));

  };

  ws.onmessage =
  async event => {

    const msg =
      JSON.parse(
        event.data
      );

    if (
      msg.type ===
      "viewer-request"
    ) {

      await createPeer(
        msg.viewerId
      );

    }

    if (
      msg.type ===
      "answer"
    ) {

      const peer =
        peers.get(
          msg.viewerId
        );

      if (!peer)
        return;

      await peer.setRemoteDescription({

        type: "answer",

        sdp: msg.sdp

      });

    }

    if (
      msg.type ===
      "viewer-ice"
    ) {

      const peer =
        peers.get(
          msg.viewerId
        );

      if (!peer)
        return;

      try {

        await peer.addIceCandidate(
          new RTCIceCandidate(
            msg.candidate
          )
        );

      } catch(err) {

        console.error(err);

      }

    }

  };

  ws.onclose = () => {

    statusBox.textContent =
      "Disconnected. Reconnecting...";

    setTimeout(
      reconnect,
      2000
    );

  };

  ws.onerror =
    console.error;

}

async function createPeer(
  viewerId
) {

  const peer =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
          "stun:stun.l.google.com:19302"
        },

        {
          urls: [

          "turn:openrelay.metered.ca:80",

          "turn:openrelay.metered.ca:443",

          "turn:openrelay.metered.ca:443?transport=tcp"

          ],

          username:
          "openrelayproject",

          credential:
          "openrelayproject"

        }

      ]

    });

  peers.set(
    viewerId,
    peer
  );

  stream.getTracks()
  .forEach(track => {

    peer.addTrack(
      track,
      stream
    );

  });

  peer.onicecandidate =
  event => {

    if (!event.candidate)
      return;

    ws.send(JSON.stringify({

      type:
        "camera-ice",

      cameraId,

      viewerId,

      candidate:
        event.candidate

    }));

  };

  peer.onconnectionstatechange =
  () => {

    console.log(
      "Peer:",
      peer.connectionState
    );

  };

  const offer =
    await peer.createOffer();

  await peer.setLocalDescription(
    offer
  );

  ws.send(JSON.stringify({

    type:
      "offer",

    cameraId,

    viewerId,

    sdp:
      peer.localDescription.sdp

  }));

}

function reconnect() {

  peers.forEach(peer => {

    try {

      peer.close();

    } catch {}

  });

  peers.clear();

  connect();

}

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      reconnect();

    }

  }
);

window.addEventListener(
  "online",
  reconnect
);

</script>

</body>
</html>
