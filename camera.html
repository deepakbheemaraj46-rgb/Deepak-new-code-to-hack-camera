<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Sender</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center;padding:20px}
button{padding:15px 25px;border:none;border-radius:10px;font-size:18px}
</style>
</head>
<body>
<h1>Share Your Camera</h1>
<p>This demo shares your camera only after you tap Start.</p>
<button id="start">Start Camera</button>
<p id="status">Waiting...</p>

<script>
const status=document.getElementById("status");
const ws=new WebSocket((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host+"/camera");
let stream;
const peers=new Map();

function send(m){if(ws.readyState===1)ws.send(JSON.stringify(m));}

document.getElementById("start").onclick=async()=>{
  stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
  status.textContent="Camera LIVE";
  send({type:"camera-live"});
};

ws.onmessage=async e=>{
  const m=JSON.parse(e.data);
  if(m.type==="viewer-ready"){
    const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
    peers.set(m.viewerId,pc);
    stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    pc.onicecandidate=x=>x.candidate&&send({type:"candidate",candidate:x.candidate,toViewerId:m.viewerId});
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    send({type:"offer",offer:pc.localDescription,toViewerId:m.viewerId});
  }
  if(m.type==="answer"){
    const pc=peers.get(m.toViewerId||m.viewerId);
    if(pc) await pc.setRemoteDescription(m.answer);
  }
  if(m.type==="candidate"){
    const pc=peers.get(m.toViewerId||m.viewerId);
    if(pc) await pc.addIceCandidate(m.candidate);
  }
};
</script>
</body>
</html>
