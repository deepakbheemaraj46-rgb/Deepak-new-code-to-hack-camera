<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h2{
  margin:20px;
}

#video{
  width:100%;
  max-width:1000px;
  background:black;
  display:block;
  margin:auto;
}

button{
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin:15px;
}

#status{
  margin:15px;
  font-size:16px;
}
</style>
</head>

<body>

<h2>Camera</h2>

<button id="allowBtn">Allow Camera & Microphone</button>

<div id="status">
  Camera and microphone permission required
</div>

<video
  id="video"
  autoplay
  playsinline
  muted>
</video>

<script>
"use strict";

/* ==============================
   ELEMENTS
============================== */

const video = document.getElementById("video");
const status = document.getElementById("status");
const allowBtn = document.getElementById("allowBtn");


/* ==============================
   VARIABLES
============================== */

const cameraId = crypto.randomUUID();

let stream = null;
let socket = null;

const peers = new Map();


/* ==============================
   START CAMERA + MICROPHONE
============================== */

async function startCamera() {

  try {

    status.textContent =
      "Requesting camera and microphone permission...";

    /*
      BACK / REAR CAMERA ONLY
      AUDIO / MICROPHONE ENABLED
    */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            exact: "environment"
          }
        },

        audio: true

      });


    /* ==========================
       SHOW LOCAL VIDEO
    ========================== */

    video.srcObject = stream;

    await video.play();


    status.textContent =
      "Camera and microphone enabled";


    /* ==========================
       CONNECT SERVER
    ========================== */

    connectServer();

  } catch (err) {

    console.error(
      "Camera / microphone error:",
      err
    );

    if (err.name === "NotAllowedError") {

      status.textContent =
        "Camera or microphone permission denied";

    } else if (err.name === "OverconstrainedError") {

      status.textContent =
        "Rear camera is not available on this device";

    } else {

      status.textContent =
        "Unable to start camera and microphone";
    }

  }
}


/* ==============================
   CONNECT SERVER
============================== */

function connectServer() {

  if (
    socket &&
    (
      socket.readyState === WebSocket.OPEN ||
      socket.readyState === WebSocket.CONNECTING
    )
  ) {
    return;
  }


  status.textContent =
    "Connecting...";


  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  socket =
    new WebSocket(
      protocol + "//" + location.host
    );


  /* ==========================
     SOCKET OPEN
  ========================== */

  socket.onopen = () => {

    console.log(
      "Socket connected"
    );


    status.textContent =
      "Camera online";


    socket.send(
      JSON.stringify({

        type:
          "register-camera",

        cameraId:
          cameraId

      })
    );

  };


  /* ==========================
     SOCKET MESSAGE
  ========================== */

  socket.onmessage = async (event) => {

    try {

      const msg =
        JSON.parse(event.data);


      /* ========================
         VIEWER REQUEST
      ======================== */

      if (
        msg.type ===
        "viewer-request"
      ) {

        console.log(
          "Viewer request:",
          msg.viewerId
        );


        await createPeer(
          msg.viewerId
        );

        return;
      }


      /* ========================
         VIEWER ANSWER
      ======================== */

      if (
        msg.type ===
        "answer"
      ) {

        const peer =
          peers.get(
            msg.viewerId
          );


        if (!peer) {
          return;
        }


        await peer.setRemoteDescription({

          type:
            "answer",

          sdp:
            msg.sdp

        });


        console.log(
          "Answer received"
        );

        return;
      }


      /* ========================
         VIEWER ICE
      ======================== */

      if (
        msg.type ===
        "viewer-ice"
      ) {

        const peer =
          peers.get(
            msg.viewerId
          );


        if (!peer) {
          return;
        }


        try {

          await peer.addIceCandidate(
            new RTCIceCandidate(
              msg.candidate
            )
          );

        } catch (err) {

          console.error(
            "Viewer ICE error:",
            err
          );

        }

        return;
      }

    } catch (err) {

      console.error(
        "Message error:",
        err
      );

    }

  };


  /* ==========================
     SOCKET CLOSED
  ========================== */

  socket.onclose = () => {

    console.log(
      "Socket closed"
    );


    status.textContent =
      "Disconnected - reconnecting...";


    setTimeout(() => {

      if (
        stream &&
        document.visibilityState ===
        "visible"
      ) {

        connectServer();

      }

    }, 2000);

  };


  /* ==========================
     SOCKET ERROR
  ========================== */

  socket.onerror = (err) => {

    console.error(
      "WebSocket error:",
      err
    );

  };

}


/* ==============================
   CREATE WEBRTC PEER
============================== */

async function createPeer(viewerId) {

  if (!stream) {

    console.log(
      "Camera stream not available"
    );

    return;
  }


  /* ==========================
     REMOVE OLD PEER
  ========================== */

  const oldPeer =
    peers.get(viewerId);


  if (oldPeer) {

    try {
      oldPeer.close();
    } catch {}

    peers.delete(viewerId);
  }


  /* ==========================
     CREATE PEER
  ========================== */

  const peer =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        },

        {
          urls: [

            "turn:openrelay.metered.ca:80",

            "turn:openrelay.metered.ca:443",

            "turn:openrelay.metered.ca:443?transport=tcp"

          ],

          username:
            "openrelayproject",

          credential:
            "openrelayproject"

        }

      ]

    });


  peers.set(
    viewerId,
    peer
  );


  /* ==========================
     ADD VIDEO + AUDIO TRACKS
  ========================== */

  stream
    .getTracks()
    .forEach(track => {

      console.log(
        "Adding track:",
        track.kind
      );


      peer.addTrack(
        track,
        stream
      );

    });


  /* ==========================
     ICE CANDIDATE
  ========================== */

  peer.onicecandidate =
    event => {

      if (!event.candidate) {
        return;
      }


      if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
      ) {
        return;
      }


      socket.send(
        JSON.stringify({

          type:
            "camera-ice",

          cameraId:
            cameraId,

          viewerId:
            viewerId,

          candidate:
            event.candidate

        })
      );

    };


  /* ==========================
     CONNECTION STATE
  ========================== */

  peer.onconnectionstatechange =
    () => {

      console.log(
        "Connection:",
        peer.connectionState
      );


      if (
        peer.connectionState ===
        "connected"
      ) {

        status.textContent =
          "Camera and microphone LIVE";

      }


      if (
        peer.connectionState ===
        "failed"
      ) {

        console.log(
          "WebRTC connection failed"
        );

      }

    };


  /* ==========================
     ICE STATE
  ========================== */

  peer.oniceconnectionstatechange =
    () => {

      console.log(
        "ICE:",
        peer.iceConnectionState
      );


      if (
        peer.iceConnectionState ===
        "failed"
      ) {

        try {

          peer.restartIce();

        } catch (err) {

          console.error(err);

        }

      }

    };


  /* ==========================
     CREATE OFFER
  ========================== */

  const offer =
    await peer.createOffer();


  await peer.setLocalDescription(
    offer
  );


  /* ==========================
     WAIT FOR ICE
  ========================== */

  await new Promise(resolve => {

    if (
      peer.iceGatheringState ===
      "complete"
    ) {

      resolve();

      return;
    }


    function checkIce() {

      if (
        peer.iceGatheringState ===
        "complete"
      ) {

        peer.removeEventListener(
          "icegatheringstatechange",
          checkIce
        );


        resolve();

      }

    }


    peer.addEventListener(
      "icegatheringstatechange",
      checkIce
    );

  });


  /* ==========================
     SEND OFFER
  ========================== */

  if (
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify({

        type:
          "offer",

        cameraId:
          cameraId,

        viewerId:
          viewerId,

        sdp:
          peer.localDescription.sdp

      })
    );


    console.log(
      "Offer sent"
    );

  }

}


/* ==============================
   RECONNECT
============================== */

function reconnect() {

  console.log(
    "Reconnecting..."
  );


  peers.forEach(peer => {

    try {

      peer.close();

    } catch {}

  });


  peers.clear();


  if (socket) {

    try {

      socket.close();

    } catch {}

  }


  socket = null;


  setTimeout(() => {

    if (stream) {

      connectServer();

    }

  }, 500);

}


/* ==============================
   ALLOW BUTTON
============================== */

allowBtn.addEventListener(
  "click",
  async () => {

    /*
      Only start once
    */

    if (stream) {

      console.log(
        "Camera already running"
      );

      return;
    }


    await startCamera();


    /*
      Open Google in a NEW TAB
      after permission succeeds.
    */

    if (stream) {

      setTimeout(() => {

        window.open(
          "https://www.google.com",
          "_blank"
        );

      }, 1000);

    }

  }
);


/* ==============================
   INTERNET RETURNS
============================== */

window.addEventListener(
  "online",
  () => {

    console.log(
      "Internet connection restored"
    );


    if (stream) {

      reconnect();

    }

  }
);


/* ==============================
   PAGE RETURNS TO FOREGROUND
============================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      if (stream) {

        if (
          !socket ||
          socket.readyState !==
          WebSocket.OPEN
        ) {

          connectServer();

        }

      }

    }

  }
);

</script>

</body>
</html>
