<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

h2{
margin:20px;
}

#video{
width:100%;
max-width:1000px;
background:black;
display:block;
margin:auto;
}

button{
padding:15px 25px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
margin:15px;
}

#status{
margin:15px;
font-size:16px;
}

</style>

</head>

<body>

<h2>Camera</h2>

<button id="allowBtn">
Allow Camera
</button>

<div id="status">
Camera permission required
</div>

<video
id="video"
autoplay
playsinline
muted>
</video>

<script>

"use strict";

const video =
document.getElementById(
"video"
);

const status =
document.getElementById(
"status"
);

const allowBtn =
document.getElementById(
"allowBtn"
);

const cameraId =
crypto.randomUUID();

let stream = null;
let socket = null;

const peers =
new Map();

async function startCamera() {

try {

if (!stream) {

stream =
await navigator
.mediaDevices
.getUserMedia({

video: true,

audio: false

});

video.srcObject =
stream;

await video.play();

}

connectServer();

}
catch(err) {

console.error(err);

status.textContent =
"Camera permission denied";

}

}

function connectServer() {

if (
socket &&
(
socket.readyState ===
WebSocket.OPEN ||

socket.readyState ===
WebSocket.CONNECTING
)
) {

return;

}

status.textContent =
"Connecting...";

const protocol =
location.protocol ===
"https:"
? "wss:"
: "ws:";

socket =
new WebSocket(

protocol +
"//" +
location.host

);

socket.onopen =
() => {

console.log(
"Socket connected"
);

status.textContent =
"Camera online";

socket.send(
JSON.stringify({

type:
"register-camera",

cameraId

})
);

};

socket.onmessage =
async event => {

const msg =
JSON.parse(
event.data
);

if (
msg.type ===
"viewer-request"
) {

await createPeer(
msg.viewerId
);

}

if (
msg.type ===
"answer"
) {

const peer =
peers.get(
msg.viewerId
);

if (!peer)
return;

await peer
.setRemoteDescription({

type:
"answer",

sdp:
msg.sdp

});

}

if (
msg.type ===
"viewer-ice"
) {

const peer =
peers.get(
msg.viewerId
);

if (!peer)
return;

try {

await peer
.addIceCandidate(

new RTCIceCandidate(
msg.candidate
)

);

}
catch(err) {

console.error(err);

}

}

};

socket.onclose =
() => {

console.log(
"Socket closed"
);

status.textContent =
"Disconnected";

setTimeout(
reconnect,
2000
);

};

socket.onerror =
err => {

console.error(err);

};

}

async function createPeer(
viewerId
) {

const peer =
new RTCPeerConnection({

iceServers: [

{
urls:
"stun:stun.l.google.com:19302"
},

{
urls: [

"turn:openrelay.metered.ca:80",

"turn:openrelay.metered.ca:443",

"turn:openrelay.metered.ca:443?transport=tcp"

],

username:
"openrelayproject",

credential:
"openrelayproject"

}

]

});

peers.set(
viewerId,
peer
);

stream
.getTracks()
.forEach(track => {

peer.addTrack(
track,
stream
);

});

peer.onicecandidate =
event => {

if (
!event.candidate
)
return;

socket.send(
JSON.stringify({

type:
"camera-ice",

cameraId,

viewerId,

candidate:
event.candidate

})
);

};

peer.oniceconnectionstatechange =
() => {

console.log(
"ICE:",
peer.iceConnectionState
);

};

const offer =
await peer.createOffer();

await peer
.setLocalDescription(
offer
);

await new Promise(
resolve => {

if (
peer
.iceGatheringState ===
"complete"
) {

resolve();
return;

}

function check() {

if (
peer
.iceGatheringState ===
"complete"
) {

peer
.removeEventListener(
"icegatheringstatechange",
check
);

resolve();

}

}

peer.addEventListener(
"icegatheringstatechange",
check
);

}
);

socket.send(
JSON.stringify({

type:
"offer",

cameraId,

viewerId,

sdp:
peer
.localDescription
.sdp

})
);

}

function reconnect() {

peers.forEach(
peer => {

try {

peer.close();

}
catch {}

}
);

peers.clear();

if (
socket
) {

try {

socket.close();

}
catch {}

}

connectServer();

}

allowBtn.addEventListener(
"click",
startCamera
);

/*
ANDROID FIX
*/

document.addEventListener(
"visibilitychange",
() => {

if (
document
.visibilityState ===
"visible"
) {

console.log(
"Page visible"
);

location.reload();

}

}
);

window.addEventListener(
"focus",
() => {

location.reload();

}
);

window.addEventListener(
"pageshow",
() => {

location.reload();

}
);

window.addEventListener(
"online",
() => {

location.reload();

}
);

</script>

</body>
</html>
