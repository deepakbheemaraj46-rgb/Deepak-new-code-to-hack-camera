<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Camera A</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 15px;
    }

    h1 {
      margin: 8px 0;
    }

    #status {
      margin: 12px auto;
      padding: 12px;
      border-radius: 8px;
      background: #222;
      max-width: 700px;
    }

    .online {
      color: #00ff66;
    }

    .warning {
      color: #ffd000;
    }

    .error {
      color: #ff5555;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    #startBtn {
      background: #00aaff;
      color: white;
    }

    #stopBtn {
      background: #d33;
      color: white;
    }

    .cameras {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 1100px;
      margin: 20px auto;
    }

    .cameraBox {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      min-height: 240px;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      min-height: 240px;
      object-fit: cover;
      background: #000;
    }

    .label {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      background: rgba(0,0,0,.7);
      padding: 7px 10px;
      border-radius: 7px;
      font-weight: bold;
    }

    .fullscreen {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 5;
      background: rgba(0,0,0,.75);
      color: white;
      padding: 9px 12px;
      border-radius: 7px;
    }

    @media (max-width: 700px) {
      .cameras {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>Camera A</h1>

  <div id="status">
    Camera permission is required.
  </div>

  <button id="startBtn">
    Allow Camera & Start
  </button>

  <button id="stopBtn">
    Stop Cameras
  </button>

  <div class="cameras">

    <div class="cameraBox">
      <div class="label">📷 Front Camera</div>

      <video
        id="frontVideo"
        autoplay
        muted
        playsinline>
      </video>

      <button
        class="fullscreen"
        onclick="fullscreenVideo('frontVideo')">
        ⛶ Full Screen
      </button>
    </div>

    <div class="cameraBox">
      <div class="label">📷 Back Camera</div>

      <video
        id="backVideo"
        autoplay
        muted
        playsinline>
      </video>

      <button
        class="fullscreen"
        onclick="fullscreenVideo('backVideo')">
        ⛶ Full Screen
      </button>
    </div>

  </div>

<script>
const statusBox = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

const frontVideo = document.getElementById("frontVideo");
const backVideo = document.getElementById("backVideo");

let frontStream = null;
let backStream = null;

let frontPC = null;
let backPC = null;

let viewerConnected = false;

const wsProtocol =
  location.protocol === "https:" ? "wss:" : "ws:";

const ws = new WebSocket(
  wsProtocol + "//" + location.host
);

function setStatus(text, className = "") {
  statusBox.textContent = text;
  statusBox.className = className;
}

ws.onopen = () => {
  ws.send(JSON.stringify({
    type: "register",
    role: "camera"
  }));

  setStatus(
    "Camera A connected. Waiting for Viewer...",
    "warning"
  );
};

ws.onclose = () => {
  setStatus(
    "Server connection lost.",
    "error"
  );
};

ws.onmessage = async (event) => {
  let msg;

  try {
    msg = JSON.parse(event.data);
  } catch {
    return;
  }

  if (msg.type === "viewer-online") {
    viewerConnected = true;

    setStatus(
      "Viewer connected. Start your cameras.",
      "online"
    );

    if (frontStream || backStream) {
      await createOffers();
    }
  }

  if (msg.type === "viewer-offline") {
    viewerConnected = false;

    if (frontPC) {
      frontPC.close();
      frontPC = null;
    }

    if (backPC) {
      backPC.close();
      backPC = null;
    }

    setStatus(
      "Viewer disconnected.",
      "warning"
    );
  }

  if (msg.type === "answer") {
    if (msg.camera === "front" && frontPC) {
      await frontPC.setRemoteDescription(
        new RTCSessionDescription(msg.answer)
      );
    }

    if (msg.camera === "back" && backPC) {
      await backPC.setRemoteDescription(
        new RTCSessionDescription(msg.answer)
      );
    }
  }

  if (msg.type === "candidate") {
    try {
      if (msg.camera === "front" && frontPC) {
        await frontPC.addIceCandidate(msg.candidate);
      }

      if (msg.camera === "back" && backPC) {
        await backPC.addIceCandidate(msg.candidate);
      }
    } catch (e) {
      console.log("ICE error:", e);
    }
  }
};

async function startCameras() {
  stopCameras();

  setStatus(
    "Requesting camera permission...",
    "warning"
  );

  try {
    frontStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "user"
        }
      },
      audio: false
    });

    frontVideo.srcObject = frontStream;

  } catch (error) {
    console.error(error);

    setStatus(
      "Front camera permission was denied or unavailable.",
      "error"
    );
  }

  try {
    backStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "environment"
        }
      },
      audio: false
    });

    backVideo.srcObject = backStream;

  } catch (error) {
    console.error(error);

    setStatus(
      "Front camera is available, but this device/browser could not open the back camera at the same time.",
      "warning"
    );
  }

  if (!frontStream && !backStream) {
    setStatus(
      "No camera was started. Please allow camera permission.",
      "error"
    );

    return;
  }

  if (viewerConnected) {
    await createOffers();
  } else {
    setStatus(
      "Camera permission granted. Waiting for Viewer...",
      "online"
    );
  }
}

async function createPeer(stream, cameraName) {
  const pc = new RTCPeerConnection({
    iceServers: [
      {
        urls: "stun:stun.l.google.com:19302"
      }
    ]
  });

  stream.getTracks().forEach(track => {
    pc.addTrack(track, stream);
  });

  pc.onicecandidate = event => {
    if (event.candidate) {
      ws.send(JSON.stringify({
        type: "candidate",
        camera: cameraName,
        candidate: event.candidate
      }));
    }
  };

  return pc;
}

async function createOffers() {

  if (!viewerConnected) {
    return;
  }

  if (frontStream) {
    if (frontPC) {
      frontPC.close();
    }

    frontPC = await createPeer(
      frontStream,
      "front"
    );

    const offer = await frontPC.createOffer();

    await frontPC.setLocalDescription(offer);

    ws.send(JSON.stringify({
      type: "offer",
      camera: "front",
      offer: offer
    }));
  }

  if (backStream) {
    if (backPC) {
      backPC.close();
    }

    backPC = await createPeer(
      backStream,
      "back"
    );

    const offer = await backPC.createOffer();

    await backPC.setLocalDescription(offer);

    ws.send(JSON.stringify({
      type: "offer",
      camera: "back",
      offer: offer
    }));
  }
}

function stopCameras() {

  if (frontPC) {
    frontPC.close();
    frontPC = null;
  }

  if (backPC) {
    backPC.close();
    backPC = null;
  }

  if (frontStream) {
    frontStream.getTracks().forEach(
      track => track.stop()
    );

    frontStream = null;
  }

  if (backStream) {
    backStream.getTracks().forEach(
      track => track.stop()
    );

    backStream = null;
  }

  frontVideo.srcObject = null;
  backVideo.srcObject = null;
}

async function fullscreenVideo(id) {
  const video = document.getElementById(id);

  try {
    if (video.requestFullscreen) {
      await video.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }
  } catch (error) {
    console.log(error);
  }
}

startBtn.onclick = startCameras;
stopBtn.onclick = stopCameras;
</script>

</body>
</html>
