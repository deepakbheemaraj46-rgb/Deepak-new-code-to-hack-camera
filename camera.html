<!DOCTYPE html><html><body><h2>Camera</h2><button id="allow">Allow Camera</button><video id="video" autoplay playsinline muted style="width:100%"></video><script>const v=document.getElementById('video');let s,ws;const cameraId=crypto.randomUUID();const peers=new Map();document.getElementById('allow').onclick=async()=>{s=await navigator.mediaDevices.getUserMedia({video:true,audio:false});v.srcObject=s;connect();};function connect(){ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:'register-camera',cameraId}));ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='viewer-request'){const p=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443'],username:'openrelayproject',credential:'openrelayproject'}]});peers.set(m.viewerId,p);s.getTracks().forEach(t=>p.addTrack(t,s));p.onicecandidate=x=>x.candidate&&ws.send(JSON.stringify({type:'camera-ice',cameraId,viewerId:m.viewerId,candidate:x.candidate}));const off=await p.createOffer();await p.setLocalDescription(off);ws.send(JSON.stringify({type:'offer',cameraId,viewerId:m.viewerId,sdp:p.localDescription.sdp}));} if(m.type==='answer'){const p=peers.get(m.viewerId);if(p) await p.setRemoteDescription({type:'answer',sdp:m.sdp});} if(m.type==='viewer-ice'){const p=peers.get(m.viewerId);if(p) await p.addIceCandidate(m.candidate);}}}</script></body></html>
