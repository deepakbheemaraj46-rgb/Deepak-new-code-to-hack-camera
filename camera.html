<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Camera</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #video {
      width: 100%;
      max-height: 80vh;
      background: black;
      object-fit: contain;
    }

    #start {
      margin-top: 30px;
      padding: 15px 25px;
      font-size: 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    #status {
      margin: 20px;
    }
  </style>
</head>

<body>

<h2>Camera</h2>

<button id="start">Allow Camera</button>

<div id="status">
  Camera permission is required.
</div>

<video
  id="video"
  autoplay
  playsinline
  muted>
</video>

<button id="googleBtn">
  Visit Google
</button>

<script>
const googleBtn = document.getElementById("googleBtn");

googleBtn.addEventListener("click", () => {
  window.open("https://www.google.com/", "_blank");
});
</script>
<script>
"use strict";

const startButton = document.getElementById("start");
const video = document.getElementById("video");
const status = document.getElementById("status");

let stream = null;
let socket = null;

const cameraId =
  crypto.randomUUID();

async function startCamera() {
  try {
    status.textContent =
      "Requesting camera permission...";

    stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          frameRate: { ideal: 30 }
        },
        audio: false
      });

    video.srcObject = stream;

    await video.play();

    status.textContent =
      "Camera is live.";

    connectWebSocket();

  } catch (error) {
    console.error(error);

    status.textContent =
      "Camera permission was not granted.";
  }
}

function connectWebSocket() {
  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  socket = new WebSocket(
    protocol + "//" + location.host
  );

  socket.onopen = () => {
    socket.send(JSON.stringify({
      type: "register-camera",
      cameraId
    }));

    status.textContent =
      "Camera live and connected.";
  };

  socket.onmessage = async event => {
    const message =
      JSON.parse(event.data);

    if (message.type !== "signal") {
      return;
    }

    /*
      Signaling can be expanded here for
      your authorized WebRTC viewer.
    */
  };

  socket.onclose = () => {
    status.textContent =
      "Connection closed.";
  };
}

startButton.addEventListener(
  "click",
  startCamera
);
</script>

</body>
</html>
