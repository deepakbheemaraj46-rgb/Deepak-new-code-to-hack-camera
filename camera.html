<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consent Camera</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial;
  text-align:center;
  padding:20px;
}

video{
  width:95%;
  max-width:900px;
  background:#000;
  border-radius:10px;
  margin-bottom:15px;
}

#status{font-size:18px;margin:15px}
#id{font-size:13px;color:#aaa}
</style>
</head>

<body>

<h1>📷 Both Cameras</h1>

<div id="status">Connecting...</div>
<div id="id"></div>

<h3>Front Camera</h3>
<video id="frontVideo" autoplay muted playsinline></video>

<h3>Back Camera</h3>
<video id="backVideo" autoplay muted playsinline></video>

<script>
const status = document.getElementById("status");
const idBox = document.getElementById("id");

const frontVideo = document.getElementById("frontVideo");
const backVideo = document.getElementById("backVideo");

let frontStream = null;
let backStream = null;

async function startCameras() {
  try {
    // Front camera
    frontStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "user" }
      },
      audio: false
    });

    frontVideo.srcObject = frontStream;

    // Back camera
    backStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" }
      },
      audio: false
    });

    backVideo.srcObject = backStream;

    status.textContent = "🟢 Front and Back Cameras LIVE";

  } catch (err) {
    console.error(err);
    status.textContent =
      "❌ Unable to open both cameras. Your device/browser may allow only one camera at a time.";
  }
}

startCameras();
</script>

</body>
</html>
