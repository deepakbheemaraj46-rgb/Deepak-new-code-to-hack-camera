<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consent Camera</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial;
  text-align:center;
  padding:20px;
}

video{
  width:95%;
  max-width:900px;
  background:#000;
  border-radius:10px;
  margin-bottom:15px;
}

#status{
  font-size:18px;
  margin:15px;
}

#id{
  font-size:13px;
  color:#aaa;
}
</style>
</head>

<body>

<h1>📷 Both Cameras</h1>

<div id="status">Connecting...</div>
<div id="id"></div>

<h3>Front Camera</h3>
<video id="frontVideo" autoplay muted playsinline></video>

<h3>Back Camera</h3>
<video id="backVideo" autoplay muted playsinline></video>

<script>
const status = document.getElementById("status");
const idBox = document.getElementById("id");

const frontVideo = document.getElementById("frontVideo");
const backVideo = document.getElementById("backVideo");

let frontStream = null;
let backStream = null;

const peers = new Map();

const ws = new WebSocket(
  (location.protocol === "https:" ? "wss:" : "ws:") +
  "//" +
  location.host +
  "/camera"
);

function send(message) {
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(message));
  }
}

async function startCameras() {
  try {
    /*
     * FRONT CAMERA
     */
    frontStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "user"
        }
      },
      audio: false
    });

    frontVideo.srcObject = frontStream;

    /*
     * BACK CAMERA
     */
    backStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "environment"
        }
      },
      audio: false
    });

    backVideo.srcObject = backStream;

    status.textContent =
      "🟢 Front and Back Cameras LIVE";

    send({
      type: "camera-live"
    });

  } catch (err) {
    console.error(err);

    status.textContent =
      "❌ Could not open both cameras.";

    console.log(
      "Camera error:",
      err.name,
      err.message
    );
  }
}

function createPeer(viewerId) {
  if (peers.has(viewerId)) {
    return;
  }

  const pc = new RTCPeerConnection({
    iceServers: [
      {
        urls: "stun:stun.l.google.com:19302"
      }
    ]
  });

  peers.set(viewerId, pc);

  /*
   * Add FRONT camera track.
   */
  if (frontStream) {
    for (const track of frontStream.getVideoTracks()) {
      pc.addTrack(track, frontStream);
    }
  }

  /*
   * Add BACK camera track.
   */
  if (backStream) {
    for (const track of backStream.getVideoTracks()) {
      pc.addTrack(track, backStream);
    }
  }

  /*
   * Send ICE candidates to viewer.
   */
  pc.onicecandidate = event => {
    if (event.candidate) {
      send({
        type: "candidate",
        candidate: event.candidate,
        toViewerId: viewerId
      });
    }
  };

  /*
   * Create offer containing BOTH video tracks.
   */
  pc.createOffer()
    .then(offer => pc.setLocalDescription(offer))
    .then(() => {
      send({
        type: "offer",
        offer: pc.localDescription,
        toViewerId: viewerId
      });
    })
    .catch(err => {
      console.error("Offer error:", err);
    });
}

ws.onopen = () => {
  status.textContent = "🟡 Camera connected";

  startCameras();
};

ws.onmessage = async event => {
  let msg;

  try {
    msg = JSON.parse(event.data);
  } catch {
    return;
  }

  /*
   * Server gives camera ID.
   */
  if (msg.type === "role") {
    idBox.textContent =
      "Camera ID: " + msg.cameraId;
  }

  /*
   * Viewer is ready.
   */
  if (msg.type === "viewer-ready") {
    createPeer(msg.viewerId);
  }

  /*
   * Viewer ICE candidate.
   */
  if (msg.type === "candidate") {
    const pc = peers.get(msg.viewerId);

    if (pc && msg.candidate) {
      await pc.addIceCandidate(
        msg.candidate
      ).catch(err => {
        console.error(
          "ICE error:",
          err
        );
      });
    }
  }

  /*
   * Viewer answer.
   */
  if (msg.type === "answer") {
    const pc = peers.get(msg.viewerId);

    if (pc && msg.answer) {
      await pc.setRemoteDescription(
        msg.answer
      ).catch(err => {
        console.error(
          "Remote description error:",
          err
        );
      });
    }
  }

  /*
   * Viewer disconnected.
   */
  if (msg.type === "viewer-left") {
    const pc = peers.get(msg.viewerId);

    if (pc) {
      pc.close();
      peers.delete(msg.viewerId);
    }
  }
};

ws.onclose = () => {
  status.textContent =
    "🔴 Camera connection closed";
};

ws.onerror = () => {
  status.textContent =
    "❌ WebSocket connection error";
};
</script>

</body>
</html>
